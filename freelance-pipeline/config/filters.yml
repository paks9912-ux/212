# Этаж 1: правила без модели. Всё отсеянное сохраняется в базе с причиной.
max_age_hours: 48
min_text_length: 40
max_proposals: 60               # больше — шансов почти нет, не тратим модель
require_service_keyword: true   # хотя бы одно ключевое слово из ваших услуг

# Фразы, после которых заказ не стоит и минуты
stop_phrases:
  - оплата после продаж
  - оплата с продаж
  - процент с продаж
  - за долю
  - тестовое задание бесплатно
  - бесплатное тестовое
  - unpaid
  - no budget
  - revenue share
  - equity only
  - for exposure
  - нужен исходник
  - только студенты
  - crypto only
  - pay after launch
  - будущая оплата

# Курсы к доллару для нормализации бюджета. Приблизительно, правьте.
usd_rates:
  USD: 1
  EUR: 1.08
  GBP: 1.27
  RUB: 0.011
  UZS: 0.00008
  KZT: 0.0021
  UAH: 0.024
  INR: 0.012
  AUD: 0.65
  CAD: 0.73

# Сколько алертов в час максимум — чтобы Telegram не превратился в спам
max_alerts_per_hour: 6
