# Веса скоринга. Сумма положительных весов = 1, risk вычитается.
# Правьте руками. Автоматическая калибровка включается после 50 откликов.
fit: 0.22
money: 0.18
ai_leverage: 0.15
client: 0.13
speed: 0.12
competition: 0.10
repeat: 0.10
risk_penalty: 0.25

# В режиме reviews конкуренция и деньги весят меньше, скорость и клиент — больше
