<!DOCTYPE html>
<html lang="ru" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Топливо — учёт заправок техники</title>
<meta name="theme-color" content="#0c0e11" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Топливо">
<meta name="format-detection" content="telephone=no">
</head>
<body>
<main id="screen"></main>
<nav class="nav">
  <a href="#/"      data-tab="home"><span id="i-home"></span><span>Обзор</span></a>
  <a href="#/units" data-tab="units"><span id="i-units"></span><span>Техника</span></a>
  <a href="#/tank"  data-tab="tank"><span id="i-tank"></span><span>Топливо</span></a>
  <a href="#/more"  data-tab="more"><span id="i-more"></span><span>Ещё</span></a>
</nav>
<div id="toast"></div>

<style>
/* ============================================================
   Топливо — учёт заправок техники
   Приборный интерфейс: тёмная панель, крупные цифры, шкалы.
   Без внешних зависимостей.
   ============================================================ */

/* ---------- тёмная тема (основная) ---------- */
:root,
html[data-theme="dark"]{
  --bg:#0c0e11;
  --bg-2:#111419;
  --panel:#171b21;
  --panel-2:#1e232b;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.13);

  --text:#f3f5f8;
  --text-2:#98a2b3;
  --text-3:#667085;

  --amber:#ffb020;
  --amber-2:#ff8f0a;
  --amber-soft:rgba(255,176,32,.14);
  --on-amber:#171203;

  --red:#ff5c47;
  --red-soft:rgba(255,92,71,.15);
  --green:#35d07f;
  --green-soft:rgba(53,208,127,.14);
  --blue:#54a8ff;

  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}

/* ---------- светлая тема ---------- */
html[data-theme="light"]{
  --bg:#eceef1;
  --bg-2:#e3e6ea;
  --panel:#ffffff;
  --panel-2:#f4f6f8;
  --line:rgba(16,24,40,.09);
  --line-2:rgba(16,24,40,.16);

  --text:#101828;
  --text-2:#5a6472;
  --text-3:#8b95a4;

  --amber:#c2700a;
  --amber-2:#a85c05;
  --amber-soft:rgba(194,112,10,.12);
  --on-amber:#ffffff;

  --red:#d92d20;
  --red-soft:rgba(217,45,32,.1);
  --green:#12855b;
  --green-soft:rgba(18,133,91,.12);
  --blue:#175cd3;

  --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  color-scheme:light;
}

@media (prefers-color-scheme:light){
  html[data-theme="auto"]{
    --bg:#eceef1; --bg-2:#e3e6ea; --panel:#ffffff; --panel-2:#f4f6f8;
    --line:rgba(16,24,40,.09); --line-2:rgba(16,24,40,.16);
    --text:#101828; --text-2:#5a6472; --text-3:#8b95a4;
    --amber:#c2700a; --amber-2:#a85c05; --amber-soft:rgba(194,112,10,.12); --on-amber:#ffffff;
    --red:#d92d20; --red-soft:rgba(217,45,32,.1);
    --green:#12855b; --green-soft:rgba(18,133,91,.12); --blue:#175cd3;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
    color-scheme:light;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font:400 16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;
}
body.no-scroll{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;color:inherit}
input,textarea,select{-webkit-appearance:none;appearance:none}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.01em}

/* ---------- каркас ---------- */
#screen{min-height:100%;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.wrap{padding:0 14px;max-width:620px;margin:0 auto}

.topbar{
  position:sticky;top:0;z-index:40;
  height:calc(46px + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:6px;padding-left:6px;padding-right:6px;
  background:transparent;transition:background .18s linear,border-color .18s linear;
  border-bottom:1px solid transparent;
}
.topbar.solid{
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  backdrop-filter:saturate(160%) blur(14px);
  border-bottom-color:var(--line);
}
.topbar .tb-t{
  flex:1;text-align:center;font-size:15px;font-weight:600;letter-spacing:.01em;
  opacity:0;transition:opacity .18s linear;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar.solid .tb-t{opacity:1}
.tb-btn{
  min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  color:var(--amber);font-size:15px;font-weight:500;
}
.tb-btn:active{opacity:.5}
.tb-btn.right{justify-content:flex-end;padding-right:10px}

/* ---------- заголовки ---------- */
.hdr{padding:2px 2px 16px}
.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-3);
}
.hdr h1{
  margin:6px 0 0;font-size:32px;line-height:1.08;font-weight:800;letter-spacing:-.02em;
}
h2.sec{
  font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-3);margin:24px 2px 9px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;
}
h2.sec .act{font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--amber)}

/* ---------- панели ---------- */
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:15px 15px 16px;box-shadow:var(--shadow);
}
.panel + .panel{margin-top:10px}
.panel.flat{box-shadow:none}
.panel-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}

/* крупный показатель */
.metric{
  font-size:clamp(30px,9vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.05;
  margin-top:5px;overflow-wrap:anywhere;
}
.metric small{font-size:.42em;font-weight:600;color:var(--text-2);letter-spacing:0;margin-left:7px}
.sub{font-size:13.5px;color:var(--text-2);margin-top:6px}
.sub.warn{color:var(--amber)}
.sub.bad{color:var(--red);font-weight:600}
.sub.good{color:var(--green);font-weight:600}

/* ---------- плитки ---------- */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px 13px;
  text-align:left;display:block;width:100%;box-shadow:var(--shadow);
}
.tile:active{background:var(--panel-2)}
.tile .k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:clamp(17px,5.4vw,22px);font-weight:750;letter-spacing:-.02em;margin-top:7px;overflow-wrap:anywhere}
.tile .n{font-size:12.5px;color:var(--text-2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v.bad{color:var(--red)}
.tile .v.warn{color:var(--amber)}
.tile .v.good{color:var(--green)}

/* ---------- шкала бака ---------- */
.gauge{
  position:relative;height:34px;border-radius:8px;overflow:hidden;
  background:var(--panel-2);border:1px solid var(--line-2);margin-top:12px;
}
.gauge i{
  position:absolute;left:0;top:0;bottom:0;display:block;border-radius:7px 0 0 7px;
  background:linear-gradient(180deg,var(--amber),var(--amber-2));
  transition:width .45s cubic-bezier(.32,.72,0,1);
}
.gauge.low i{background:linear-gradient(180deg,#ff7a5c,var(--red))}
.gauge.good i{background:linear-gradient(180deg,#4ee59a,var(--green))}
.gauge u{
  position:absolute;inset:0;display:block;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),var(--line-2) calc(10% - 1px),var(--line-2) 10%);
}
.gauge-x{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-3);margin-top:6px}

/* шкала отклонения от нормы: центр — норма */
.devbar{display:block;position:relative;height:6px;border-radius:3px;background:var(--panel-2);margin-top:9px;overflow:hidden}
.devbar b{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line-2)}
.devbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--green)}
.devbar i.over{background:var(--amber)}
.devbar i.bad{background:var(--red)}

/* ---------- лента записей ---------- */
.stack{display:flex;flex-direction:column;gap:8px}
.ticket{
  display:flex;align-items:stretch;gap:12px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line-2);
  border-radius:11px;padding:12px 13px;box-shadow:var(--shadow);color:inherit;
}
.ticket:active{background:var(--panel-2)}
.ticket.ok{border-left-color:var(--green)}
.ticket.warn{border-left-color:var(--amber)}
.ticket.bad{border-left-color:var(--red)}
.ticket .t-ic{
  width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:17px;background:var(--panel-2);
}
.ticket .t-main{flex:1;min-width:0}
.ticket .t-title{display:block;font-size:15.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket .t-sub{display:block;font-size:12.5px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket .t-flag{display:block;font-size:12.5px;color:var(--amber);margin-top:5px;line-height:1.35}
.ticket .t-flag.bad{color:var(--red)}
.ticket .t-val{flex:none;text-align:right;align-self:center;max-width:38%}
.ticket .t-val b{display:block;font-size:16px;font-weight:750;letter-spacing:-.02em;white-space:nowrap}
.ticket .t-val span{display:block;font-size:12px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket .t-val b.bad{color:var(--red)}
.ticket .t-val b.good{color:var(--green)}

/* ---------- метки ---------- */
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  letter-spacing:.02em;padding:4px 9px;border-radius:6px;background:var(--panel-2);
  color:var(--text-2);white-space:nowrap;
}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* ---------- кнопки ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:50px;padding:0 16px;border-radius:12px;
  font-size:16px;font-weight:700;letter-spacing:.01em;
  background:var(--amber);color:var(--on-amber);
  transition:transform .12s cubic-bezier(.32,.72,0,1),opacity .12s;
}
.btn:active{transform:scale(.98);opacity:.92}
.btn.sec{background:var(--panel-2);color:var(--text);border:1px solid var(--line-2)}
.btn.ghost{background:transparent;color:var(--amber);border:1px solid var(--line-2)}
.btn.danger{background:var(--red-soft);color:var(--red);border:1px solid transparent}
.btn.sm{min-height:40px;font-size:14px;border-radius:9px;padding:0 14px}
.btn.big{min-height:56px;font-size:17px;letter-spacing:.02em}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-row{display:flex;gap:9px;margin-top:12px}
.btn-row .btn{font-size:15px;padding:0 10px}
.btn-row .btn{flex:1}

/* нижняя панель действия */
.actionbar{
  position:fixed;left:0;right:0;z-index:44;
  bottom:calc(62px + env(safe-area-inset-bottom));
  padding:10px 14px;
  background:linear-gradient(180deg,transparent,var(--bg) 42%);
  pointer-events:none;
}
.actionbar .btn{max-width:592px;margin:0 auto;pointer-events:auto;box-shadow:0 8px 24px rgba(0,0,0,.35)}

/* ---------- нижняя навигация ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb, var(--bg-2) 92%, transparent);
  -webkit-backdrop-filter:saturate(160%) blur(16px);
  backdrop-filter:saturate(160%) blur(16px);
  border-top:1px solid var(--line);
}
.nav a{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:62px;color:var(--text-3);font-size:10px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;position:relative;
}
.nav a.on{color:var(--amber)}
.nav a.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--amber);border-radius:0 0 2px 2px}
.nav a:active{opacity:.6}
.nav svg{width:23px;height:23px;display:block}

/* ---------- формы ---------- */
.form{display:flex;flex-direction:column;gap:9px}
.fld{
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 13px 10px;
  display:flex;align-items:center;gap:10px;
}
.fld.col{flex-direction:column;align-items:stretch;gap:2px}
.fld label{
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-3);flex:none;min-width:96px;
}
.fld.col label{min-width:0}
.fld input,.fld select,.fld textarea{
  flex:1;min-width:0;border:0;background:transparent;outline:none;padding:6px 0;
  font-size:17px;font-weight:600;color:var(--text);text-align:right;
}
.fld.col input,.fld.col textarea{text-align:left;font-weight:500;font-size:16px}
.fld textarea{resize:none;min-height:52px;line-height:1.4}
.fld input::placeholder,.fld textarea::placeholder{color:var(--text-3);font-weight:400}
.fld .unit{font-size:13px;color:var(--text-2);flex:none;font-weight:600}
.fld.big input{font-size:26px;font-weight:800;letter-spacing:-.02em}
.fld:focus-within{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.fld select{
  text-align:right;padding-right:16px;font-weight:600;
  background:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 16'%3E%3Cpath d='M2 6l3-3 3 3M2 10l3 3 3-3' fill='none' stroke='%23888' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right center/9px 14px;
}
.fld select option{background:var(--panel);color:var(--text)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:9px 13px;border-radius:9px;background:var(--panel);border:1px solid var(--line-2);
  font-size:13.5px;font-weight:600;color:var(--text-2);
}
.chip.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.chip:active{opacity:.6}

.note{font-size:12.5px;color:var(--text-2);line-height:1.5;padding:9px 3px 0}
.note b{color:var(--text);font-weight:650}

/* переключатель разделов */
.seg{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.seg button{
  flex:none;padding:8px 13px;border-radius:8px;background:var(--panel);border:1px solid var(--line);
  font-size:13.5px;font-weight:600;color:var(--text-2);white-space:nowrap;
}
.seg button.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.seg .cnt{opacity:.65;margin-left:4px}

.search{
  display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:0 12px;height:42px;margin-bottom:11px;
}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:15px;min-width:0}
.search svg{width:16px;height:16px;color:var(--text-3);flex:none}

/* ---------- столбики расхода ---------- */
.spark{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:14px}
.spark .b{
  flex:1;border-radius:2px 2px 0 0;min-height:3px;
  background:linear-gradient(180deg,var(--amber),var(--amber-2));
}
.spark .b.over{background:linear-gradient(180deg,#ff7a5c,var(--red))}
.spark-x{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:6px;gap:8px}

/* ---------- модальный лист ---------- */
.sheet-bg{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);
  opacity:0;transition:opacity .28s cubic-bezier(.32,.72,0,1);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.sheet-bg.in{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:93vh;
  display:flex;flex-direction:column;background:var(--bg-2);
  border-top:1px solid var(--line-2);border-radius:16px 16px 0 0;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  padding-bottom:env(safe-area-inset-bottom);max-width:620px;margin:0 auto;
  box-shadow:0 -10px 44px rgba(0,0,0,.5);
}
.sheet.in{transform:translateY(0)}
.sheet-hd{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 14px;border-bottom:1px solid var(--line);flex:none;
}
.sheet-hd .t{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;flex:1;text-align:center;color:var(--text-2)}
.sheet-hd button{font-size:15px;min-width:70px;color:var(--text-2)}
.sheet-hd button.strong{font-weight:700;text-align:right;color:var(--amber)}
.sheet-bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;flex:1}
.grab{width:34px;height:4px;border-radius:2px;background:var(--line-2);margin:7px auto 0;flex:none}

/* ---------- уведомление ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translate(-50%,12px);z-index:90;
  background:var(--text);color:var(--bg);font-size:14px;font-weight:650;
  padding:11px 17px;border-radius:10px;max-width:86vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s cubic-bezier(.32,.72,0,1);
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
#toast.in{opacity:1;transform:translate(-50%,0)}

/* ---------- служебное ---------- */
.empty{text-align:center;padding:44px 20px 30px;color:var(--text-2)}
.empty .ic{font-size:40px;margin-bottom:12px;opacity:.65}
.empty .t{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px;letter-spacing:-.01em}
.empty .d{font-size:14px;line-height:1.5;max-width:340px;margin:0 auto}

.rows{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rows > * + *{border-top:1px solid var(--line)}
.row{
  display:flex;align-items:center;gap:12px;min-height:52px;padding:11px 14px;
  width:100%;text-align:left;color:inherit;background:none;
}
.row:active{background:var(--panel-2)}
.row .r-main{flex:1;min-width:0}
.row .r-t{display:block;font-size:15.5px;font-weight:600}
.row .r-s{display:block;font-size:12.5px;color:var(--text-2);margin-top:3px}
.row .r-v{flex:none;font-size:15px;font-weight:700;color:var(--amber);text-align:right}
.row .r-v small{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-top:3px}
.row.danger .r-t{color:var(--red)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:14.5px}
.kv + .kv{border-top:1px solid var(--line)}
.kv .k{color:var(--text-2)}
.kv .v{font-weight:700;text-align:right;overflow-wrap:anywhere}
.kv .v.bad{color:var(--red)}
.kv .v.good{color:var(--green)}

.progress{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;border-radius:4px;background:var(--amber);transition:width .4s cubic-bezier(.32,.72,0,1)}
.progress.bad i{background:var(--red)}
.progress.good i{background:var(--green)}

.fade{animation:fade .2s cubic-bezier(.32,.72,0,1)}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.shake{animation:shake .4s}
@keyframes shake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

/* ---------- экран блокировки ---------- */
.lock{
  position:fixed;inset:0;z-index:100;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
}
.pin-dots{display:flex;gap:15px}
.pin-dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--text-3)}
.pin-dots i.on{background:var(--amber);border-color:var(--amber)}
.keypad{display:grid;grid-template-columns:repeat(3,70px);gap:16px;justify-content:center}
.keypad button{
  width:70px;height:70px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  font-size:25px;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:center;
}
.keypad button:active{background:var(--panel-2)}
.keypad button.blank{background:none;border:0;pointer-events:none}

/* ---------- диалог ---------- */
.ask-bg{
  position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;padding:26px;
  opacity:0;transition:opacity .18s ease;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
.ask-bg.in{opacity:1}
.ask{
  width:100%;max-width:320px;background:var(--panel);border:1px solid var(--line-2);
  border-radius:14px;overflow:hidden;
  transform:scale(.94);transition:transform .2s cubic-bezier(.32,.72,0,1);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
}
.ask-bg.in .ask{transform:scale(1)}
.ask .ask-t{font-size:17px;font-weight:750;padding:18px 18px 0;letter-spacing:-.01em}
.ask .ask-d{font-size:13.5px;color:var(--text-2);line-height:1.45;padding:7px 18px 16px}
.ask .ask-btns{display:flex;gap:9px;padding:0 14px 14px}
.ask .ask-btns button{
  flex:1;min-height:44px;border-radius:10px;font-size:15px;font-weight:650;
  background:var(--panel-2);color:var(--text);border:1px solid var(--line-2);
}
.ask .ask-btns button.go{background:var(--amber);color:var(--on-amber);border-color:transparent}
.ask .ask-btns button.danger{background:var(--red);color:#fff;border-color:transparent}
.ask .ask-btns button:active{opacity:.8}
</style>

<script>
/* Утилиты: деньги, литры, счётчики, даты, склонения, DOM-хелперы */
(function (w) {
  'use strict';

  var U = {};

  /* ---------- id ---------- */
  U.uid = function () {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  };

  /* ---------- экранирование ---------- */
  U.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };

  /* ---------- числа ---------- */
  U.num = function (v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    var s = String(v == null ? '' : v).replace(/\s| /g, '').replace(',', '.').replace(/[^\d.\-]/g, '');
    var n = parseFloat(s);
    return isFinite(n) ? n : 0;
  };

  var nf0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
  var nf1 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  var nf2 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  U.int = function (v) { return nf0.format(Math.round(U.num(v))); };
  U.dec = function (v, n) {
    var x = U.num(v);
    if (n === 2) return nf2.format(x);
    if (n === 0 || Math.abs(x) >= 1000) return nf0.format(Math.round(x));
    return nf1.format(x);
  };

  /* ---------- валюта (одна на всё приложение) ---------- */
  U.CUR = [
    { code: 'UZS', sym: 'сум', name: 'Узбекский сум', dec: 0 },
    { code: 'KGS', sym: 'сом', name: 'Киргизский сом', dec: 0 },
    { code: 'KZT', sym: '₸', name: 'Казахский тенге', dec: 0 },
    { code: 'RUB', sym: '₽', name: 'Российский рубль', dec: 0 },
    { code: 'USD', sym: '$', name: 'Доллар США', dec: 2 },
    { code: 'EUR', sym: '€', name: 'Евро', dec: 2 }
  ];
  U.curCode = function () {
    return (w.DB && DB.data && DB.data.settings && DB.data.settings.currency) || 'UZS';
  };
  U.curInfo = function (code) {
    code = code || U.curCode();
    for (var i = 0; i < U.CUR.length; i++) if (U.CUR[i].code === code) return U.CUR[i];
    return U.CUR[0];
  };
  U.sym = function (code) { return U.curInfo(code).sym; };

  /* U.money(12000) → «12 000 сум»; U.money(x, {noCur:true}) — без символа */
  U.money = function (v, opt) {
    opt = opt || {};
    var info = U.curInfo();
    var n = U.num(v), sign = n < 0 ? '−' : '', abs = Math.abs(n);
    var frac = opt.exact || (info.dec === 2 && abs > 0 && abs < 1000 && Math.round(abs) !== abs);
    var body = frac ? nf2.format(abs) : nf0.format(Math.round(abs));
    return sign + body + (opt.noCur ? '' : ' ' + info.sym);
  };

  U.moneyShort = function (v) {
    var sym = ' ' + U.sym();
    var n = Math.abs(U.num(v)), s = U.num(v) < 0 ? '−' : '';
    if (n >= 1e9) return s + nf1.format(n / 1e9) + ' млрд' + sym;
    if (n >= 1e6) return s + nf1.format(n / 1e6) + ' млн' + sym;
    if (n >= 1e5) return s + nf0.format(Math.round(n / 1e3)) + ' тыс' + sym;
    return s + nf0.format(Math.round(n)) + sym;
  };

  U.pct = function (v, sign) {
    var n = U.num(v);
    var s = (sign && n > 0 ? '+' : '') + U.dec(Math.abs(n) < 10 ? n : Math.round(n), Math.abs(n) < 10 ? 1 : 0);
    return s + '%';
  };

  /* ---------- топливо ---------- */
  U.FUELS = [
    { code: 'dt', name: 'Дизель', short: 'ДТ' },
    { code: 'ai80', name: 'Бензин АИ-80', short: 'АИ-80' },
    { code: 'ai92', name: 'Бензин АИ-92', short: 'АИ-92' },
    { code: 'ai95', name: 'Бензин АИ-95', short: 'АИ-95' },
    { code: 'gas', name: 'Газ', short: 'Газ' }
  ];
  U.fuel = function (code) {
    for (var i = 0; i < U.FUELS.length; i++) if (U.FUELS[i].code === code) return U.FUELS[i];
    return U.FUELS[0];
  };
  U.fuelShort = function (code) { return U.fuel(code).short; };

  /* ---------- виды техники ---------- */
  U.KINDS = [
    { code: 'truck', name: 'Самосвал, грузовик', ic: '🚛', meter: 'km' },
    { code: 'car', name: 'Легковая, пикап', ic: '🚗', meter: 'km' },
    { code: 'excavator', name: 'Экскаватор', ic: '🚜', meter: 'mh' },
    { code: 'loader', name: 'Погрузчик, бульдозер', ic: '🏗️', meter: 'mh' },
    { code: 'tractor', name: 'Трактор', ic: '🌾', meter: 'mh' },
    { code: 'gen', name: 'Генератор, насос', ic: '⚡', meter: 'mh' },
    { code: 'other', name: 'Другое', ic: '🛠️', meter: 'km' }
  ];
  U.kind = function (code) {
    for (var i = 0; i < U.KINDS.length; i++) if (U.KINDS[i].code === code) return U.KINDS[i];
    return U.KINDS[U.KINDS.length - 1];
  };

  /* ---------- литры и счётчики ---------- */
  U.liters = function (v, noUnit) { return U.dec(v, Math.abs(U.num(v)) >= 100 ? 0 : 1) + (noUnit ? '' : ' л'); };
  U.meterUnit = function (m) { return m === 'mh' ? 'мч' : 'км'; };
  U.meterName = function (m) { return m === 'mh' ? 'моточасы' : 'пробег'; };
  U.meter = function (v, m) { return U.int(v) + ' ' + U.meterUnit(m); };
  U.rateUnit = function (m) { return m === 'mh' ? 'л/мч' : 'л/100 км'; };
  U.rate = function (v, m, noUnit) {
    if (v == null) return '—';
    return U.dec(v, 1) + (noUnit ? '' : ' ' + U.rateUnit(m));
  };
  /* наработка, за которую тратится норма: 100 км или 1 моточас */
  U.rateBase = function (m) { return m === 'mh' ? 1 : 100; };

  /* ---------- склонение ---------- */
  U.plural = function (n, one, few, many) {
    n = Math.abs(Math.round(n)) % 100;
    var n1 = n % 10;
    if (n > 10 && n < 20) return many;
    if (n1 > 1 && n1 < 5) return few;
    if (n1 === 1) return one;
    return many;
  };
  U.days = function (n) { return Math.round(n) + ' ' + U.plural(n, 'день', 'дня', 'дней'); };
  U.unitsWord = function (n) { return n + ' ' + U.plural(n, 'единица', 'единицы', 'единиц'); };

  /* ---------- даты ('YYYY-MM-DD') ---------- */
  U.today = function () { return U.iso(new Date()); };
  U.iso = function (d) {
    var m = String(d.getMonth() + 1), day = String(d.getDate());
    return d.getFullYear() + '-' + (m.length < 2 ? '0' + m : m) + '-' + (day.length < 2 ? '0' + day : day);
  };
  U.parse = function (s) {
    if (!s) return null;
    var p = String(s).slice(0, 10).split('-');
    if (p.length !== 3) return null;
    return Date.UTC(+p[0], +p[1] - 1, +p[2]);
  };
  U.diffDays = function (a, b) {
    var x = U.parse(a), y = U.parse(b);
    if (x == null || y == null) return 0;
    return Math.round((y - x) / 86400000);
  };
  U.addDays = function (s, n) {
    var t = U.parse(s);
    if (t == null) return s;
    var d = new Date(t + n * 86400000);
    return d.getUTCFullYear() + '-' +
      String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(d.getUTCDate()).padStart(2, '0');
  };
  U.addMonths = function (s, n) {
    var t = U.parse(s);
    if (t == null) return s;
    var d = new Date(t), day = d.getUTCDate();
    d.setUTCMonth(d.getUTCMonth() + n);
    if (d.getUTCDate() < day) d.setUTCDate(0);
    return d.getUTCFullYear() + '-' +
      String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(d.getUTCDate()).padStart(2, '0');
  };

  var MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  var MONF = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var MONN = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];

  U.fmtDate = function (s) {
    var t = U.parse(s);
    if (t == null) return '—';
    var d = new Date(t), cy = new Date().getFullYear();
    var out = d.getUTCDate() + ' ' + MON[d.getUTCMonth()];
    if (d.getUTCFullYear() !== cy) out += ' ' + d.getUTCFullYear();
    return out;
  };
  U.fmtDateFull = function (s) {
    var t = U.parse(s);
    if (t == null) return '—';
    var d = new Date(t);
    return d.getUTCDate() + ' ' + MONF[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
  };
  U.relDate = function (s) {
    var n = U.diffDays(U.today(), s);
    if (n === 0) return 'сегодня';
    if (n === 1) return 'завтра';
    if (n === -1) return 'вчера';
    if (n > 1 && n < 30) return 'через ' + U.days(n);
    if (n < -1 && n > -30) return U.days(-n) + ' назад';
    return U.fmtDate(s);
  };
  U.monthKey = function (s) { return String(s).slice(0, 7); };
  U.monthName = function (key) {
    var p = String(key).split('-');
    var n = MONN[+p[1] - 1] || '';
    return n.charAt(0).toUpperCase() + n.slice(1) + ' ' + p[0];
  };

  /* ---------- DOM ---------- */
  U.$ = function (sel, root) { return (root || document).querySelector(sel); };
  U.$$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  U.toast = function (msg) {
    var t = U.$('#toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('in');
    clearTimeout(U._tt);
    U._tt = setTimeout(function () { t.classList.remove('in'); }, 2300);
  };

  var PALETTE = ['#0a84ff', '#30d158', '#ff9f0a', '#ff453a', '#bf5af2', '#64d2ff', '#ffd60a', '#ff375f', '#5e5ce6', '#66d4cf'];
  U.color = function (str) {
    var h = 0, s = String(str || '?');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  };

  w.U = U;
})(window);

/* Хранилище: всё лежит на телефоне (localStorage), ничего не уходит в сеть */
(function (w) {
  'use strict';

  var KEY = 'toplivo.db.v1';
  var BAK = 'toplivo.autobackup';

  var DB = {
    data: null,
    listeners: [],

    empty: function () {
      return {
        version: 1,
        createdAt: U.today(),
        isDemo: false,
        settings: {
          currency: 'UZS',
          theme: 'auto',
          fuel: 'dt',             // топливо по умолчанию
          source: 'tank',         // откуда заправляют чаще
          prices: {},             // последняя цена по виду топлива
          overrun: 10,            // порог перерасхода для предупреждения, %
          lowDays: 5,             // «топливо кончается», дней
          pin: null,
          lastExport: null
        },
        units: [],                // техника
        fills: [],                // заправки
        supplies: [],             // приход топлива в бочку
        checks: []                // замеры остатка
      };
    },

    load: function () {
      var raw = null;
      try { raw = localStorage.getItem(KEY); } catch (e) { }
      if (!raw) { this.data = this.empty(); return false; }
      try {
        this.data = this.migrate(JSON.parse(raw));
        return true;
      } catch (e) {
        try {
          var b = localStorage.getItem(BAK);
          if (b) { this.data = this.migrate(JSON.parse(b)); U.toast('Данные восстановлены из копии'); return true; }
        } catch (e2) { }
        this.data = this.empty();
        return false;
      }
    },

    migrate: function (d) {
      d = d || {};
      var base = this.empty();
      d.settings = Object.assign(base.settings, d.settings || {});
      d.settings.prices = d.settings.prices || {};
      d.isDemo = !!d.isDemo;
      ['units', 'fills', 'supplies', 'checks'].forEach(function (k) {
        d[k] = Array.isArray(d[k]) ? d[k] : [];
      });
      d.units.forEach(function (u) {
        if (!u.meter) u.meter = U.kind(u.kind).meter;
        if (!u.fuel) u.fuel = d.settings.fuel;
        u.norm = U.num(u.norm);
        u.service = u.service || null;
        u.archived = !!u.archived;
      });
      d.fills.forEach(function (f) {
        f.liters = U.num(f.liters);
        f.price = U.num(f.price);
        if (!f.cost) f.cost = f.liters * f.price;
        f.full = f.full !== false;
        if (!f.source) f.source = 'tank';
      });
      d.version = 1;
      return d;
    },

    save: function () {
      try {
        var json = JSON.stringify(this.data);
        localStorage.setItem(KEY, json);
        try { localStorage.setItem(BAK, json); } catch (e) { }
        if (w.CALC) CALC.clearCache();
      } catch (e) {
        U.toast('Не удалось сохранить: нет места в памяти');
        return false;
      }
      this.listeners.forEach(function (f) { try { f(); } catch (e) { } });
      return true;
    },

    onChange: function (f) { this.listeners.push(f); },

    /* ---------- техника ---------- */
    units: function (withArchived) {
      return this.data.units.filter(function (u) { return withArchived || !u.archived; });
    },
    unit: function (id) { return this.data.units.filter(function (u) { return u.id === id; })[0] || null; },
    unitByName: function (name) {
      var n = String(name || '').trim().toLowerCase();
      return this.data.units.filter(function (u) { return u.name.trim().toLowerCase() === n; })[0] || null;
    },
    addUnit: function (u) {
      u.id = u.id || U.uid();
      u.createdAt = u.createdAt || U.today();
      if (!u.meter) u.meter = U.kind(u.kind).meter;
      this.data.units.push(u);
      this.save();
      return u;
    },
    updUnit: function (id, patch) {
      var u = this.unit(id);
      if (u) { Object.assign(u, patch); this.save(); }
      return u;
    },
    delUnit: function (id) {
      this.data.fills = this.data.fills.filter(function (f) { return f.unitId !== id; });
      this.data.units = this.data.units.filter(function (u) { return u.id !== id; });
      this.save();
    },

    /* ---------- заправки ---------- */
    fills: function () { return this.data.fills; },
    fill: function (id) { return this.data.fills.filter(function (f) { return f.id === id; })[0] || null; },
    fillsOf: function (unitId) {
      return this.data.fills.filter(function (f) { return f.unitId === unitId; }).sort(DB.byDate);
    },
    byDate: function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return U.num(a.meter) - U.num(b.meter);
    },
    addFill: function (f) {
      f.id = f.id || U.uid();
      f.date = f.date || U.today();
      f.liters = U.num(f.liters);
      f.price = U.num(f.price);
      f.cost = U.num(f.cost) || f.liters * f.price;
      f.createdAt = f.createdAt || U.today();
      this.data.fills.push(f);
      if (f.price > 0) this.data.settings.prices[f.fuel] = f.price;
      this.save();
      return f;
    },
    updFill: function (id, patch) {
      var f = this.fill(id);
      if (f) {
        Object.assign(f, patch);
        f.cost = U.num(f.cost) || U.num(f.liters) * U.num(f.price);
        this.save();
      }
      return f;
    },
    delFill: function (id) {
      this.data.fills = this.data.fills.filter(function (f) { return f.id !== id; });
      this.save();
    },
    /* последняя заправка — из неё подставляются значения в новую */
    lastFill: function (unitId) {
      var list = unitId ? this.fillsOf(unitId) : this.data.fills.slice().sort(DB.byDate);
      return list.length ? list[list.length - 1] : null;
    },
    price: function (fuel) { return U.num(this.data.settings.prices[fuel]); },

    /* ---------- приход топлива ---------- */
    addSupply: function (s) {
      s.id = s.id || U.uid();
      s.date = s.date || U.today();
      s.liters = U.num(s.liters);
      s.price = U.num(s.price);
      s.cost = U.num(s.cost) || s.liters * s.price;
      this.data.supplies.push(s);
      if (s.price > 0) this.data.settings.prices[s.fuel] = s.price;
      this.save();
      return s;
    },
    delSupply: function (id) {
      this.data.supplies = this.data.supplies.filter(function (s) { return s.id !== id; });
      this.save();
    },

    /* ---------- замеры остатка ---------- */
    addCheck: function (c) {
      c.id = c.id || U.uid();
      c.date = c.date || U.today();
      c.liters = U.num(c.liters);
      this.data.checks.push(c);
      this.save();
      return c;
    },
    delCheck: function (id) {
      this.data.checks = this.data.checks.filter(function (c) { return c.id !== id; });
      this.save();
    },

    /* ---------- экспорт / импорт ---------- */
    exportJSON: function () { return JSON.stringify(this.data, null, 2); },

    importJSON: function (text, mode) {
      var d = JSON.parse(text);
      if (!d || !Array.isArray(d.units) || !Array.isArray(d.fills)) {
        throw new Error('Не похоже на резервную копию приложения');
      }
      d = this.migrate(d);
      if (mode === 'replace') {
        this.data = d;
      } else {
        var self = this, idmap = {};
        d.units.forEach(function (u) {
          var ex = self.unitByName(u.name);
          if (ex) { idmap[u.id] = ex.id; return; }
          var nid = U.uid();
          idmap[u.id] = nid;
          self.data.units.push(Object.assign({}, u, { id: nid }));
        });
        var have = {};

    h += '<div class="fld"><label>Сумма</label><input id="f-cost" type="text" inputmode="decimal" placeholder="0"><span class="unit">' + esc(U.sym()) + '</span></div>';
    h += '<div class="fld"><label>Дата</label><input id="f-date" type="date" value="' + (f ? f.date : U.today()) + '"></div>';
    h += '</div>';

    h += '<div class="chips" style="margin-top:10px">' +
      '<button class="chip' + (source === 'tank' ? ' on' : '') + '" data-src="tank">Из бочки</button>' +
      '<button class="chip' + (source === 'station' ? ' on' : '') + '" data-src="station">АЗС</button>' +
      '<button class="chip' + (full ? ' on' : '') + '" data-full="1">До полного бака</button>' +
      (forecast ? '<button class="chip" data-meter="' + forecast + '">Счётчик ≈ ' + U.int(forecast) + '</button>' : '') +
      (prev && prev.liters ? '<button class="chip" data-lit="' + prev.liters + '">Как в прошлый раз · ' + U.liters(prev.liters) + '</button>' : '') +
      '</div>';

    h += '<div class="panel" id="f-prev" style="margin-top:12px"></div>';

    h += '<div class="form" style="margin-top:10px">' +
      '<div class="fld"><label>Заправлял</label><input id="f-op" type="text" placeholder="имя водителя" value="' +
      esc(f ? f.operator || '' : (preset ? preset.operator || '' : '')) + '"></div>' +
      '<div class="fld col"><label>Заметка</label><textarea id="f-note" placeholder="объект, смена, номер чека…">' +
      esc(f ? f.note || '' : '') + '</textarea></div></div>';

    if (f) h += '<button class="btn danger" style="margin-top:12px" data-del="' + f.id + '">Удалить заправку</button>';

    App.sheet({
      title: f ? 'Заправка' : 'Новая заправка',
      html: h, save: f ? 'Сохранить' : 'Записать',
      onOpen: function (bd) {
        var $ = function (sel) { return bd.querySelector(sel); };
        var litEl = $('#f-lit'), priceEl = $('#f-price'), costEl = $('#f-cost'), meterEl = $('#f-meter');
        var srcEl = source, fullEl = full;

        function cur() { return DB.unit($('#f-unit').value) || u; }

        function money() {
          var lit = U.num(litEl.value), pr = U.num(priceEl.value);
          if (lit > 0 && pr > 0) costEl.value = U.int(lit * pr);
        }
        money();

        function draw() {
          var cu = cur(), lit = U.num(litEl.value), meter = U.num(meterEl.value);
          var cs = CALC.unit(cu);
          var pv = f ? prevFill(cu, f) : cs.last;
          var out = [];

          if (lit > 0 && meter > 0 && pv && U.num(pv.meter) > 0) {
            var run = meter - U.num(pv.meter);
            if (run > 0) {
              var rate = lit / run * U.rateBase(cu.meter);
              var txt = 'Расход на участке: <b>' + U.rate(rate, cu.meter) + '</b> за ' + U.meter(run, cu.meter);
              if (cu.norm > 0) {
                var dev = (rate - cu.norm) / cu.norm * 100;
                txt += '<br>Норма ' + U.rate(cu.norm, cu.meter) + ' — ' +
                  (dev > 0.5 ? '<b style="color:var(--red)">перерасход ' + U.pct(dev, true) + '</b>'
                    : dev < -0.5 ? '<b style="color:var(--green)">экономия ' + U.pct(-dev) + '</b>' : 'ровно по норме');
              }
              out.push(txt);
            } else if (run < 0) {
              out.push('<b style="color:var(--red)">Счётчик меньше прошлого показания (' + U.int(pv.meter) + ')</b> — проверьте цифру');
            } else {
              out.push('<b style="color:var(--amber)">Счётчик не изменился с прошлой заправки</b>');
            }
          } else if (lit > 0 && !meter) {
            out.push('Без показания счётчика расход посчитать не получится — запись сохранится, но в статистику не войдёт.');
          }

          if (cu.tank > 0 && lit > cu.tank * 1.03) {
            out.push('<b style="color:var(--red)">Залито больше объёма бака (' + U.liters(cu.tank) + ')</b>');
          }
          if (srcEl === 'tank' && lit > 0) {
            var tk = CALC.tank(cu.fuel);
            var left = tk.balance - lit + (f && f.source === 'tank' ? U.num(f.liters) : 0);
            out.push('В бочке останется <b>' + U.liters(left) + '</b>' + (left < 0 ? ' — учёт уйдёт в минус' : ''));
          }
          if (!fullEl) out.push('Заправка не до полного — расход посчитается на следующей полной.');

          $('#f-prev').innerHTML = '<div style="font-size:14px;line-height:1.55;color:var(--text-2)">' +
            (out.length ? out.join('<br><br>')
              : 'Введите литры и показание счётчика — расход посчитается сразу.') + '</div>';
        }
        draw();

        litEl.addEventListener('input', function () { money(); draw(); });
        priceEl.addEventListener('input', function () { money(); draw(); });
        costEl.addEventListener('input', function () {
          var c = U.num(costEl.value), lit = U.num(litEl.value), pr = U.num(priceEl.value);
          if (lit > 0) priceEl.value = U.int(c / lit);
          else if (pr > 0) litEl.value = U.dec(c / pr, 1);
          draw();
        });
        meterEl.addEventListener('input', draw);
        $('#f-unit').addEventListener('change', function () {
          var cu = cur(), cs = CALC.unit(cu);
          $('#f-mu').textContent = U.meterUnit(cu.meter);
          meterEl.placeholder = cs.last ? 'было ' + U.int(cs.last.meter) : U.meterName(cu.meter);
          if (!priceEl.value) priceEl.value = DB.price(cu.fuel) || '';
          draw();
        });

        bd.addEventListener('click', function (e) {
          var c = e.target.closest('.chip');
          if (c) {
            if (c.dataset.src) {
              srcEl = c.dataset.src;
              U.$$('[data-src]', bd).forEach(function (b) { b.classList.toggle('on', b.dataset.src === srcEl); });
            } else if (c.dataset.full) {
              fullEl = !fullEl;
              c.classList.toggle('on', fullEl);
            } else if (c.dataset.meter) {
              meterEl.value = c.dataset.meter;
            } else if (c.dataset.lit) {
              litEl.value = String(c.dataset.lit).replace('.', ',');
              money();
            }
            draw();
            return;
          }
          var d = e.target.closest('[data-del]');
          if (d) {
            App.closeSheet();
            App.ask({
              title: 'Удалить заправку?',
              text: 'Расход и остаток в бочке пересчитаются заново.',
              ok: 'Удалить', danger: true,
              onOk: function () { DB.delFill(d.dataset.del); U.toast('Заправка удалена'); App.render(); }
            });
          }
        });

        setTimeout(function () { litEl.focus(); }, 380);
        F._fillState = function () { return { source: srcEl, full: fullEl }; };
      },
      onSave: function (bd) {
        var stt = F._fillState();
        var cu = DB.unit(bd.querySelector('#f-unit').value);
        var lit = U.num(bd.querySelector('#f-lit').value);
        if (!cu) { U.toast('Выберите технику'); return false; }
        if (lit <= 0) { U.toast('Введите литры'); return false; }
        var pr = U.num(bd.querySelector('#f-price').value);
        var patch = {
          unitId: cu.id,
          date: bd.querySelector('#f-date').value || U.today(),
          liters: lit,
          price: pr,
          cost: U.num(bd.querySelector('#f-cost').value) || lit * pr,
          meter: U.num(bd.querySelector('#f-meter').value),
          fuel: cu.fuel,
          source: stt.source,
          full: stt.full,
          operator: bd.querySelector('#f-op').value.trim(),
          note: bd.querySelector('#f-note').value.trim()
        };
        if (f) { DB.updFill(f.id, patch); U.toast('Сохранено'); }
        else {
          DB.addFill(patch);
          var seg = CALC.segmentOf(cu, DB.lastFill(cu.id).id);
          U.toast(seg && seg.rate != null ? 'Записано · расход ' + U.rate(seg.rate, cu.meter) : 'Заправка записана');
        }
        App.render();
        return true;
      }
    });
  };

    var h = '<div class="form">' +

      U.FUELS.map(function (x) {

      }).join('') + '</select></div>' +

      (DB.price(st.fuel) || '') + '"><span class="unit">' + esc(U.sym()) + '</span></div>' +

    App.sheet({

        var lit = bd.querySelector('#s-lit'), pr = bd.querySelector('#s-price'), cost = bd.querySelector('#s-cost');
        function draw() {
          var l = U.num(lit.value), p = U.num(pr.value);
          if (l > 0 && p > 0) cost.value = U.int(l * p);
          var t = CALC.tank(bd.querySelector('#s-fuel').value);
          bd.querySelector('#s-prev').innerHTML = '<div style="font-size:14px;line-height:1.55;color:var(--text-2)">' +

        });

      },

          note: bd.querySelector('#k-note').value.trim()
        });

        App.render();
        return true;
      }
    });

      '<div class="seg" id="mode"><button data-m="merge" class="on">Добавить к текущим</button>' +
      '<button data-m="replace">Заменить всё</button></div>';

    App.sheet({
      title: 'Загрузка базы', html: h, save: 'Загрузить',
      onOpen: function (bd) {
        bd.querySelector('#pick').addEventListener('click', function () { bd.querySelector('#file').click(); });
        bd.querySelector('#file').addEventListener('change', function (e) {
          var file = e.target.files[0];
          if (!file) return;
          var fr = new FileReader();
          fr.onload = function () { bd.querySelector('#paste').value = fr.result; U.toast('Файл прочитан: ' + file.name); };
          fr.readAsText(file);
        });
        bd.addEventListener('click', function (e) {
          var m = e.target.closest('[data-m]');
          if (m) { U.$$('#mode button', bd).forEach(function (b) { b.classList.remove('on'); }); m.classList.add('on'); }
        });
      },
      onSave: function (bd) {
        var text = bd.querySelector('#paste').value.trim();
        if (!text) { U.toast('Не выбран файл и не вставлен текст'); return false; }
        var mode = bd.querySelector('#mode .on').dataset.m;

        function run() {
          try {
            if (text[0] === '{') {
              var res = DB.importJSON(text, mode);
              U.toast('Загружено: ' + U.unitsWord(res.units) + ', заправок ' + res.fills);
            } else {
              if (mode === 'replace') { DB.data = DB.empty(); DB.save(); }
              var n = DB.importCSV(text);
              U.toast(n ? 'Добавлено заправок: ' + n : 'Ни одной строки не распознано');
            }
            App.closeSheet();
            App.go('#/');
          } catch (err) {
            U.toast('Ошибка: ' + err.message);
          }
        }

        if (mode === 'replace') {
          App.ask({
            title: 'Заменить всю базу?',
            text: 'Техника, заправки и приход топлива будут стёрты и заменены загружаемыми.',
            ok: 'Заменить', danger: true, onOk: run
          });
        } else run();
        return false;
      }
    });
  };

  /* ============ КОД-ПАРОЛЬ ============ */
  F.pinSheet = function () {
    var h = '<div class="note" style="padding:0 2px 12px">Код из 4 цифр будет спрашиваться при каждом запуске приложения.</div>' +
      '<div class="form"><div class="fld"><label>Новый код</label>' +
      '<input id="pin1" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="••••" style="letter-spacing:6px"></div>' +
      '<div class="fld"><label>Ещё раз</label>' +
      '<input id="pin2" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="••••" style="letter-spacing:6px"></div></div>' +
      '<div class="note">Код закрывает вход от чужих глаз, но не шифрует базу. Резервную копию он не отменяет.</div>';
    App.sheet({
      title: 'Код-пароль', html: h, save: 'Включить',
      onOpen: function (bd) { setTimeout(function () { bd.querySelector('#pin1').focus(); }, 380); },
      onSave: function (bd) {
        var a = bd.querySelector('#pin1').value.trim(), b = bd.querySelector('#pin2').value.trim();
        if (!/^\d{4}$/.test(a)) { U.toast('Нужен код из 4 цифр'); return false; }
        if (a !== b) { U.toast('Коды не совпадают'); return false; }
        DB.data.settings.pin = App.hash(a);
        DB.save(); U.toast('Код включён'); App.render();
        return true;
      }
    });
  };

  w.F = F;
})(window);

/* Запуск, навигация, модальные листы, действия */
(function (w) {
  'use strict';

  var App = { route: '#/', lastRoute: null };

  /* ---------- простая хэш-функция для кода-пароля ---------- */
  App.hash = function (s) {
    var h = 5381, str = 'toplivo.' + s;
    for (var i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
    return h.toString(36);
  };

  /* ---------- навигация ---------- */
  App.go = function (hash) {
    if (location.hash === hash) App.render();
    else location.hash = hash;
  };

  App.render = function () {
    var r = location.hash || '#/';
    App.route = r;
    var scr = U.$('#screen'), html = '';

    if (r.indexOf('#/unit/') === 0) html = V.unitDetail(r.slice(7));
    else if (r === '#/units') html = V.units();
    else if (r === '#/tank') html = V.tank();
    else if (r === '#/more') html = V.more();
    else html = V.home();

    scr.innerHTML = html;
    var wrap = scr.querySelector('.wrap');
    if (wrap) wrap.classList.add('fade');

    /* панель действия внизу — главное действие экрана всегда под большим пальцем */
    var action = null;
    if (r === '#/' || r === '#/units') action = ['new-fill', 'Записать заправку'];
    else if (r === '#/tank') action = ['new-supply', 'Внести приход'];
    else if (r.indexOf('#/unit/') === 0) action = ['new-fill', 'Записать заправку'];
    if (action && DB.units().length) {
      var bar = document.createElement('div');
      bar.className = 'actionbar';
      bar.innerHTML = '<button class="btn big" data-act="' + action[0] + '"' +
        (r.indexOf('#/unit/') === 0 ? ' data-unit="' + r.slice(7) + '"' : '') + '>＋ ' + action[1] + '</button>';
      scr.appendChild(bar);
    }

    U.$$('.nav a').forEach(function (a) {
      var base = r.indexOf('#/unit/') === 0 ? '#/units' : r;
      a.classList.toggle('on', a.getAttribute('href') === base);
    });

    if (App.lastRoute !== r) { w.scrollTo(0, 0); App.lastRoute = r; }
    App.onScroll();
  };

  App.onScroll = function () {
    var tb = U.$('#topbar');
    if (tb) tb.classList.toggle('solid', w.scrollY > 26);
  };

  /* ---------- модальный лист ---------- */
  App.sheet = function (opt) {
    App.closeSheet(true);
    var bg = document.createElement('div');
    bg.className = 'sheet-bg';
    var sh = document.createElement('div');
    sh.className = 'sheet';
    sh.innerHTML = '<div class="grab"></div>' +
      '<div class="sheet-hd"><button data-sheet="cancel">Отмена</button>' +
      '<span class="t">' + U.esc(opt.title || '') + '</span>' +
      (opt.save ? '<button class="strong" data-sheet="save">' + U.esc(opt.save) + '</button>'
        : '<span style="min-width:64px"></span>') + '</div>' +
      '<div class="sheet-bd"></div>';
    var bd = sh.querySelector('.sheet-bd');
    bd.innerHTML = opt.html || '';
    document.body.appendChild(bg);
    document.body.appendChild(sh);
    document.body.classList.add('no-scroll');

    requestAnimationFrame(function () { bg.classList.add('in'); sh.classList.add('in'); });

    bg.addEventListener('click', function () { App.closeSheet(); });
    sh.addEventListener('click', function (e) {
      var b = e.target.closest('[data-sheet]');
      if (!b) return;
      if (b.dataset.sheet === 'cancel') return App.closeSheet();
      if (b.dataset.sheet === 'save') {
        if (!opt.onSave || opt.onSave(bd) !== false) App.closeSheet();
      }
    });
    App._sheet = { bg: bg, sh: sh };
    if (opt.onOpen) opt.onOpen(bd);
  };

  App.closeSheet = function (now) {
    var s = App._sheet;
    if (!s) return;
    App._sheet = null;
    document.body.classList.remove('no-scroll');
    if (now) { s.bg.remove(); s.sh.remove(); return; }
    s.bg.classList.remove('in'); s.sh.classList.remove('in');
    setTimeout(function () { s.bg.remove(); s.sh.remove(); }, 340);
  };

  /* ---------- диалог подтверждения (вместо системного confirm) ---------- */
  App.ask = function (opt) {
    var bg = document.createElement('div');
    bg.className = 'ask-bg';
    bg.innerHTML = '<div class="ask"><div class="ask-t">' + U.esc(opt.title) + '</div>' +
      (opt.text ? '<div class="ask-d">' + U.esc(opt.text) + '</div>' : '<div style="height:16px"></div>') +
      '<div class="ask-btns"><button data-a="no">' + U.esc(opt.cancel || 'Отмена') + '</button>' +
      '<button data-a="yes" class="' + (opt.danger ? 'danger' : 'go') + '">' + U.esc(opt.ok || 'Да') + '</button></div></div>';
    document.body.appendChild(bg);
    requestAnimationFrame(function () { bg.classList.add('in'); });

    function close(yes) {
      bg.classList.remove('in');
      setTimeout(function () { bg.remove(); }, 220);
      if (yes && opt.onOk) opt.onOk();
      if (!yes && opt.onCancel) opt.onCancel();
    }
    bg.addEventListener('click', function (e) {
      var b = e.target.closest('[data-a]');
      if (b) return close(b.dataset.a === 'yes');
      if (e.target === bg) close(false);
    });
  };

  /* ---------- отправить текст ---------- */
  App.shareText = function (text) {
    if (navigator.share) {
      navigator.share({ text: text }).catch(function () { });
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(function () { U.toast('Отчёт скопирован'); })
        .catch(function () { U.toast('Скопируйте текст вручную'); });
      return;
    }
    U.toast('Скопируйте текст вручную');
  };

  /* ---------- сохранение файла ----------
     Порядок попыток: среда Artifact (claude.use) → «Поделиться» на iOS →
     обычное скачивание → показать текст для копирования вручную.     */
  App.saveFile = function (name, text, mime, done) {
    done = done || function () { };

    if (w.claude && typeof w.claude.use === 'function') {
      App._dlp = App._dlp || w.claude.use('downloads');
      App._dlp.then(function (dl) {
        if (!dl) return App.copyFallback(name, text, done);
        dl.save({ filename: name, data: text })
          .then(function () { done(true); })
          .catch(function (e) {
            if (e && e.code === 'declined') { done(false); return; }
            App.copyFallback(name, text, done);
          });
      }, function () { App.copyFallback(name, text, done); });
      return;
    }

    try {
      if (w.File && navigator.canShare) {
        var f = new File([text], name, { type: mime });
        if (navigator.canShare({ files: [f] })) {
          navigator.share({ files: [f], title: name })
            .then(function () { done(true); })
            .catch(function () { done(false); });
          return;
        }
      }
    } catch (e) { }

    try {
      var blob = new Blob([text], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      done(true);
      return;
    } catch (e) { }

    App.copyFallback(name, text, done);
  };

  App.copyFallback = function (name, text, done) {
    App.sheet({
      title: 'Скопируйте копию',
      save: null,
      html: '<div class="note" style="padding:0 2px 12px">Здесь сохранить файл нельзя. Скопируйте текст и вставьте его в заметку или мессенджер — из него база восстанавливается целиком через «Загрузить базу».</div>' +
        '<button class="btn" id="cp">Скопировать всё</button>' +
        '<div class="form" style="margin-top:12px"><div class="fld col">' +
        '<label>' + U.esc(name) + '</label>' +
        '<textarea id="dump" readonly style="min-height:220px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace"></textarea>' +
        '</div></div>',
      onOpen: function (bd) {
        var ta = bd.querySelector('#dump');
        ta.value = text;
        bd.querySelector('#cp').addEventListener('click', function () {
          ta.focus(); ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { }
          if (ok) { U.toast('Скопировано'); done(true); return; }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
              .then(function () { U.toast('Скопировано'); done(true); })
              .catch(function () { U.toast('Скопируйте выделенный текст вручную'); });
          } else {
            U.toast('Скопируйте выделенный текст вручную');
          }
        });
      }
    });
  };

  /* ---------- действия ---------- */
  var ACTIONS = {
    back: function () { history.length > 1 ? history.back() : App.go('#/'); },
    unit: function (d) { App.go('#/unit/' + d.id); },
    'go-tank': function () { App.go('#/tank'); },
    filter: function (d) { V.unitsFilter = d.f; App.render(); },

    'new-fill': function (d) { F.fillForm({ unitId: d.unit || null }); },
    'edit-fill': function (d) { F.fillForm({ id: d.id }); },
    'repeat-fill': function (d) {
      var last = DB.lastFill(d.unit);
      if (!last) return F.fillForm({ unitId: d.unit });
      F.fillForm({ unitId: d.unit, preset: last });
    },

    'new-unit': function () { F.unitForm(); },
    'edit-unit': function (d) { F.unitForm(d.id); },
    'del-unit': function (d) {
      var u = DB.unit(d.id);
      if (!u) return;
      var n = DB.fillsOf(d.id).length;
      App.ask({
        title: 'Удалить ' + u.name + '?',
        text: n ? 'Вместе со всеми заправками (' + n + '). Остаток в бочке пересчитается. Отменить это будет нельзя.'
          : 'Отменить это будет нельзя.',
        ok: 'Удалить', danger: true,
        onOk: function () { DB.delUnit(d.id); U.toast('Техника удалена'); App.go('#/units'); }
      });
    },
    'service-done': function (d) {
      var u = DB.unit(d.id);
      if (!u || !u.service) return;
      var s = CALC.unit(u);
      App.ask({
        title: 'Отметить ТО?',
        text: 'Отсчёт до следующего пойдёт от текущего показания — ' + U.meter(s.meterNow, u.meter) + '.',
        ok: 'Отметить',
        onOk: function () {
          DB.updUnit(u.id, { service: Object.assign({}, u.service, { lastMeter: s.meterNow, lastDate: U.today() }) });
          U.toast('ТО отмечено');
          App.render();
        }
      });
    },

    'new-supply': function () { F.supplyForm(); },
    'del-supply': function (d) {
      var s = DB.data.supplies.filter(function (x) { return x.id === d.id; })[0];
      if (!s) return;
      App.ask({
        title: 'Удалить приход?',
        text: U.liters(s.liters) + ' от ' + U.fmtDateFull(s.date) + '. Остаток в бочке пересчитается.',
        ok: 'Удалить', danger: true,
        onOk: function () { DB.delSupply(d.id); U.toast('Приход удалён'); App.render(); }
      });
    },
    'new-check': function () { F.checkForm(); },
    'del-check': function (d) {
      App.ask({
        title: 'Удалить замер?',
        text: 'Остаток снова будет считаться от прихода и выдач.',
        ok: 'Удалить', danger: true,
        onOk: function () { DB.delCheck(d.id); U.toast('Замер удалён'); App.render(); }
      });
    },

    report: function (d) { F.reportSheet(d.m || U.monthKey(U.today())); },
    import: function () { F.importSheet(); },

    demo: function () {
      DB.data = DB.demo(); DB.save();
      U.toast('Загружен пример: 5 единиц техники, заправки за 2 месяца');

    'demo-off': function () {
      App.ask({
        title: 'Очистить пример?',
        text: 'Демонстрационная техника и заправки будут удалены, приложение станет пустым.',
        ok: 'Очистить',
        onOk: function () { DB.data = DB.empty(); DB.save(); U.toast('Готово — можно заносить своё'); App.go('#/'); }
      });
    },

    'export-json': function () {
      var name = 'toplivo-' + U.today() + '.json';
      App.saveFile(name, DB.exportJSON(), 'application/json', function (ok) {
        if (!ok) return;
        DB.data.settings.lastExport = U.today(); DB.save();
        U.toast('Копия сохранена: ' + name);
        if (App.route === '#/more') App.render();
      });
    },
    'export-csv': function () {
      App.saveFile('toplivo-' + U.today() + '.csv', DB.exportCSV(), 'text/csv;charset=utf-8',
        function (ok) { if (ok) U.toast('Таблица сохранена'); });
    },
    wipe: function () {
      App.ask({
        title: 'Стереть все данные?',
        text: 'Техника, заправки и приход топлива будут удалены. Восстановить их можно будет только из резервной копии.',

        onOk: function () {

      });
    }
  };

  /* ---------- тема ---------- */
  App.applyTheme = function () {
    var t = DB.data.settings.theme || 'auto';

    var meta = U.$('#theme-color');
    if (meta) {
      var light = t === 'light' || (t === 'auto' && w.matchMedia('(prefers-color-scheme:light)').matches);
      meta.setAttribute('content', light ? '#eceef1' : '#0c0e11');
    }
  };

  /* ---------- экран блокировки ---------- */
  App.lock = function (done) {
    var buf = '';
    var el = document.createElement('div');
    el.className = 'lock';
    el.innerHTML = '<div style="font-size:44px">🔐</div>' +
      '<div style="font-size:19px;font-weight:600">Введите код</div>' +
      '<div class="pin-dots" id="dots"><i></i><i></i><i></i><i></i></div>' +
      '<div class="keypad" style="margin-top:8px">' +
      [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button data-n="' + n + '">' + n + '</button>'; }).join('') +
      '<button class="blank"></button><button data-n="0">0</button>' +
      '<button data-n="del" style="font-size:20px">⌫</button></div>';
    document.body.appendChild(el);

    function draw() {
      U.$$('#dots i', el).forEach(function (d, i) { d.classList.toggle('on', i < buf.length); });
    }
    el.addEventListener('click', function (e) {
      var b = e.target.closest('[data-n]');
      if (!b) return;
      if (b.dataset.n === 'del') { buf = buf.slice(0, -1); draw(); return; }
      if (buf.length >= 4) return;
      buf += b.dataset.n;
      draw();
      if (buf.length === 4) {
        if (App.hash(buf) === DB.data.settings.pin) {
          el.style.opacity = '0';
          el.style.transition = 'opacity .25s';
          setTimeout(function () { el.remove(); }, 260);
          done();
        } else {
          el.classList.add('shake');
          setTimeout(function () { el.classList.remove('shake'); buf = ''; draw(); }, 420);
        }
      }
    });
  };

  /* ---------- старт ---------- */
  App.start = function () {
    DB.load();
    App.applyTheme();

    var run = function () {
      App.render();
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { });
    };

    if (DB.data.settings.pin) App.lock(run);
    else run();

    w.addEventListener('hashchange', App.render);
    w.addEventListener('scroll', App.onScroll, { passive: true });
    w.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', App.applyTheme);

    /* сутки могли смениться, пока приложение висело в фоне */
    var day = U.today();

      if (!document.hidden && U.today() !== day) { day = U.today(); App.render(); }
    });

      if (e.target.closest('.sheet')) return;

      if (!b) return;
      var act = ACTIONS[b.dataset.act];
      if (act) { e.preventDefault(); act(b.dataset, b); }

      if (e.target.closest('.sheet')) return;
      if (e.target.id !== 'qu') return;
      V.unitsQuery = e.target.value;
      clearTimeout(tmr);
      tmr = setTimeout(function () {
        App.render();
        var i = U.$('#qu');
        if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
      }, 160);
    });

    document.addEventListener('change', function (e) {
      if (e.target.closest('.sheet')) return;
      var t = e.target;
      if (t.dataset && t.dataset.act === 'set') {
        var k = t.dataset.k;
        var v = ['overrun', 'lowDays'].indexOf(k) >= 0 ? U.num(t.value) : t.value;
        DB.data.settings[k] = v;
        DB.save();
        if (k === 'theme') App.applyTheme();
        App.render();
        U.toast('Сохранено');
      }
    });
  };

  w.App = App;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', App.start);
  else App.start();
})(window);
