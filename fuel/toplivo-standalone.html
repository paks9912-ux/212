<style>
/* ============================================================
   Топливо — учёт заправок техники
   iOS-first PWA. Без внешних зависимостей.
   ============================================================ */

:root{
  --green:#28a745;  --green-d:#1e7e34;
  --red:#e5484d;    --orange:#f5a524;
  --blue:#0a84ff;   --violet:#7c5cff;

  --radius:16px;
  --radius-sm:11px;
  --tap:44px;

  --ease:cubic-bezier(.32,.72,0,1);
  --safe-b:env(safe-area-inset-b, 0px);
}

/* ---------- тема: светлая (по умолчанию) ---------- */
:root,
html[data-theme="light"]{
  --bg:#f2f2f7;
  --bg-elev:#ffffff;
  --bg-sunken:#e9e9ee;
  --fill:rgba(120,120,128,.12);
  --fill-2:rgba(120,120,128,.08);
  --text:#000000;
  --text-2:rgba(60,60,67,.6);
  --text-3:rgba(60,60,67,.35);
  --line:rgba(60,60,67,.13);
  --bar:rgba(249,249,251,.82);
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.05);
  --accent:#d97706;
  --accent-soft:rgba(217,119,6,.12);
  --on-accent:#ffffff;
  --danger-soft:rgba(229,72,77,.12);
  --warn-soft:rgba(245,165,36,.15);
  color-scheme:light;
}

/* ---------- тема: тёмная ---------- */
@media (prefers-color-scheme:dark){
  html:not([data-theme="light"]){
    --bg:#000000;
    --bg-elev:#1c1c1e;
    --bg-sunken:#0b0b0d;
    --fill:rgba(120,120,128,.24);
    --fill-2:rgba(120,120,128,.16);
    --text:#ffffff;
    --text-2:rgba(235,235,245,.6);
    --text-3:rgba(235,235,245,.3);
    --line:rgba(84,84,88,.5);
    --bar:rgba(22,22,24,.8);
    --shadow:none;
    --accent:#ff9f0a;
    --accent-soft:rgba(255,159,10,.16);
    --on-accent:#1c1c1e;
    --danger-soft:rgba(255,69,58,.18);
    --warn-soft:rgba(255,159,10,.2);
    --red:#ff453a; --orange:#ff9f0a; --blue:#0a84ff; --violet:#9a7cff;
    color-scheme:dark;
  }
}
html[data-theme="dark"]{
  --bg:#000000;
  --bg-elev:#1c1c1e;
  --bg-sunken:#0b0b0d;
  --fill:rgba(120,120,128,.24);
  --fill-2:rgba(120,120,128,.16);
  --text:#ffffff;
  --text-2:rgba(235,235,245,.6);
  --text-3:rgba(235,235,245,.3);
  --line:rgba(84,84,88,.5);
  --bar:rgba(22,22,24,.8);
  --shadow:none;
  --accent:#ff9f0a;
  --accent-soft:rgba(255,159,10,.16);
  --on-accent:#1c1c1e;
  --danger-soft:rgba(255,69,58,.18);
  --warn-soft:rgba(255,159,10,.2);
  --red:#ff453a; --orange:#ff9f0a; --blue:#0a84ff; --violet:#9a7cff;
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font:400 17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;
}
body.no-scroll{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:17px;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;color:var(--accent)}
input,textarea,select{-webkit-appearance:none;appearance:none}
a{color:var(--accent);text-decoration:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- каркас ---------- */
#screen{
  min-height:100%;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
.wrap{padding:0 16px;max-width:640px;margin:0 auto}

.topbar{
  position:sticky;top:0;z-index:40;
  height:calc(48px + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:8px;
  padding-left:8px;padding-right:8px;
  background:transparent;
  transition:background .2s linear;
}
.topbar.solid{
  background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--line);
}
.topbar .tb-title{
  flex:1;text-align:center;font-size:17px;font-weight:600;
  opacity:0;transition:opacity .2s linear;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar.solid .tb-title{opacity:1}
.tb-btn{
  min-width:var(--tap);height:var(--tap);display:flex;align-items:center;
  justify-content:center;gap:3px;font-size:17px;color:var(--accent);
}
.tb-btn.right{justify-content:flex-end;padding-right:8px}
.tb-btn:active{opacity:.4}

h1.big{
  font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.6px;
  margin:2px 0 14px;
}
h2.sec{
  font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;
  color:var(--text-2);margin:26px 4px 8px;
}
h2.sec .act{float:right;text-transform:none;letter-spacing:0;color:var(--accent);font-weight:400}

/* ---------- карточки / списки ---------- */
.card{
  background:var(--bg-elev);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.card + .card{margin-top:12px}
.pad{padding:16px}

.list{background:var(--bg-elev);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.row{
  display:flex;align-items:center;gap:12px;
  min-height:52px;padding:11px 14px;position:relative;
  color:inherit;width:100%;text-align:left;background:none;font-size:17px;
}
.row + .row::before{
  content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line);
}
.row.tap:active{background:var(--fill-2)}
.row .grow{flex:1;min-width:0;display:block}
.row .chev{color:var(--text-3);font-size:15px;flex:none}
.row .ttl{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{display:block;font-size:13px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{text-align:right;flex:none;display:block;max-width:42%}
.row .val .v1{display:block;font-size:17px;font-weight:600;white-space:nowrap}
.row .val .v2{display:block;font-size:12px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.avatar{
  width:38px;height:38px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:#fff;letter-spacing:.2px;
}

/* ---------- сводка ---------- */
.hero{
  background:var(--bg-elev);border-radius:20px;padding:18px 18px 16px;
  box-shadow:var(--shadow);
}
.hero .lbl{font-size:13px;color:var(--text-2)}
.hero .amt{font-size:clamp(26px,8.6vw,38px);font-weight:700;letter-spacing:-1px;line-height:1.1;margin-top:3px;overflow-wrap:anywhere}
.hero .delta{font-size:13px;color:var(--text-2);margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--bg-elev);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:5px}
.stat .v{font-size:clamp(16px,5vw,21px);font-weight:650;letter-spacing:-.3px;margin-top:4px;overflow-wrap:anywhere}
.stat .v.sm{font-size:18px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

/* ---------- бейджи / чипы ---------- */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;font-weight:600;padding:3px 8px;border-radius:100px;
  background:var(--fill);color:var(--text-2);white-space:nowrap;
}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.badge.bad{background:var(--danger-soft);color:var(--red)}
.badge.warn{background:var(--warn-soft);color:var(--orange)}

.seg{
  display:flex;background:var(--fill-2);border-radius:9px;padding:2px;gap:2px;margin:0 0 14px;
}
.seg button{
  flex:1;min-height:32px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text);
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.seg button.on{background:var(--bg-elev);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.seg .cnt{font-size:11px;color:var(--text-2)}
.seg button.on .cnt{color:var(--text-2)}

/* ---------- кнопки ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;border-radius:14px;font-size:17px;font-weight:600;
  background:var(--accent);color:var(--on-accent);width:100%;padding:0 14px;white-space:nowrap;
  transition:transform .12s var(--ease),opacity .12s;
}
.btn:active{transform:scale(.975);opacity:.9}
.btn.sec{background:var(--fill);color:var(--text)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--danger-soft);color:var(--red)}
.btn.sm{min-height:40px;font-size:15px;border-radius:11px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{font-size:16px}
.btn-row .btn{flex:1}

.fab{
  position:fixed;right:16px;z-index:45;
  bottom:calc(74px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:300;line-height:1;
  box-shadow:0 6px 20px rgba(0,0,0,.28);
  transition:transform .15s var(--ease);
}
.fab:active{transform:scale(.9)}

/* ---------- таббар ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);
}
.tabbar a{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;height:52px;color:var(--text-3);font-size:10px;font-weight:500;
}
.tabbar a.on{color:var(--accent)}
.tabbar a:active{opacity:.55}
.tabbar svg{width:25px;height:25px;display:block}

/* ---------- формы ---------- */
.field{
  display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;
  position:relative;background:var(--bg-elev);
}
.field + .field::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line)}
.field label{font-size:17px;flex:none;min-width:104px;color:var(--text)}
.field input,.field select,.field textarea{
  flex:1;min-width:0;border:0;background:transparent;outline:none;
  padding:10px 0;font-size:17px;text-align:right;
}
.field.col{flex-direction:column;align-items:stretch;gap:0;padding:10px 14px}
.field.col label{font-size:13px;color:var(--text-2);margin-bottom:2px}
.field.col input,.field.col textarea{text-align:left;padding:4px 0}
.field textarea{resize:none;min-height:60px;line-height:1.35}
.field select{
  text-align:right;color:var(--text);padding-right:17px;
  background:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 16'%3E%3Cpath d='M2 6l3-3 3 3M2 10l3 3 3-3' fill='none' stroke='%23999' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right center/9px 15px;
}
.field .unit{color:var(--text-2);font-size:15px;flex:none}
.field input::placeholder,.field textarea::placeholder{color:var(--text-3)}
.hint{font-size:12.5px;color:var(--text-2);padding:8px 6px 0;line-height:1.4}
.hint b{color:var(--text);font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;background:var(--bg-elev)}
.chip{
  padding:7px 13px;border-radius:100px;background:var(--fill-2);
  font-size:14px;color:var(--text);border:1.5px solid transparent;
}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip:active{opacity:.6}

.search{
  display:flex;align-items:center;gap:7px;background:var(--fill-2);
  border-radius:10px;padding:0 10px;height:38px;margin-bottom:14px;
}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:17px;min-width:0}
.search svg{width:16px;height:16px;color:var(--text-3);flex:none}

/* ---------- модальный лист ---------- */
.sheet-bg{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.42);
  opacity:0;transition:opacity .3s var(--ease);
  -webkit-backdrop-filter:blur(1px);backdrop-filter:blur(1px);
}
.sheet-bg.in{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  max-height:92vh;display:flex;flex-direction:column;
  background:var(--bg);border-radius:14px 14px 0 0;
  transform:translateY(100%);transition:transform .34s var(--ease);
  padding-bottom:env(safe-area-inset-bottom);
  max-width:640px;margin:0 auto;
  box-shadow:0 -8px 40px rgba(0,0,0,.3);
}
.sheet.in{transform:translateY(0)}
.sheet-hd{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-bottom:.5px solid var(--line);flex:none;
}
.sheet-hd .t{font-size:17px;font-weight:600;flex:1;text-align:center}
.sheet-hd button{font-size:17px;min-width:64px}
.sheet-hd button.strong{font-weight:600;text-align:right}
.sheet-bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;flex:1}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:7px auto 0;flex:none}

/* ---------- всплывающее уведомление ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);z-index:90;
  background:rgba(30,30,32,.95);color:#fff;font-size:14.5px;font-weight:500;
  padding:11px 18px;border-radius:100px;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
#toast.in{opacity:1;transform:translate(-50%,0)}

/* ---------- служебное ---------- */
.empty{text-align:center;padding:46px 26px;color:var(--text-2)}
.empty .ic{font-size:44px;margin-bottom:10px;opacity:.5}
.empty .t{font-size:17px;font-weight:600;color:var(--text);margin-bottom:5px}
.empty .d{font-size:14px;line-height:1.45}

.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .4s var(--ease)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:15px}
.kv + .kv{border-top:.5px solid var(--line)}
.kv .k{color:var(--text-2)}
.kv .v{font-weight:600;text-align:right;overflow-wrap:anywhere}
.kv.big .v{font-size:19px}

.tl{position:relative;padding-left:22px}
.tl .ev{position:relative;padding:9px 0}
.tl .ev + .ev{border-top:.5px solid var(--line)}
.tl .ev::before{
  content:"";position:absolute;left:-18px;top:16px;width:9px;height:9px;
  border-radius:50%;background:var(--accent);
}
.tl::before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:1.5px;background:var(--line)}

.lock{
  position:fixed;inset:0;z-index:100;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
}
.pin-dots{display:flex;gap:16px}
.pin-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--text-2)}
.pin-dots i.on{background:var(--text);border-color:var(--text)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:18px;justify-content:center}
.keypad button{
  width:72px;height:72px;border-radius:50%;background:var(--fill-2);
  font-size:28px;font-weight:400;color:var(--text);
  display:flex;align-items:center;justify-content:center;
}
.keypad button:active{background:var(--fill)}
.keypad button.blank{background:none;pointer-events:none}
.shake{animation:shake .4s}
@keyframes shake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
}
.fade{animation:fade .22s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

/* ---------- диалог подтверждения ---------- */
.ask-bg{
  position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;padding:28px;
  opacity:0;transition:opacity .2s ease;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.ask-bg.in{opacity:1}
.ask{
  width:100%;max-width:290px;background:var(--bg-elev);border-radius:15px;
  overflow:hidden;text-align:center;
  transform:scale(.92);transition:transform .22s var(--ease);
  box-shadow:0 12px 44px rgba(0,0,0,.3);
}
.ask-bg.in .ask{transform:scale(1)}
.ask .ask-t{font-size:17px;font-weight:600;padding:20px 18px 0}
.ask .ask-d{font-size:13.5px;color:var(--text-2);line-height:1.4;padding:6px 18px 18px}
.ask .ask-btns{display:flex;border-top:.5px solid var(--line)}
.ask .ask-btns button{
  flex:1;min-height:46px;font-size:17px;color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.ask .ask-btns button + button{border-left:.5px solid var(--line)}
.ask .ask-btns button.danger{color:var(--red);font-weight:600}
.ask .ask-btns button:active{background:var(--fill-2)}

/* ============================================================
   Топливо: свои элементы
   ============================================================ */

/* крупная кнопка заправки на главном экране */
.btn.lg{min-height:58px;font-size:19px;border-radius:16px}
.btn.lg .sub{font-size:12px;font-weight:400;opacity:.8}

/* сигнал: перерасход, недостача, ТО */
.alert{
  display:flex;gap:11px;align-items:flex-start;
  padding:12px 14px;background:var(--bg-elev);
  position:relative;width:100%;text-align:left;color:inherit;
}
.alert + .alert::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line)}
.alert .ic{
  width:26px;height:26px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:14px;
  background:var(--warn-soft);
}
.alert.bad .ic{background:var(--danger-soft)}
.alert .tx{flex:1;min-width:0;font-size:15px;line-height:1.35}
.alert .tx b{display:block;font-weight:600;font-size:15px;margin-bottom:2px}
.alert .tx span{color:var(--text-2);font-size:13px}
.alert .money{font-size:14px;font-weight:600;color:var(--red);white-space:nowrap;flex:none}

/* полоса остатка / до ТО */
.bar.warn i{background:var(--orange)}
.bar.bad i{background:var(--red)}

/* столбики расхода по участкам */
.spark{display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:12px}
.spark .b{flex:1;border-radius:3px 3px 0 0;background:var(--accent-soft);position:relative;min-height:3px}
.spark .b.over{background:var(--danger-soft)}

<script>
/* Утилиты: деньги, литры, счётчики, даты, склонения, DOM-хелперы */
(function (w) {
  'use strict';

  var U = {};

  /* ---------- id ---------- */
  U.uid = function () {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  };

  /* ---------- экранирование ---------- */
  U.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };

  /* ---------- числа ---------- */
  U.num = function (v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    var s = String(v == null ? '' : v).replace(/\s| /g, '').replace(',', '.').replace(/[^\d.\-]/g, '');
    var n = parseFloat(s);
    return isFinite(n) ? n : 0;
  };

  var nf0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
  var nf1 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  var nf2 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  U.int = function (v) { return nf0.format(Math.round(U.num(v))); };
  U.dec = function (v, n) {
    var x = U.num(v);
    if (n === 2) return nf2.format(x);
    if (n === 0 || Math.abs(x) >= 1000) return nf0.format(Math.round(x));
    return nf1.format(x);
  };

  /* ---------- валюта (одна на всё приложение) ---------- */
  U.CUR = [
    { code: 'UZS', sym: 'сум', name: 'Узбекский сум', dec: 0 },
    { code: 'KGS', sym: 'сом', name: 'Киргизский сом', dec: 0 },
    { code: 'KZT', sym: '₸', name: 'Казахский тенге', dec: 0 },
    { code: 'RUB', sym: '₽', name: 'Российский рубль', dec: 0 },
    { code: 'USD', sym: '$', name: 'Доллар США', dec: 2 },
    { code: 'EUR', sym: '€', name: 'Евро', dec: 2 }
  ];
  U.curCode = function () {
    return (w.DB && DB.data && DB.data.settings && DB.data.settings.currency) || 'UZS';
  };
  U.curInfo = function (code) {
    code = code || U.curCode();
    for (var i = 0; i < U.CUR.length; i++) if (U.CUR[i].code === code) return U.CUR[i];
    return U.CUR[0];
  };
  U.sym = function (code) { return U.curInfo(code).sym; };

  /* U.money(12000) → «12 000 сум»; U.money(x, {noCur:true}) — без символа */
  U.money = function (v, opt) {
    opt = opt || {};
    var info = U.curInfo();
    var n = U.num(v), sign = n < 0 ? '−' : '', abs = Math.abs(n);
    var frac = opt.exact || (info.dec === 2 && abs > 0 && abs < 1000 && Math.round(abs) !== abs);
    var body = frac ? nf2.format(abs) : nf0.format(Math.round(abs));
    return sign + body + (opt.noCur ? '' : ' ' + info.sym);
  };

  U.moneyShort = function (v) {
    var sym = ' ' + U.sym();
    var n = Math.abs(U.num(v)), s = U.num(v) < 0 ? '−' : '';
    if (n >= 1e9) return s + nf1.format(n / 1e9) + ' млрд' + sym;
    if (n >= 1e6) return s + nf1.format(n / 1e6) + ' млн' + sym;
    if (n >= 1e5) return s + nf0.format(Math.round(n / 1e3)) + ' тыс' + sym;
    return s + nf0.format(Math.round(n)) + sym;
  };

  U.pct = function (v, sign) {
    var n = U.num(v);
    var s = (sign && n > 0 ? '+' : '') + U.dec(Math.abs(n) < 10 ? n : Math.round(n), Math.abs(n) < 10 ? 1 : 0);
    return s + '%';
  };

  /* ---------- топливо ---------- */
  U.FUELS = [
    { code: 'dt', name: 'Дизель', short: 'ДТ' },
    { code: 'ai80', name: 'Бензин АИ-80', short: 'АИ-80' },
    { code: 'ai92', name: 'Бензин АИ-92', short: 'АИ-92' },
    { code: 'ai95', name: 'Бензин АИ-95', short: 'АИ-95' },
    { code: 'gas', name: 'Газ', short: 'Газ' }
  ];
  U.fuel = function (code) {
    for (var i = 0; i < U.FUELS.length; i++) if (U.FUELS[i].code === code) return U.FUELS[i];
    return U.FUELS[0];
  };
  U.fuelShort = function (code) { return U.fuel(code).short; };

  /* ---------- виды техники ---------- */
  U.KINDS = [
    { code: 'truck', name: 'Самосвал, грузовик', ic: '🚛', meter: 'km' },
    { code: 'car', name: 'Легковая, пикап', ic: '🚗', meter: 'km' },
    { code: 'excavator', name: 'Экскаватор', ic: '🚜', meter: 'mh' },
    { code: 'loader', name: 'Погрузчик, бульдозер', ic: '🏗️', meter: 'mh' },
    { code: 'tractor', name: 'Трактор', ic: '🌾', meter: 'mh' },
    { code: 'gen', name: 'Генератор, насос', ic: '⚡', meter: 'mh' },
    { code: 'other', name: 'Другое', ic: '🛠️', meter: 'km' }
  ];
  U.kind = function (code) {
    for (var i = 0; i < U.KINDS.length; i++) if (U.KINDS[i].code === code) return U.KINDS[i];
    return U.KINDS[U.KINDS.length - 1];
  };

  /* ---------- литры и счётчики ---------- */
  U.liters = function (v, noUnit) { return U.dec(v, Math.abs(U.num(v)) >= 100 ? 0 : 1) + (noUnit ? '' : ' л'); };
  U.meterUnit = function (m) { return m === 'mh' ? 'мч' : 'км'; };
  U.meterName = function (m) { return m === 'mh' ? 'моточасы' : 'пробег'; };
  U.meter = function (v, m) { return U.int(v) + ' ' + U.meterUnit(m); };
  U.rateUnit = function (m) { return m === 'mh' ? 'л/мч' : 'л/100 км'; };
  U.rate = function (v, m, noUnit) {
    if (v == null) return '—';
    return U.dec(v, 1) + (noUnit ? '' : ' ' + U.rateUnit(m));
  };
  /* наработка, за которую тратится норма: 100 км или 1 моточас */
  U.rateBase = function (m) { return m === 'mh' ? 1 : 100; };

  /* ---------- склонение ---------- */
  U.plural = function (n, one, few, many) {
    n = Math.abs(Math.round(n)) % 100;
    var n1 = n % 10;
    if (n > 10 && n < 20) return many;
    if (n1 > 1 && n1 < 5) return few;
    if (n1 === 1) return one;
    return many;
  };
  U.days = function (n) { return Math.round(n) + ' ' + U.plural(n, 'день', 'дня', 'дней'); };
  U.unitsWord = function (n) { return n + ' ' + U.plural(n, 'единица', 'единицы', 'единиц'); };

  /* ---------- даты ('YYYY-MM-DD') ---------- */
  U.today = function () { return U.iso(new Date()); };
  U.iso = function (d) {
    var m = String(d.getMonth() + 1), day = String(d.getDate());
    return d.getFullYear() + '-' + (m.length < 2 ? '0' + m : m) + '-' + (day.length < 2 ? '0' + day : day);
  };
  U.parse = function (s) {
    if (!s) return null;
    var p = String(s).slice(0, 10).split('-');
    if (p.length !== 3) return null;
    return Date.UTC(+p[0], +p[1] - 1, +p[2]);
  };
  U.diffDays = function (a, b) {
    var x = U.parse(a), y = U.parse(b);
    if (x == null || y == null) return 0;
    return Math.round((y - x) / 86400000);
  };
  U.addDays = function (s, n) {
    var t = U.parse(s);
    if (t == null) return s;
    var d = new Date(t + n * 86400000);
    return d.getUTCFullYear() + '-' +
      String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(d.getUTCDate()).padStart(2, '0');
  };
  U.addMonths = function (s, n) {
    var t = U.parse(s);
    if (t == null) return s;
    var d = new Date(t), day = d.getUTCDate();
    d.setUTCMonth(d.getUTCMonth() + n);
    if (d.getUTCDate() < day) d.setUTCDate(0);
    return d.getUTCFullYear() + '-' +
      String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(d.getUTCDate()).padStart(2, '0');
  };

  var MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  var MONF = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var MONN = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];

  U.fmtDate = function (s) {
    var t = U.parse(s);
    if (t == null) return '—';
    var d = new Date(t), cy = new Date().getFullYear();
    var out = d.getUTCDate() + ' ' + MON[d.getUTCMonth()];
    if (d.getUTCFullYear() !== cy) out += ' ' + d.getUTCFullYear();
    return out;
  };
  U.fmtDateFull = function (s) {
    var t = U.parse(s);
    if (t == null) return '—';
    var d = new Date(t);
    return d.getUTCDate() + ' ' + MONF[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
  };
  U.relDate = function (s) {
    var n = U.diffDays(U.today(), s);
    if (n === 0) return 'сегодня';
    if (n === 1) return 'завтра';
    if (n === -1) return 'вчера';
    if (n > 1 && n < 30) return 'через ' + U.days(n);
    if (n < -1 && n > -30) return U.days(-n) + ' назад';
    return U.fmtDate(s);
  };
  U.monthKey = function (s) { return String(s).slice(0, 7); };
  U.monthName = function (key) {
    var p = String(key).split('-');
    var n = MONN[+p[1] - 1] || '';
    return n.charAt(0).toUpperCase() + n.slice(1) + ' ' + p[0];
  };

  /* ---------- DOM ---------- */
  U.$ = function (sel, root) { return (root || document).querySelector(sel); };
  U.$$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  U.toast = function (msg) {
    var t = U.$('#toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('in');
    clearTimeout(U._tt);
    U._tt = setTimeout(function () { t.classList.remove('in'); }, 2300);
  };

  var PALETTE = ['#0a84ff', '#30d158', '#ff9f0a', '#ff453a', '#bf5af2', '#64d2ff', '#ffd60a', '#ff375f', '#5e5ce6', '#66d4cf'];
  U.color = function (str) {
    var h = 0, s = String(str || '?');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  };

  w.U = U;
})(window);

/* Хранилище: всё лежит на телефоне (localStorage), ничего не уходит в сеть */
(function (w) {
  'use strict';

  var KEY = 'toplivo.db.v1';
  var BAK = 'toplivo.autobackup';

  var DB = {
    data: null,
    listeners: [],

    empty: function () {
      return {
        version: 1,
        createdAt: U.today(),
        isDemo: false,
        settings: {
          currency: 'UZS',
          theme: 'auto',
          fuel: 'dt',             // топливо по умолчанию
          source: 'tank',         // откуда заправляют чаще
          prices: {},             // последняя цена по виду топлива
          overrun: 10,            // порог перерасхода для предупреждения, %
          lowDays: 5,             // «топливо кончается», дней
          pin: null,
          lastExport: null
        },
        units: [],                // техника
        fills: [],                // заправки
        supplies: [],             // приход топлива в бочку
        checks: []                // замеры остатка
      };
    },

    load: function () {
      var raw = null;
      try { raw = localStorage.getItem(KEY); } catch (e) { }
      if (!raw) { this.data = this.empty(); return false; }
      try {
        this.data = this.migrate(JSON.parse(raw));
        return true;
      } catch (e) {
        try {
          var b = localStorage.getItem(BAK);
          if (b) { this.data = this.migrate(JSON.parse(b)); U.toast('Данные восстановлены из копии'); return true; }
        } catch (e2) { }
        this.data = this.empty();
        return false;
      }
    },

    migrate: function (d) {
      d = d || {};
      var base = this.empty();
      d.settings = Object.assign(base.settings, d.settings || {});
      d.settings.prices = d.settings.prices || {};
      d.isDemo = !!d.isDemo;
      ['units', 'fills', 'supplies', 'checks'].forEach(function (k) {
        d[k] = Array.isArray(d[k]) ? d[k] : [];
      });
      d.units.forEach(function (u) {
        if (!u.meter) u.meter = U.kind(u.kind).meter;
        if (!u.fuel) u.fuel = d.settings.fuel;
        u.norm = U.num(u.norm);
        u.service = u.service || null;
        u.archived = !!u.archived;
      });
      d.fills.forEach(function (f) {
        f.liters = U.num(f.liters);
        f.price = U.num(f.price);
        if (!f.cost) f.cost = f.liters * f.price;
        f.full = f.full !== false;
        if (!f.source) f.source = 'tank';
      });
      d.version = 1;
      return d;
    },

    save: function () {
      try {
        var json = JSON.stringify(this.data);
        localStorage.setItem(KEY, json);
        try { localStorage.setItem(BAK, json); } catch (e) { }
        if (w.CALC) CALC.clearCache();
      } catch (e) {
        U.toast('Не удалось сохранить: нет места в памяти');
        return false;
      }
      this.listeners.forEach(function (f) { try { f(); } catch (e) { } });
      return true;
    },

    onChange: function (f) { this.listeners.push(f); },

    /* ---------- техника ---------- */
    units: function (withArchived) {
      return this.data.units.filter(function (u) { return withArchived || !u.archived; });
    },
    unit: function (id) { return this.data.units.filter(function (u) { return u.id === id; })[0] || null; },
    unitByName: function (name) {
      var n = String(name || '').trim().toLowerCase();
      return this.data.units.filter(function (u) { return u.name.trim().toLowerCase() === n; })[0] || null;
    },
    addUnit: function (u) {
      u.id = u.id || U.uid();
      u.createdAt = u.createdAt || U.today();
      if (!u.meter) u.meter = U.kind(u.kind).meter;
      this.data.units.push(u);
      this.save();
      return u;
    },
    updUnit: function (id, patch) {
      var u = this.unit(id);
      if (u) { Object.assign(u, patch); this.save(); }
      return u;
    },
    delUnit: function (id) {
      this.data.fills = this.data.fills.filter(function (f) { return f.unitId !== id; });
      this.data.units = this.data.units.filter(function (u) { return u.id !== id; });
      this.save();
    },

    /* ---------- заправки ---------- */
    fills: function () { return this.data.fills; },
    fill: function (id) { return this.data.fills.filter(function (f) { return f.id === id; })[0] || null; },
    fillsOf: function (unitId) {
      return this.data.fills.filter(function (f) { return f.unitId === unitId; }).sort(DB.byDate);
    },
    byDate: function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return U.num(a.meter) - U.num(b.meter);
    },
    addFill: function (f) {
      f.id = f.id || U.uid();
      f.date = f.date || U.today();
      f.liters = U.num(f.liters);
      f.price = U.num(f.price);
      f.cost = U.num(f.cost) || f.liters * f.price;
      f.createdAt = f.createdAt || U.today();
      this.data.fills.push(f);
      if (f.price > 0) this.data.settings.prices[f.fuel] = f.price;
      this.save();
      return f;
    },
    updFill: function (id, patch) {
      var f = this.fill(id);
      if (f) {
        Object.assign(f, patch);
        f.cost = U.num(f.cost) || U.num(f.liters) * U.num(f.price);
        this.save();
      }
      return f;
    },
    delFill: function (id) {
      this.data.fills = this.data.fills.filter(function (f) { return f.id !== id; });
      this.save();
    },
    /* последняя заправка — из неё подставляются значения в новую */
    lastFill: function (unitId) {
      var list = unitId ? this.fillsOf(unitId) : this.data.fills.slice().sort(DB.byDate);
      return list.length ? list[list.length - 1] : null;
    },
    price: function (fuel) { return U.num(this.data.settings.prices[fuel]); },

    /* ---------- приход топлива ---------- */
    addSupply: function (s) {
      s.id = s.id || U.uid();
      s.date = s.date || U.today();
      s.liters = U.num(s.liters);
      s.price = U.num(s.price);
      s.cost = U.num(s.cost) || s.liters * s.price;
      this.data.supplies.push(s);
      if (s.price > 0) this.data.settings.prices[s.fuel] = s.price;
      this.save();
      return s;
    },
    delSupply: function (id) {
      this.data.supplies = this.data.supplies.filter(function (s) { return s.id !== id; });
      this.save();
    },

    /* ---------- замеры остатка ---------- */
    addCheck: function (c) {
      c.id = c.id || U.uid();
      c.date = c.date || U.today();
      c.liters = U.num(c.liters);
      this.data.checks.push(c);
      this.save();
      return c;
    },
    delCheck: function (id) {
      this.data.checks = this.data.checks.filter(function (c) { return c.id !== id; });
      this.save();
    },

    /* ---------- экспорт / импорт ---------- */
    exportJSON: function () { return JSON.stringify(this.data, null, 2); },

    importJSON: function (text, mode) {
      var d = JSON.parse(text);
      if (!d || !Array.isArray(d.units) || !Array.isArray(d.fills)) {
        throw new Error('Не похоже на резервную копию приложения');
      }
      d = this.migrate(d);
      if (mode === 'replace') {
        this.data = d;
      } else {
        var self = this, idmap = {};
        d.units.forEach(function (u) {
          var ex = self.unitByName(u.name);
          if (ex) { idmap[u.id] = ex.id; return; }
          var nid = U.uid();
          idmap[u.id] = nid;
          self.data.units.push(Object.assign({}, u, { id: nid }));
        });
        var have = {};
        this.data.fills.forEach(function (f) { have[f.unitId + '|' + f.date + '|' + f.liters] = 1; });
        d.fills.forEach(function (f) {
          var uid = idmap[f.unitId] || f.unitId;
          if (have[uid + '|' + f.date + '|' + f.liters]) return;      // дубль
          self.data.fills.push(Object.assign({}, f, { id: U.uid(), unitId: uid }));
        });
        var haveS = {};
        this.data.supplies.forEach(function (s) { haveS[s.date + '|' + s.liters] = 1; });
        d.supplies.forEach(function (s) {
          if (haveS[s.date + '|' + s.liters]) return;
          self.data.supplies.push(Object.assign({}, s, { id: U.uid() }));
        });
      }
      this.save();
      return { units: this.data.units.length, fills: this.data.fills.length };
    },

    /* CSV: Техника;Дата;Литры;Цена;Счётчик;Топливо;Источник;Заметка */
    importCSV: function (text) {
      var lines = String(text).replace(/^﻿/, '').split(/\r?\n/).filter(function (s) { return s.trim(); });
      if (!lines.length) throw new Error('Пустой файл');
      var sep = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
      var head = lines[0].toLowerCase();
      var start = /техник|машин|дата|unit/.test(head) ? 1 : 0;
      var added = 0, self = this, st = this.data.settings;

      for (var i = start; i < lines.length; i++) {
        var c = lines[i].split(sep).map(function (s) { return s.trim().replace(/^"|"$/g, ''); });
        if (!c[0]) continue;
        var liters = U.num(c[2]);
        if (!liters) continue;
        var u = self.unitByName(c[0]);
        if (!u) u = self.addUnit({ name: c[0], kind: 'other', fuel: st.fuel, norm: 0, tank: 0 });
        var price = c[3] ? U.num(c[3]) : self.price(u.fuel);
        self.addFill({
          unitId: u.id,

          if (lit > 0 && pr > 0) costEl.value = U.int(lit * pr);
        }
        money();

        function draw() {
          var cu = cur(), lit = U.num(litEl.value), meter = U.num(meterEl.value);
          var cs = CALC.unit(cu);
          var pv = f ? prevFill(cu, f) : cs.last;
          var out = [];

          /* расход на участке */
          if (lit > 0 && meter > 0 && pv && U.num(pv.meter) > 0) {
            var run = meter - U.num(pv.meter);
            if (run > 0) {
              var rate = lit / run * U.rateBase(cu.meter);
              var txt = 'Расход на участке: <b>' + U.rate(rate, cu.meter) + '</b> за ' + U.meter(run, cu.meter);
              if (cu.norm > 0) {
                var dev = (rate - cu.norm) / cu.norm * 100;
                txt += '<br>Норма ' + U.rate(cu.norm, cu.meter) + ' — ' +
                  (dev > 0.5 ? '<b style="color:var(--red)">перерасход ' + U.pct(dev, true) + '</b>'
                    : dev < -0.5 ? '<b style="color:var(--accent)">экономия ' + U.pct(-dev) + '</b>' : 'ровно по норме');
              }
              out.push(txt);
            } else if (run < 0) {
              out.push('<b style="color:var(--red)">Счётчик меньше прошлого показания (' + U.int(pv.meter) + ')</b> — проверьте цифру');
            } else {
              out.push('<b style="color:var(--orange)">Счётчик не изменился с прошлой заправки</b>');
            }
          } else if (lit > 0 && !meter) {
            out.push('Без показания счётчика расход посчитать не получится — запись сохранится, но в статистику не войдёт.');
          }

          if (cu.tank > 0 && lit > cu.tank * 1.03) {
            out.push('<b style="color:var(--red)">Залито больше объёма бака (' + U.liters(cu.tank) + ')</b>');
          }
          if (srcEl === 'tank' && lit > 0) {
            var tk = CALC.tank(cu.fuel);
            var left = tk.balance - lit + (f && f.source === 'tank' ? U.num(f.liters) : 0);
            out.push('В бочке останется <b>' + U.liters(left) + '</b>' + (left < 0 ? ' — учёт уйдёт в минус' : ''));
          }
          if (!fullEl) out.push('Заправка не до полного — расход посчитается на следующей полной.');

          $('#f-prev').innerHTML = out.length
            ? '<div style="font-size:14px;line-height:1.5;color:var(--text-2)">' + out.join('<br><br>') + '</div>'
            : '<div style="font-size:14px;color:var(--text-2)">Введите литры и показание счётчика — приложение сразу покажет расход.</div>';
        }
        draw();

        litEl.addEventListener('input', function () { money(); draw(); });
        priceEl.addEventListener('input', function () { money(); draw(); });
        costEl.addEventListener('input', function () {
          var c = U.num(costEl.value), lit = U.num(litEl.value), pr = U.num(priceEl.value);
          if (lit > 0) priceEl.value = U.int(c / lit);
          else if (pr > 0) litEl.value = U.dec(c / pr, 1);
          draw();
        });
        meterEl.addEventListener('input', draw);
        $('#f-unit').addEventListener('change', function () {
          var cu = cur();
          $('#f-mu').textContent = U.meterUnit(cu.meter);
          var cs = CALC.unit(cu);
          meterEl.placeholder = cs.last ? 'было ' + U.int(cs.last.meter) : U.meterName(cu.meter);
          if (!priceEl.value) priceEl.value = DB.price(cu.fuel) || '';
          draw();
        });

        bd.addEventListener('click', function (e) {
          var c = e.target.closest('.chip');
          if (c) {
            if (c.dataset.src) {
              srcEl = c.dataset.src;
              U.$$('[data-src]', bd).forEach(function (b) { b.classList.toggle('on', b.dataset.src === srcEl); });
            } else if (c.dataset.full) {
              fullEl = !fullEl;
              c.classList.toggle('on', fullEl);
            } else if (c.dataset.meter) {
              meterEl.value = c.dataset.meter;
            } else if (c.dataset.lit) {
              litEl.value = String(c.dataset.lit).replace('.', ',');
              money();
            }
            draw();
            return;
          }
          var d = e.target.closest('[data-del]');
          if (d) {
            App.closeSheet();
            App.ask({
              title: 'Удалить заправку?',
              text: 'Расход и остаток в бочке пересчитаются заново.',
              ok: 'Удалить', danger: true,
              onOk: function () { DB.delFill(d.dataset.del); U.toast('Заправка удалена'); App.render(); }
            });
          }
        });

        setTimeout(function () { litEl.focus(); }, 380);
        F._fillState = function () { return { source: srcEl, full: fullEl }; };
      },
      onSave: function (bd) {
        var stt = F._fillState();
        var cu = DB.unit(bd.querySelector('#f-unit').value);
        var lit = U.num(bd.querySelector('#f-lit').value);
        if (!cu) { U.toast('Выберите технику'); return false; }
        if (lit <= 0) { U.toast('Введите литры'); return false; }
        var pr = U.num(bd.querySelector('#f-price').value);
        var patch = {
          unitId: cu.id,
          date: bd.querySelector('#f-date').value || U.today(),
          liters: lit,
          price: pr,
          cost: U.num(bd.querySelector('#f-cost').value) || lit * pr,
          meter: U.num(bd.querySelector('#f-meter').value),
          fuel: cu.fuel,
          source: stt.source,
          full: stt.full,
          operator: bd.querySelector('#f-op').value.trim(),
          note: bd.querySelector('#f-note').value.trim()
        };
        if (f) { DB.updFill(f.id, patch); U.toast('Сохранено'); }
        else {
          DB.addFill(patch);
          var seg = CALC.segmentOf(cu, DB.lastFill(cu.id).id);
          U.toast(seg && seg.rate != null
            ? 'Записано · расход ' + U.rate(seg.rate, cu.meter)
            : 'Заправка записана');
        }
        App.render();
        return true;
      }
    });
  };

  /* ============ ЗАГРУЗКА БАЗЫ ============ */
  F.importSheet = function () {
    var h = '<div class="hint" style="padding:0 4px 14px">Выберите резервную копию <b>.json</b> или таблицу <b>.csv</b> с заправками. Можно вставить текст ниже.</div>' +
      '<div class="list">' +
      '<button class="row tap" id="pick"><span class="grow"><span class="ttl" style="color:var(--accent)">Выбрать файл</span>' +
      '<span class="sub">.json или .csv</span></span></button></div>' +
      '<input type="file" id="file" accept=".json,.csv,.txt,application/json,text/csv" style="display:none">' +
      '<h2 class="sec">Или вставьте текст</h2>' +
      '<div class="list"><div class="field col"><textarea id="paste" style="min-height:130px;font-size:14px" ' +
      'placeholder="Самосвал №1;01.09.2026;180;12300;190500;ДТ;бочка;до полного;объект Восток"></textarea></div></div>' +
      '<div class="hint">Столбцы CSV: <b>Техника;Дата;Литры;Цена;Счётчик;Топливо;Источник;До полного;Заметка</b>. ' +
      'Разделитель — точка с запятой, строка заголовков не обязательна. Техника создаётся автоматически, если её ещё нет.</div>' +
      '<h2 class="sec">Как загружать</h2>' +
      '<div class="seg" id="mode"><button data-m="merge" class="on">Добавить к текущим</button>' +
      '<button data-m="replace">Заменить всё</button></div>';

    App.sheet({
      title: 'Загрузка базы', html: h, save: 'Загрузить',
      onOpen: function (bd) {
        bd.querySelector('#pick').addEventListener('click', function () { bd.querySelector('#file').click(); });
        bd.querySelector('#file').addEventListener('change', function (e) {
          var file = e.target.files[0];
          if (!file) return;
          var fr = new FileReader();
          fr.onload = function () { bd.querySelector('#paste').value = fr.result; U.toast('Файл прочитан: ' + file.name); };
          fr.readAsText(file);
        });
        bd.addEventListener('click', function (e) {
          var m = e.target.closest('[data-m]');
          if (m) { U.$$('#mode button', bd).forEach(function (b) { b.classList.remove('on'); }); m.classList.add('on'); }
        });
      },
      onSave: function (bd) {
        var text = bd.querySelector('#paste').value.trim();
        if (!text) { U.toast('Не выбран файл и не вставлен текст'); return false; }
        var mode = bd.querySelector('#mode .on').dataset.m;

        function run() {
          try {
            if (text[0] === '{') {
              var res = DB.importJSON(text, mode);
              U.toast('Загружено: ' + U.unitsWord(res.units) + ', заправок ' + res.fills);
            } else {
              if (mode === 'replace') { DB.data = DB.empty(); DB.save(); }
              var n = DB.importCSV(text);
              U.toast(n ? 'Добавлено заправок: ' + n : 'Ни одной строки не распознано');
            }
            App.closeSheet();
            App.go('#/');
          } catch (err) {
            U.toast('Ошибка: ' + err.message);
          }
        }

        if (mode === 'replace') {
          App.ask({
            title: 'Заменить всю базу?',
            text: 'Техника, заправки и приход топлива будут стёрты и заменены загружаемыми.',
            ok: 'Заменить', danger: true, onOk: run
          });
        } else run();

/* Запуск, навигация, модальные листы, действия */
(function (w) {
  'use strict';

  var App = { route: '#/', lastRoute: null };

  /* ---------- простая хэш-функция для кода-пароля ---------- */
  App.hash = function (s) {
    var h = 5381, str = 'toplivo.' + s;
    for (var i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
    return h.toString(36);
  };

  /* ---------- навигация ---------- */

  };

    var scr = U.$('#screen'), html = '';

    if (r.indexOf('#/unit/') === 0) html = V.unitDetail(r.slice(7));
    else if (r === '#/units') html = V.units();
    else if (r === '#/tank') html = V.tank();
    else if (r === '#/more') html = V.more();
    else html = V.home();

    scr.innerHTML = html;
    var wrap = scr.querySelector('.wrap');
    if (wrap) wrap.classList.add('fade');

    /* кнопка «＋» поверх списка техники — быстрая заправка */
    if (r === '#/units' || r === '#/tank') {
      var fab = document.createElement('button');
      fab.className = 'fab';
      fab.setAttribute('data-act', r === '#/tank' ? 'new-supply' : 'new-fill');
      fab.textContent = '＋';
      scr.appendChild(fab);
    }

    U.$$('.tabbar a').forEach(function (a) {
      var base = r.indexOf('#/unit/') === 0 ? '#/units' : r;
      a.classList.toggle('on', a.getAttribute('href') === base);
    });

    if (App.lastRoute !== r) { w.scrollTo(0, 0); App.lastRoute = r; }
    App.onScroll();
  };

  App.onScroll = function () {
    var tb = U.$('#topbar');

  };

  /* ---------- модальный лист ---------- */
  App.sheet = function (opt) {
    App.closeSheet(true);
    var bg = document.createElement('div');
    bg.className = 'sheet-bg';
    var sh = document.createElement('div');
    sh.className = 'sheet';
    sh.innerHTML = '<div class="grabber"></div>' +
      '<div class="sheet-hd"><button data-sheet="cancel">Отмена</button>' +
      '<span class="t">' + U.esc(opt.title || '') + '</span>' +
      (opt.save ? '<button class="strong" data-sheet="save">' + U.esc(opt.save) + '</button>'
        : '<span style="min-width:64px"></span>') + '</div>' +
      '<div class="sheet-bd"></div>';
    var bd = sh.querySelector('.sheet-bd');
    bd.innerHTML = opt.html || '';
    document.body.appendChild(bg);
    document.body.appendChild(sh);
    document.body.classList.add('no-scroll');

    requestAnimationFrame(function () { bg.classList.add('in'); sh.classList.add('in'); });

    bg.addEventListener('click', function () { App.closeSheet(); });
    sh.addEventListener('click', function (e) {
      var b = e.target.closest('[data-sheet]');
      if (!b) return;
      if (b.dataset.sheet === 'cancel') return App.closeSheet();
      if (b.dataset.sheet === 'save') {
        if (!opt.onSave || opt.onSave(bd) !== false) App.closeSheet();
      }
    });
    App._sheet = { bg: bg, sh: sh };
    if (opt.onOpen) opt.onOpen(bd);
  };

  App.closeSheet = function (now) {
    var s = App._sheet;
    if (!s) return;
    App._sheet = null;
    document.body.classList.remove('no-scroll');
    if (now) { s.bg.remove(); s.sh.remove(); return; }
    s.bg.classList.remove('in'); s.sh.classList.remove('in');
    setTimeout(function () { s.bg.remove(); s.sh.remove(); }, 340);
  };

  /* ---------- диалог подтверждения (вместо системного confirm) ---------- */
  App.ask = function (opt) {
    var bg = document.createElement('div');

      (opt.text ? '<div class="ask-d">' + U.esc(opt.text) + '</div>' : '<div style="height:16px"></div>') +
      '<div class="ask-btns"><button data-a="no">' + U.esc(opt.cancel || 'Отмена') + '</button>' +
      '<button data-a="yes" class="' + (opt.danger ? 'danger' : '') + '">' + U.esc(opt.ok || 'Да') + '</button></div></div>';
    document.body.appendChild(bg);
    requestAnimationFrame(function () { bg.classList.add('in'); });

    function close(yes) {
      bg.classList.remove('in');
      setTimeout(function () { bg.remove(); }, 220);
      if (yes && opt.onOk) opt.onOk();
      if (!yes && opt.onCancel) opt.onCancel();
    }
    bg.addEventListener('click', function (e) {

      if (b) return close(b.dataset.a === 'yes');

  };

  /* ---------- отправить текст ---------- */
  App.shareText = function (text) {
    if (navigator.share) {
      navigator.share({ text: text }).catch(function () { });
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(function () { U.toast('Отчёт скопирован'); })
        .catch(function () { U.toast('Скопируйте текст вручную'); });
      return;
    }
    U.toast('Скопируйте текст вручную');
  };

  /* ---------- сохранение файла ----------
     Порядок попыток: среда Artifact (claude.use) → «Поделиться» на iOS →
     обычное скачивание → показать текст для копирования вручную.     */
  App.saveFile = function (name, text, mime, done) {
    done = done || function () { };

    if (w.claude && typeof w.claude.use === 'function') {
      App._dlp = App._dlp || w.claude.use('downloads');
      App._dlp.then(function (dl) {
        if (!dl) return App.copyFallback(name, text, done);
        dl.save({ filename: name, data: text })
          .then(function () { done(true); })
          .catch(function (e) {
            if (e && e.code === 'declined') { done(false); return; }
            App.copyFallback(name, text, done);
          });
      }, function () { App.copyFallback(name, text, done); });
      return;
    }

    try {
      if (w.File && navigator.canShare) {
        var f = new File([text], name, { type: mime });
        if (navigator.canShare({ files: [f] })) {
          navigator.share({ files: [f], title: name })
            .then(function () { done(true); })
            .catch(function () { done(false); });
          return;
        }
      }
    } catch (e) { }

    try {
      var blob = new Blob([text], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      done(true);
      return;
    } catch (e) { }

    App.copyFallback(name, text, done);
  };

  App.copyFallback = function (name, text, done) {
    App.sheet({
      title: 'Скопируйте копию',
      save: null,
      html: '<div class="hint" style="padding:0 4px 12px">Здесь сохранить файл нельзя. Скопируйте текст и вставьте его в заметку или мессенджер — из него база восстанавливается целиком через «Загрузить базу».</div>' +
        '<button class="btn" id="cp">Скопировать всё</button>' +
        '<div class="list" style="margin-top:12px"><div class="field col">' +
        '<label>' + U.esc(name) + '</label>' +
        '<textarea id="dump" readonly style="min-height:220px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace"></textarea>' +
        '</div></div>',
      onOpen: function (bd) {
        var ta = bd.querySelector('#dump');
        ta.value = text;
        bd.querySelector('#cp').addEventListener('click', function () {
          ta.focus(); ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { }
          if (ok) { U.toast('Скопировано'); done(true); return; }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
              .then(function () { U.toast('Скопировано'); done(true); })
              .catch(function () { U.toast('Скопируйте выделенный текст вручную'); });
          } else {
            U.toast('Скопируйте выделенный текст вручную');
          }
        });
      }
    });
  };

  /* ---------- действия ---------- */
  var ACTIONS = {
    back: function () { history.length > 1 ? history.back() : App.go('#/'); },
    unit: function (d) { App.go('#/unit/' + d.id); },
    'go-tank': function () { App.go('#/tank'); },
    filter: function (d) { V.unitsFilter = d.f; App.render(); },

    'new-fill': function (d) { F.fillForm({ unitId: d.unit || null }); },

    'repeat-fill': function (d) {

    },

    'new-unit': function () { F.unitForm(); },
    'edit-unit': function (d) { F.unitForm(d.id); },
    'del-unit': function (d) {
      var u = DB.unit(d.id);

  };

  /* ---------- экран блокировки ---------- */
  App.lock = function (done) {
    var buf = '';
    var el = document.createElement('div');

    el.innerHTML = '<div style="font-size:44px">🔐</div>' +
      '<div style="font-size:19px;font-weight:600">Введите код</div>' +

      '<div class="keypad" style="margin-top:8px">' +

      '<button class="blank"></button><button data-n="0">0</button>' +
      '<button data-n="del" style="font-size:20px">⌫</button></div>';
    document.body.appendChild(el);

    function draw() {
      U.$$('#dots i', el).forEach(function (d, i) { d.classList.toggle('on', i < buf.length); });
    }
    el.addEventListener('click', function (e) {
      var b = e.target.closest('[data-n]');
      if (!b) return;
      if (b.dataset.n === 'del') { buf = buf.slice(0, -1); draw(); return; }
