<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Как это работает — агент заселения</title>
<meta name="description" content="Гость пишет слева, менеджер видит заявку справа: подбор, брони, удержания и перехват диалога — всё вживую.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111419'/%3E%3Cpath d='M9 22V10h3v5l5-5h4l-6 6 6 6h-4l-5-5v5z' fill='%23c9a227'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/demo.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <b>Ключи 24 — как это работает</b>
    <span>слева пишет гость, справа менеджер видит всё вживую</span>
  </div>
  <div class="hint" id="hint">Начните с подсказки под чатом — например «нужна квартира с 10 по 13 марта, нас трое»</div>
  <button class="ghost" id="reset">Начать сначала</button>
</header>

<main class="stage">

  <section class="side guest">
    <div class="side-head">
      <span class="dot"></span>
      <b>Гость</b>
      <div class="seg" id="who">
        <button data-guest="g1" class="on">Айгерим</button>
        <button data-guest="g2">Ержан</button>
      </div>
    </div>

    <div class="phone">
      <div class="phone-head">Ключи 24 · чат на сайте</div>
      <div class="thread" id="thread"></div>
      <div class="composer">
        <div class="chips" id="chips"></div>
        <div class="row">
          <textarea id="input" rows="1" placeholder="Напишите как гость…"></textarea>
          <button class="send" id="send">→</button>
        </div>
      </div>
    </div>
  </section>

  <section class="side panel">
    <div class="side-head">
      <span class="dot live"></span>
      <b>Пульт менеджера</b>
      <div class="seg" id="tabs">
        <button data-tab="dialogs" class="on">Диалоги</button>
        <button data-tab="bookings">Брони</button>
        <button data-tab="holds">Удержания</button>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="panel-body">
      <div class="queue" id="queue"></div>
      <div class="work" id="work"></div>
    </div>
  </section>

</main>

<script src="js/util.js"></script>
<script src="js/knowledge.js"></script>
<script src="js/holds.js"></script>
<script src="js/nlu.js"></script>
<script src="js/policy.js"></script>
<script src="js/reply.js"></script>
<script src="js/risk.js"></script>
<script src="js/scenarios.js"></script>
<script src="js/agent.js"></script>
<script src="js/demo-platform.js"></script>
</body>
</html>
