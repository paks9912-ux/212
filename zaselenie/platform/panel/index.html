<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пульт менеджера — Ключи 24</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111419'/%3E%3Cpath d='M9 22V10h3v5l5-5h4l-6 6 6 6h-4l-5-5v5z' fill='%23c9a227'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/panel/app.css">
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><b>Пульт менеджера</b><span id="conn">подключаюсь…</span></div>
    <nav class="tabs" id="tabs">
      <button data-tab="dialogs" class="on">Диалоги <i id="count-dialogs"></i></button>
      <button data-tab="bookings">Брони <i id="count-bookings"></i></button>
      <button data-tab="holds">Удержания <i id="count-holds"></i></button>
    </nav>
    <div class="stats" id="stats"></div>
  </header>

  <main class="main">
    <section class="pane list" id="pane-list">
      <div class="filters" id="filters">
        <button data-filter="" class="on">Все</button>
        <button data-filter="эскалации">Нужен человек</button>
        <button data-filter="менеджер">У меня</button>
      </div>
      <div class="rows" id="rows"></div>
    </section>

    <section class="pane talk" id="pane-talk">
      <div class="talk-head" id="talk-head"><span class="empty">Выберите диалог слева</span></div>
      <div class="thread" id="thread"></div>
      <div class="composer" id="composer" hidden>
        <div class="quick" id="quick"></div>
        <div class="row">
          <textarea id="input" rows="1" placeholder="Ответить гостю от своего имени…"></textarea>
          <button class="send" id="send">Отправить</button>
        </div>
      </div>
    </section>

    <section class="pane side" id="pane-side"></section>
  </main>
</div>

<script src="/panel/app.js"></script>
</body>
</html>
