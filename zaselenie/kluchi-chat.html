<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Агент заселения — квартиры посуточно в Астане</title>
<meta name="description" content="AI-агент, который принимает заявки на посуточное заселение: разбирает запрос, считает цену по календарю и ведёт гостя до брони.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111419'/%3E%3Cpath d='M9 22V10h3v5l5-5h4l-6 6 6 6h-4l-5-5v5z' fill='%23c9a227'/%3E%3C/svg%3E">
<style>
:root{
    --bg:#08090b;
    --bg2:#0d0f12;
    --card:#111419;
    --line:rgba(236,238,243,.10);
    --text:#eceef3;
    --muted:rgba(236,238,243,.45);
    --dim:rgba(236,238,243,.62);
    --accent:#c9a227;
    --ok:#3f9d6b;
    --warn:#c98a27;
    --bad:#c7564b;
    --radius:14px;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{min-height:100vh;}

body{
    background:var(--bg);
    color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
}

button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
a{color:inherit;}

/* ---------- каркас ---------- */

.app{
    width:100%;
    display:flex;
    flex-direction:column;
    height:100vh;height:100dvh;
    max-width:1280px;
    margin:0 auto;
}

.top{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
}

.brand{display:flex;flex-direction:column;margin-right:auto;}
.brand b{font-weight:600;letter-spacing:.02em;}
.brand span{color:var(--muted);font-size:12.5px;}

.seg{
    display:flex;
    border:1px solid var(--line);
    border-radius:999px;
    overflow:hidden;
}
.seg button{
    background:none;border:0;padding:7px 14px;color:var(--muted);cursor:pointer;
    transition:background .15s,color .15s;font-size:13px;
}
.seg button.on{background:rgba(201,162,39,.14);color:var(--accent);}

.ghost{
    background:none;border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;color:var(--dim);cursor:pointer;font-size:13px;
    transition:border-color .15s,color .15s;
}
.ghost:hover{border-color:rgba(236,238,243,.3);color:var(--text);}

.tabs{display:none;gap:8px;padding:10px 16px 0;}
.tabs button{flex:1;background:none;border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--muted);cursor:pointer;}
.tabs button.on{color:var(--text);border-color:rgba(201,162,39,.5);}

.main{
    display:grid;
    grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
    gap:1px;
    background:var(--line);
    flex:1;
    min-height:0;
}
.pane{background:var(--bg);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;}

/* ---------- чат ---------- */

.chat{flex:1;min-width:0;overflow-y:auto;padding:22px 20px 8px;display:flex;flex-direction:column;gap:14px;}

.msg{max-width:88%;padding:12px 15px;border-radius:var(--radius);white-space:pre-wrap;overflow-wrap:anywhere;}
.msg.guest{align-self:flex-end;background:#1b2027;border:1px solid var(--line);border-bottom-right-radius:4px;}
.msg.agent{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;}
.msg.sys{align-self:center;background:none;border:1px dashed var(--line);color:var(--muted);font-size:13px;text-align:center;}
.msg .who{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.msg .tag{
    display:block;margin-top:10px;font-size:11.5px;color:var(--muted);
    border-top:1px solid var(--line);padding-top:8px;
}

.typing{color:var(--muted);font-size:13px;padding:0 4px;}

.composer{border-top:1px solid var(--line);padding:12px 16px 16px;}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chips button{
    white-space:nowrap;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;color:var(--dim);font-size:12.5px;cursor:pointer;
}
.chips button:hover{color:var(--text);border-color:rgba(201,162,39,.45);}

.row{display:flex;gap:10px;align-items:flex-end;}
.row textarea{
    flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;resize:none;min-height:46px;max-height:140px;outline:none;
}
.row textarea:focus{border-color:rgba(201,162,39,.5);}
.send{
    background:var(--accent);border:0;border-radius:12px;padding:12px 18px;
    color:#15130a;font-weight:600;cursor:pointer;
}
.send:disabled{opacity:.45;cursor:default;}

/* ---------- разбор ---------- */

.insight{flex:1;min-width:0;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}

.block{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg2);padding:14px 16px;}
.block h3{
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    font-weight:500;margin-bottom:10px;
}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid rgba(236,238,243,.05);font-size:13.5px;}
.kv:last-child{border-bottom:0;}
.kv span:first-child{color:var(--muted);}
.kv span:last-child{text-align:right;}

.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);}
.badge.ok{color:var(--ok);border-color:rgba(63,157,107,.4);background:rgba(63,157,107,.1);}
.badge.warn{color:var(--warn);border-color:rgba(201,138,39,.4);background:rgba(201,138,39,.1);}
.badge.bad{color:var(--bad);border-color:rgba(199,86,75,.4);background:rgba(199,86,75,.1);}

.scen{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.scen b{font-weight:600;}
.reason{color:var(--dim);font-size:13px;}

.bar{height:5px;border-radius:3px;background:rgba(236,238,243,.09);overflow:hidden;margin:8px 0 10px;}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s;}
.bar.warn i{background:var(--warn);}
.bar.bad i{background:var(--bad);}

.list{display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:var(--dim);}
.list div{display:flex;gap:8px;}
.list div::before{content:'·';color:var(--muted);}

.tagline{display:flex;flex-wrap:wrap;gap:6px;}
.tagline span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--dim);}

pre.json{
    margin-top:4px;font-size:12px;line-height:1.5;color:var(--dim);
    background:#0a0c0f;border:1px solid var(--line);border-radius:10px;
    padding:12px;overflow:auto;max-height:280px;
}

.empty{color:var(--muted);font-size:13.5px;}

/* ---------- настройки ---------- */

.modal{
    position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:20;
}
.modal.on{display:flex;}
.modal .box{
    background:var(--bg2);border:1px solid var(--line);border-radius:18px;
    padding:22px;width:min(440px,100%);display:flex;flex-direction:column;gap:14px;
}
.modal h2{font-size:17px;font-weight:600;}
.modal label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);}
.modal input,.modal select{
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;
}
.modal p{font-size:12.5px;color:var(--muted);line-height:1.5;}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;}

/* Гостевой вид: только переписка, без служебной кухни */
body.guest .dev,
body.guest .tabs,
body.guest #pane-insight,
body.guest .msg .tag,
body.guest .msg.sys{display:none;}
body.guest .main{grid-template-columns:minmax(0,1fr);}
body.guest .msg{max-width:min(78%,640px);}
body.guest .chat{padding-top:28px;}

@media (max-width:900px){
    .main{grid-template-columns:1fr;}
    .tabs{display:flex;}
    .pane.off{display:none;}
    .msg{max-width:94%;}
}

  d.textContent = "Страница не запустилась: " + msg + " (строка " + line + ")." +

</head>
<body>

<div class="app">

  <header class="top">
    <div class="brand">
      <b>Агент заселения</b>
      <span>Ключи 24 · квартиры посуточно в Астане</span>
    </div>

    <div class="seg" id="view">
      <button data-view="guest">Как видит гость</button>
      <button data-view="full" class="on">С разбором</button>
    </div>
    <div class="seg dev" id="mode">
      <button data-mode="engine" class="on">Движок</button>
      <button data-mode="claude">Движок + Claude</button>
    </div>
    <button class="ghost dev" id="settings">Ключ API</button>
    <button class="ghost" id="reset">Новый диалог</button>
  </header>

  <div class="tabs" id="tabs">
    <button data-tab="chat" class="on">Переписка</button>
    <button data-tab="insight">Разбор</button>
  </div>

  <div class="main">

    <section class="pane" id="pane-chat">
      <div class="chat" id="chat"></div>

      <div class="composer">
        <div class="chips" id="chips"></div>
        <div class="row">
          <textarea id="input" rows="1" placeholder="Напишите как гость: «нужна квартира с 10 по 13 марта, нас трое, с котом»"></textarea>
          <button class="send" id="send">Отправить</button>
        </div>
      </div>
    </section>

    <section class="pane off" id="pane-insight">
      <div class="insight" id="insight">
        <div class="block"><h3>Разбор запроса</h3>
          <div class="empty">Напишите сообщение — здесь появится то, что агент понял: слоты, допущения, риски и решение.</div>
        </div>
      </div>
    </section>

  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h2>Режим с Claude</h2>
    <p>Движок считает цены и свободные даты, а модель формулирует ответ живым языком.
       Ключ хранится только в вашем браузере и отправляется прямо в Anthropic.
       Для боевого бота вызов выносят на сервер — ключ в браузере виден всем, кто откроет страницу.</p>
    <label>Ключ API
      <input type="password" id="key" placeholder="sk-ant-..." autocomplete="off">
    </label>
    <label>Модель
      <select id="model"></select>
    </label>
    <div class="acts">
      <button class="ghost" id="cancel">Отмена</button>
      <button class="send" id="save">Сохранить</button>
    </div>
  </div>
</div>

    var m = re.exec(t);
    if (!m) return null;
    var d1 = +m[1], m1 = m[2] ? monthIndex(m[2]) : null;
    var d2 = +m[3], m2 = m[4] ? monthIndex(m[4]) : null;
    if (!m1 && !m2) {
      /* «с 10 по 12», «на 10-12» — месяц не назван, берём ближайший подходящий */
      if (d1 < 1 || d1 > 31 || d2 < 1 || d2 > 31) return null;
      if (/[.\/]/.test(m[0])) return null;                      // «12.03 - 15.03» разберут points()
      if (/(?:человек|гост|чел|ноч|сут|дн|лет|год|тыс|000)/.test(t.slice(m.index, m.index + 40))) return null;
      var today = U.today(), ym = +today.slice(0, 4), mm0 = +today.slice(5, 7);
      var f = U.make(ym, mm0, Math.min(d1, 28));
      if (U.diffDays(today, f) < 0) { f = U.addMonths(f, 1); mm0 = +f.slice(5, 7); ym = +f.slice(0, 4); }
      var t2 = U.make(ym, mm0, Math.min(d2, 28));
      if (t2 <= f) t2 = U.addMonths(t2, 1);
      return { from: f, to: t2, vague: true };
    }
    if (!m1) m1 = (d1 > d2 && m2 > 1) ? m2 - 1 : m2;   // «с 30 по 2 апреля» → март
    if (!m2) m2 = (d2 < d1) ? (m1 % 12) + 1 : m1;
    var year = m[5] ? +m[5] : null;
    var from = resolve(d1, m1, year), to = resolve(d2, m2, year);
    if (year && from && U.diffDays(U.today(), from) < 0) return { from: from, to: to, past: true };
    if (!from || !to) return null;
    if (to <= from) {
      if (m[4]) return { from: from, to: to, invalid: true };   // месяц назван явно — это опечатка гостя
      to = U.addMonths(to, 1);                                  // «с 30 по 2» — следующий месяц
    }
    return { from: from, to: to };
  }

  function duration(t) {
    var m;
    m = new RegExp('(?:на|ещ?е на|продлить на)\\s*' + NUM_RE + '?\\s*(?:календарн[а-яa-z]*\\s*)?(ноч|сут|дн[еяю]|день|дней)').exec(t);
    if (m) return { nights: num(m[1]) || 1, unit: /ноч|сут/.test(m[2]) ? 'night' : 'day' };
    m = new RegExp('(?:на|ещ?е на)\\s*' + NUM_RE + '?\\s*недел').exec(t);
    if (m) return { nights: 7 * (num(m[1]) || 1), unit: 'week' };
    m = new RegExp('(?:на|ещ?е на)\\s*' + NUM_RE + '?\\s*месяц').exec(t);
    if (m) return { nights: 30 * (num(m[1]) || 1), unit: 'month' };
    m = /(\d+)\s*(?:nights?|days?)/.exec(t);
    if (m) return { nights: +m[1], unit: 'night' };
    if (/на пару (дней|суток|ноч)/.test(t)) return { nights: 2, unit: 'night' };
    if (/на выходн/.test(t)) return { nights: 2, unit: 'weekend' };
    if (/переночевать|одну ночь|на ночь\b|на ночевку/.test(t)) return { nights: 1, unit: 'night' };
    return null;
  }

  function relative(t) {
    var today = U.today();
    if (/(?:^|[^а-я])послезавтра(?:[^а-я]|$)/.test(t)) return { from: U.addDays(today, 2), why: 'послезавтра' };
    if (/(?:^|[^а-я])завтра(?:[^а-я]|$)/.test(t)) return { from: U.addDays(today, 1), why: 'завтра' };
    if (/сегодня|сейчас|прямо сейчас|срочно|через час|уже в городе|вечером|ночью/.test(t)) return { from: today, why: 'сегодня' };
    for (var k in WEEKDAYS) {
      if (new RegExp('(?:с|со|в|во|на)\\s*' + k).test(t)) {
        var target = WEEKDAYS[k], cur = U.dow(today), add = (target - cur + 7) % 7;
        if (add === 0) add = 7;
        return { from: U.addDays(today, add), why: 'ближайш' + (target === 0 ? 'ее воскресенье' : 'ий день недели') };
      }
    }
    if (/новы[йм] год|нг\b|31 декабр/.test(t)) {
      var y = +today.slice(0, 4);
      var ny = U.make(y, 12, 30);
      if (U.diffDays(today, ny) < 0) ny = U.make(y + 1, 12, 30);
      return { from: ny, to: U.addDays(ny, 4), why: 'новогодние даты', assumed: true };
    }
    if (/на выходн/.test(t)) {
      var cur2 = U.dow(today), add2 = (5 - cur2 + 7) % 7;
      if (add2 === 0) add2 = 7;
      var fri = U.addDays(today, add2);
      return { from: fri, to: U.addDays(fri, 2), why: 'ближайшие выходные', assumed: true };
    }
    var mm = new RegExp('(?:в|на)\\s*(начал|серед|конц)[а-яa-z]*\\s*' + MONTH_RE).exec(t);
    if (mm) {
      var mi = monthIndex(mm[2]);
      var day = mm[1] === 'начал' ? 5 : (mm[1] === 'серед' ? 15 : 25);
      return { from: resolve(day, mi, null), why: 'примерно ' + mm[1] + 'о месяца', vague: true };
    }
    var m3 = new RegExp('(?:^|\\s)(?:в|на)\\s*' + MONTH_RE + '[а-я]*').exec(t);
    if (m3) {
      var mi3 = monthIndex(m3[1]);
      return { from: resolve(1, mi3, null), why: 'месяц назван без чисел', vague: true };
    }
    return null;
  }

  function parseDates(t) {
    var d = { from: null, to: null, nights: null, flexible: false, assumed: [], issues: [], source: null };
    var dur = duration(t);
    var pr = pairedRange(t);
    var pts = points(t);
    var rel = relative(t);

    if (pr) {
      d.from = pr.from; d.to = pr.to; d.source = 'диапазон с датами';
      if (pr.invalid) { d.issues.push('выезд не позже заезда'); d.to = null; }
      if (pr.past) d.issues.push('дата заезда уже прошла');
      if (pr.vague) d.assumed.push('месяц не назван — взяли ближайший, подтвердите');
    } else if (pts.length >= 2 && /\b(с|со)\b|по|до|-|–/.test(t)) {
      d.from = pts[0].iso; d.to = pts[1].iso; d.source = 'две даты в тексте';
      if (d.to <= d.from) { d.to = null; d.issues.push('вторая дата не позже первой'); }
    } else if (pts.length === 1) {
      d.from = pts[0].iso; d.source = 'одна дата в тексте';
      if (pts[0].approx) d.assumed.push('число без месяца — взяли ближайшее');
    } else if (rel) {
      d.from = rel.from; d.to = rel.to || null;
      d.source = rel.why;
      if (rel.assumed) d.assumed.push('даты «' + rel.why + '» — нужно подтвердить');
      if (rel.vague) { d.flexible = true; d.from = null; d.monthHint = rel.from; d.assumed.push(rel.why); }
    }

    if (dur && !d.to && d.from) {
      d.to = U.addDays(d.from, dur.nights);
      if (dur.unit === 'day') d.assumed.push('«дни» посчитали как ночи');
      d.source = (d.source || '') + ' + срок';
    }
    if (dur && !d.from && !d.to) { d.nights = dur.nights; d.flexible = true; }
    if (d.from && d.to) d.nights = U.diffDays(d.from, d.to);
    else if (dur) d.nights = dur.nights;

    if (d.from && U.diffDays(U.today(), d.from) < 0) d.issues.push('дата заезда уже прошла');
    if (d.from && KB && KB.settings.bookingHorizonDays &&
        U.diffDays(U.today(), d.from) > KB.settings.bookingHorizonDays) {
      d.issues.push('до этой даты календарь ещё не открыт');
    }
    if (d.nights !== null && d.nights <= 0) d.issues.push('выезд не позже заезда');
    if (d.nights > 180) d.issues.push('срок больше полугода — это уже долгосрочная аренда');
    if (/гибк|любые даты|плюс-минус|примерно|ориентировочно|пока не точно/.test(t)) d.flexible = true;
    return d;
  }

  /* ---------- гости ---------- */

  function parseGuests(t) {
    var g = { adults: null, children: null, childAges: [], total: null, stated: false, assumed: [] };
    var m;

    m = new RegExp(NUM_RE + '\\s*(?:взросл[а-яa-z]*)').exec(t);
    if (m) { g.adults = num(m[1]); g.stated = true; }

    m = new RegExp(NUM_RE + '\\s*(?:дет[а-яa-z]*|ребен[а-яa-z]*|реб\\b|малыш[а-яa-z]*)').exec(t);
    if (m) { g.children = num(m[1]); g.stated = true; }
    else if (/с ребенком|с малышом|с дочк|с сыном|с грудничком|с младенцем/.test(t)) { g.children = 1; g.stated = true; }
    else if (/с детьми/.test(t)) { g.children = 2; g.stated = true; g.assumed.push('«с детьми» — считаем, что двое'); }

    var age = /(?:ребен[а-яa-z]*|дочк[а-яa-z]*|сын[а-яa-z]*|малыш[а-яa-z]*|ем[уy])\D{0,12}?(\d{1,2})\s*(год|года|лет|месяц|мес)/.exec(t) ||
              /(\d{1,2})\s*(год|года|лет|месяц|мес)\D{0,12}?(?:ребен|дочк|сын|малыш)/.exec(t);
    if (age) g.childAges.push(/мес/.test(age[2]) ? 0 : +age[1]);
    if (/грудничк|младенц|новорожден/.test(t)) g.childAges.push(0);

    var notDate = '(?!\\s*(?:' + MONTHS.join('|') + '|числ|\\.|/|:|ноч|сут|дн|недел|месяц))';
    m = new RegExp('(?:нас|приедем|будем|будет|заселя[а-яa-z]*|размест[а-яa-z]*)\\s*(?:всего\\s*)?' + NUM_RE + notDate).exec(t);
    if (m) { g.total = num(m[1]); g.stated = true; }
    if (g.total === null) {
      m = new RegExp(NUM_RE + '\\s*(?:человек[а-яa-z]*|чел\\b|гост[а-яa-z]*|персон[а-яa-z]*|мужчин[а-яa-z]*|женщин[а-яa-z]*|студент[а-яa-z]*|парн[а-яa-z]*|девуш[а-яa-z]*|друз[а-яa-z]*|коллег[а-яa-z]*|сотрудник[а-яa-z]*)').exec(t);
      if (m) { g.total = num(m[1]); g.stated = true; }
    }
    if (g.total === null) {
      m = /(?:for|we are|party of)\s*(\d+)|(\d+)\s*(?:guests?|people|persons?|adults?|pax)/.exec(t);
      if (m) { g.total = +(m[1] || m[2]); g.stated = true; }
    }
    if (g.total === null) {
      m = /семь[яи] из (\d+)/.exec(t);
      if (m) { g.total = +m[1]; g.stated = true; }
    }
    if (g.total === null) {
      if (/вдвоем|с женой|с мужем|с девушкой|с парнем|с супруг|с подругой|с другом/.test(t)) { g.total = 2; g.stated = true; }
      else if (/втроем/.test(t)) { g.total = 3; g.stated = true; }
      else if (/вчетвером/.test(t)) { g.total = 4; g.stated = true; }
      else if (/впятером/.test(t)) { g.total = 5; g.stated = true; }
      else if (/(^|[^а-я])(один|одна|сам|соло)([^а-я]|$)|для себя|только я/.test(t)) { g.total = 1; g.stated = true; }
    }

    if (g.children === null && g.childAges.length) g.children = g.childAges.length;
    if (/(?:^|[\s,]|и )ребен(?:ок|ка|очек)/.test(t) && !g.children) { g.children = 1; g.stated = true; }
    if (g.adults !== null && g.children) {          // «двое взрослых и ребёнок» — сумма важнее «нас двое»
      var sum = g.adults + g.children;
      if (g.total === null || g.total < sum) g.total = sum;
    }
    if (g.total === null && (g.adults || g.children)) g.total = (g.adults || 0) + (g.children || 0);
    if (g.total !== null && g.adults === null) g.adults = Math.max(0, g.total - (g.children || 0));
    if (g.total !== null && g.children === null) g.children = 0;
    if (g.total > 20) g.total = null;                  // явно не про гостей
    return g;
  }

  /* ---------- бюджет ---------- */

  function parseBudget(t) {
    var b = { amount: null, per: null, currency: null, assumed: [] };
    var m = new RegExp('(?:до|не (?:более|дороже|больше)|бюджет[а-яa-z]*|в пределах|максимум|макс(?![а-яa-z])|около|порядка|за)\\s*(\\d[\\d\\s]{0,11})\\s*(к(?![а-яa-z])|тыс[а-яa-z]*|млн|000)?\\s*(сум[а-яa-z]*|сом[а-яa-z]*|руб[а-яa-z]*|\\$|долл[а-яa-z]*|usd|у\\.?е\\.?)?').exec(t);
    if (!m) m = /(\$\s?\d[\d\s]{0,6}|\d[\d\s]{0,6}\s?\$)/.exec(t);
    if (!m) return b;

    /* «до 3 января», «до 12 числа», «до 5 ночей» — это срок, а не деньги */
    var tail = t.slice((m.index || 0) + m[0].length, (m.index || 0) + m[0].length + 12);
    if (new RegExp('^\\s*(?:' + MONTHS.concat(MONTHS_EN).join('|') + '|числ|ноч|сут|дн|человек|гост|лет)').test(tail)) return b;

    var raw = (m[1] || m[0]).replace(/[^\d]/g, '');
    if (!raw) return b;
    var amount = parseInt(raw, 10);
    var mult = m[2] || '';
    if (/^к|тыс/.test(mult)) amount *= 1000;
    if (/млн/.test(mult)) amount *= 1000000;

    var cur = (m[3] || m[0] || '').toString();
    if (/\$|долл|usd|у\.?е/.test(cur)) { b.currency = 'USD'; b.assumed.push('бюджет в долларах, пересчитаем по курсу'); }
    else if (/сом/.test(cur)) b.currency = 'KGS';
    else if (/руб/.test(cur)) b.currency = 'RUB';
    else if (/сум/.test(cur)) b.currency = 'UZS';
    else b.currency = null;                     // валюта не названа — значит местная

    /* Без валюты и без «тысяч/к/млн» маленькое число — это не бюджет, а что-то другое */
    if (!m[3] && !mult && amount < 1000) return { amount: null, per: null, currency: null, assumed: [] };
    if (!b.currency && amount < 1000) { amount *= 1000; b.assumed.push('сумму меньше тысячи прочитали как тысячи'); }
    b.amount = amount;

    if (/(за|в)\s*(ночь|сутк|день)|ночь|сутк/.test(t)) b.per = 'night';
    else if (/за вс[её]|всего|на весь срок|итого/.test(t)) b.per = 'total';
    else { b.per = 'night'; b.assumed.push('считаем, что бюджет за ночь'); }
    return b;
  }

  /* ---------- требования и предпочтения ---------- */

  function parsePrefs(t) {
    var p = { rooms: null, district: null, features: [], needElevator: false, needParking: false, needCrib: false, needWorkspace: false, quiet: false };
    var m = /(\d)\s*-?\s*комн/.exec(t);
    if (m) p.rooms = +m[1];
    else if (/студи/.test(t)) p.rooms = 0;
    else if (/однушк|одноком/.test(t)) p.rooms = 1;
    else if (/двушк|двухком/.test(t)) p.rooms = 2;
    else if (/трешк|трехком/.test(t)) p.rooms = 3;

    var districts = [
      ['центр', /центр|амира темура|мустакиллик|сквер/],
      ['юнусабад', /юнусабад/],
      ['мирабад', /мирабад|ойбек|ташкент-сити|ташкент сити/],
      ['чиланзар', /чиланзар|новза/],
      ['сергели', /сергели/],
      ['вокзал', /вокзал/]
    ];
    districts.forEach(function (d) { if (!p.district && d[1].test(t)) p.district = d[0]; });

    if (/лифт/.test(t)) p.needElevator = true;
    if (/коляск|инвалид|не могу по лестниц|ходунк|костыл/.test(t)) { p.needElevator = true; p.accessible = true; }
    if (/парковк|машин|авто\b|на машине/.test(t)) p.needParking = true;
    if (/кроватк|манеж|стульчик для кормлен/.test(t)) p.needCrib = true;
    if (/рабоч[а-яa-z]* мест|поработать|ноутбук|созвон|зум|zoom/.test(t)) p.needWorkspace = true;
    if (/тих|без шума|выспаться/.test(t)) p.quiet = true;

    [['wi-fi', /wi-?fi|вайфай|интернет/], ['стиральная машина', /стиральн|постирать/],
     ['посудомойка', /посудомой/], ['кондиционер', /кондиционер|сплит|жарко/],
     ['две ванные', /две ванн|два санузл/], ['проектор', /проектор/],
     ['балкон', /балкон/], ['вид', /вид из окна|панорам|вид на/]].forEach(function (f) {
      if (f[1].test(t)) p.features.push(f[0]);
    });
    return p;
  }

  /* ---------- сигналы: что именно человек просит и о чём предупреждает ---------- */

  var SIGNALS = {

    price:          /цен[аыу]|сколько стоит|стоимость|почем|тариф|прайс|за сутки сколько|сколько за ночь/,
    otherDates:     /на другие даты|другие даты|а когда (?:свободно|есть|будет)|когда освобод|ближайш\w* свободн|любые даты подойдут/,
    /* Что рядом с домом: у каждой темы свой ключ в базе знаний */

    cityInfo:       /как добраться|аэропорт|вокзал|такси|автобус|транспорт|что посмотреть|достопримечат|обмен[а-я]* валют|валюту|курс валют|поменять деньги|доставк[а-я]* еды|заказать еду|погод|скорая|полиц|метро/,
    availability:   /свободн|есть ли|наличие|доступн|занят|остал(о|и)сь|можно ли заселиться|есть что-нибудь/,
    book:           /заброн[а-яa-z]*|бронь|забронируй|беру|берем|оформ[а-яa-z]*|подтвержд[а-яa-z]*|давайте|согласен|согласна|хочу эту|подходит/,
    photos:         /фото|фотк|снимк|видео|как выглядит|посмотреть квартиру/,
    address:        /адрес|где находится|как добраться|геолокац|локац|куда ехать|точка на карте/,
    checkinTime:    /во сколько (?:заезд|выезд|заселение)|время заезда|время выезда|когда можно заселиться|до скольки выезд/,
    earlyCheckIn:   /можно (?:ли )?(?:заехать )?(?:по)?раньше|заезд пораньше|ранн[а-яa-z]* заезд|заехать раньше|заселиться в \d{1,2}[:.]?\d{0,2}\s*(утра)?|заезд в \d{1,2}\s*утра|приедем утром|прилет утром/,
    lateCheckOut:   /попозже (?:выехать|съехать)|выехать попозже|поздн[а-яa-z]* выезд|выехать позже|выезд в \d{1,2}|попозже съехать|вылет вечером/,
    lateArrival:    /приед[а-я]* (?:в|около) 2[0-3][:.]\d{2}|заезд в 2[0-3][:.]\d{2}|в 23[:.]\d{2}|в 00[:.]\d{2}|поздно вечером|поздно приедем|ночью приедем|заезд ночью|в 2 ночи|в 3 ночи|поезд ночью|рейс ночью|прилет в \d{1,2} ночи/,
    extend:         /продлить|продлеваем|остаться ещ?е|еще на [\dа-я]+ ?(ноч|сут|дн)/,
    changeDates:    /перенес|сдвин|на неделю (?:позже|раньше)|поменять даты|изменить даты|другие даты вместо/,
    cancel:         /отмен[а-яa-z]*|не приедем|отказыва[а-яa-z]*|верните деньги|возврат/,

    /* ===== 3. Изменения брони ===== */
    {
      id: 'cancel', title: 'Отмена брони', group: 'изменения',

      build: function (a) {

        }
        var r = PO.refund(b.from, b.paid || (b.status === 'оплачено' ? b.prepay : 0));
        if (!r.sum) {
          return { action: 'confirm', reason: 'отмена без внесённых денег',
            reply: R.lines([
              'Бронь ' + U.range(b.from, b.to) + ' снял, возвращать нечего — предоплата не вносилась.',
              'Если соберётесь снова, напишите: подберу по наличию на тот момент.'
            ]),
            internal: 'Отмена удержания без оплаты, деньги не двигаем.' };
        }
        return { action: 'confirm', reason: 'отмена по правилам',

            'Бронь ' + U.range(b.from, b.to) + ' отменяю.',
            'До заезда ' + U.plural(r.days, 'остался', 'осталось', 'осталось') + ' ' + r.days + ' ' + U.plural(r.days, 'день', 'дня', 'дней') + ', поэтому ' + r.note + ': ' + U.money(r.sum) + ' вернём на карту оплаты за 1–3 рабочих дня.',
            'Если планы сдвинулись, а не отменились — могу перенести даты без потери предоплаты.'
          ]),
          internal: 'Возврат ' + U.money(r.sum) + ' из ' + U.money(b.prepay) + '. Освободить календарь.' };
      }
    },
    {
      id: 'change-dates', title: 'Перенос дат', group: 'изменения',
      when: function (a) { return a.signals.changeDates; },
      build: function (a) {
        var b = a.ctx.booking;
        if (!a.dates.from) {
          return { action: 'ask', reason: 'нет новых дат',

        }
        if (b) {
          var obj = KB.byId(b.objectId), nights = a.dates.nights || U.diffDays(b.from, b.to);
          var to = a.dates.to || U.addDays(a.dates.from, nights);
          var free = PO.isFree(obj, a.dates.from, to);
          if (free.free) {
            var q = PO.quote(obj, { from: a.dates.from, to: to, guests: b.guests });
            var diff = q.total - (b.total || 0);
            return { action: 'confirm', reason: 'новые даты свободны',
              reply: R.lines([
                obj.title + ' на ' + U.range(a.dates.from, to) + ' свободна — переношу.',

                'Предоплата переходит на новые даты.'
              ]) };

              'На ' + U.range(a.dates.from, to) + ' эта квартира занята.',

              'Либо перенесу в другую квартиру на ваши даты — скажите, что удобнее.'
            ]) };
        }
        return { action: 'ask', reason: 'нет исходной брони',

    {

      build: function (a) {
        var nights = a.dates.nights || 30;

      out.push(block('Допущения и пробелы',
        (notes.length ? '<div class="list">' + notes.map(function (n) { return '<div>' + esc(n) + '</div>'; }).join('') + '</div>' : '') +
        (a.missing.length ? '<div class="kv"><span>Не хватает</span><span>' + esc(a.missing.join(', ')) + '</span></div>' : '')));
    }

    var lvl = a.risk.score >= 45 ? 'bad' : a.risk.score >= 20 ? 'warn' : '';
    out.push(block('Риск',
      '<div class="bar ' + lvl + '"><i style="width:' + a.risk.score + '%"></i></div>' +
      kv('Оценка', a.risk.score + ' из 100 — ' + a.risk.level) +
      (a.risk.flags.length
        ? '<div class="list">' + a.risk.flags.map(function (f) {
            return '<div>' + esc(f.why) + ' → ' + esc(f.action) + '</div>'; }).join('') + '</div>'
        : '<div class="empty">Флагов нет</div>')));

    if (a.match && (a.match.offers.length || a.match.rejected.length)) {
      out.push(block('Подбор по календарю',
        (a.match.offers.length
          ? '<div class="list">' + a.match.offers.slice(0, 3).map(function (o) {
              return '<div>' + esc(o.object.title) + ' — ' + U.money(o.quote.perNight) + '/ночь, итого ' +
                     U.money(o.quote.total) + ' (оценка ' + o.score + ')</div>'; }).join('') + '</div>'
          : '<div class="empty">Свободных под запрос нет</div>') +
        (a.match.rejected.length
          ? '<h3 style="margin-top:12px">Почему отпали</h3><div class="list">' +
            a.match.rejected.map(function (r2) {
              return '<div>' + esc(r2.object.title) + ' — ' + esc(r2.reasons.join('; ')) + '</div>'; }).join('') + '</div>'
          : '')));
    }

    if (res.candidates.length > 1) {
      out.push(block('Сработавшие сценарии',
        '<div class="tagline">' + res.candidates.map(function (c) {
          return '<span>' + esc(c.id) + '</span>'; }).join('') + '</div>'));
    }

    if (res.internal) out.push(block('Заметка менеджеру', '<div class="reason">' + esc(res.internal) + '</div>'));

    out.push(block('Заявка для CRM', '<pre class="json">' + esc(JSON.stringify(res.crm, null, 2)) + '</pre>'));

    insight.innerHTML = out.join('');
    insight.scrollTop = 0;
  }

  /* ---------- обработка сообщения ---------- */

  function handle(text) {
    bubble('guest', text);
    history.push({ role: 'user', text: text });

    var res = AGENT.respond(text, ctx);
    render(res);

    if (mode === 'claude' && API.ready()) {
      var t = typing();
      API.ask(text, res, history).then(function (out) {
        t.remove();
        bubble('agent', out.reply, 'Claude · сценарий: ' + res.scenario + (out.usage ? ' · ' + (out.usage.input_tokens + out.usage.output_tokens) + ' токенов' : ''));
        history.push({ role: 'assistant', text: out.reply });
        if (out.note) {
          var blocks = insight.querySelectorAll('.block');
          var el = d.createElement('div');
          el.className = 'block';
          el.innerHTML = '<h3>Заметка модели</h3><div class="reason">' + esc(out.note) + '</div>';
          insight.insertBefore(el, blocks[blocks.length - 1]);
        }
      }).catch(function (e) {
        t.remove();
        bubble('sys', 'Claude недоступен: ' + e.message + '. Показываю ответ движка.');
        bubble('agent', res.reply, 'сценарий: ' + res.scenario);
        history.push({ role: 'assistant', text: res.reply });
      });
      return;
    }

    setTimeout(function () {
      bubble('agent', res.reply, 'сценарий: ' + res.scenario + ' · решение: ' + badgeFor(res.action)[1]);
      history.push({ role: 'assistant', text: res.reply });
    }, 160);
  }

  /* ---------- события ---------- */

  send.onclick = function () {
    var v = input.value.trim();
    if (!v) return;
    input.value = '';
    input.style.height = 'auto';
    handle(v);
  };

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send.click(); }
  });
  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(140, input.scrollHeight) + 'px';
  });

  function applyView() {
    d.body.classList.toggle('guest', guestView);
    var seg = d.getElementById('view');
    [].forEach.call(seg.children, function (b) {
      b.classList.toggle('on', (b.dataset.view === 'guest') === guestView);
    });
  }

  d.getElementById('view').onclick = function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    guestView = btn.dataset.view === 'guest';
    applyView();
  };

  d.getElementById('mode').onclick = function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    mode = btn.dataset.mode;
    [].forEach.call(this.children, function (b) { b.classList.toggle('on', b === btn); });
    if (mode === 'claude' && !API.ready()) modal.classList.add('on');
  };

  d.getElementById('tabs').onclick = function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    [].forEach.call(this.children, function (b) { b.classList.toggle('on', b === btn); });
    d.getElementById('pane-chat').classList.toggle('off', btn.dataset.tab !== 'chat');
    d.getElementById('pane-insight').classList.toggle('off', btn.dataset.tab !== 'insight');
  };

  d.getElementById('reset').onclick = function () {
    ctx = AGENT.newContext({ channel: 'демо' });
    history = [];
    chat.innerHTML = '';
    insight.innerHTML = '<div class="block"><h3>Разбор запроса</h3><div class="empty">Новый диалог. Слоты и бронь очищены.</div></div>';
    hello();
  };

  d.getElementById('settings').onclick = function () { modal.classList.add('on'); };
  d.getElementById('cancel').onclick = function () { modal.classList.remove('on'); };
  d.getElementById('save').onclick = function () {
    API.save({ key: d.getElementById('key').value.trim(), model: d.getElementById('model').value });
    modal.classList.remove('on');
    bubble('sys', API.ready() ? 'Ключ сохранён. Режим «Движок + Claude» готов.' : 'Ключ очищен.');
  };

  /* ---------- старт ---------- */

  /* Свой фонд обычно подставляют выгрузкой — сразу показываем, если она битая */
  function checkCalendar() {
    var problems = KB.validate();
    if (!problems.length) return;
    bubble('sys', 'В календаре ' + problems.length + ' проблем(ы) — такие квартиры могут продаться дважды:\n' +
      problems.slice(0, 5).join('\n'));
  }

  function hello() {
    if (!guestView) {
      bubble('sys', 'Демо: слева вы пишете как гость, справа видно, что агент понял и почему так ответил. Кнопка «Как видит гость» убирает разбор.');
    }
    bubble('agent', 'Здравствуйте! ' + KB.settings.brand + ' — ' + KB.settings.business + ' в ' + KB.settings.cityIn + '.\nНапишите даты и сколько гостей — подберу варианты с ценами.', 'сценарий: greeting');
  }

  (function init() {
    var chips = d.getElementById('chips');
    SAMPLES.forEach(function (s) {
      var b = d.createElement('button');
      b.textContent = s.length > 42 ? s.slice(0, 40) + '…' : s;
      b.title = s;
      b.onclick = function () { handle(s); };
      chips.appendChild(b);
    });

    var sel = d.getElementById('model');
    API.MODELS.forEach(function (m) {
      var o = d.createElement('option');
      o.value = m.id; o.textContent = m.title;
      sel.appendChild(o);
    });
    var cfg = API.load();
    if (cfg.key) d.getElementById('key').value = cfg.key;
    if (cfg.model) sel.value = cfg.model;

    applyView();
    hello();
    if (!guestView) checkCalendar();
  })();

})(window, document);

</script>
</body>
</html>
