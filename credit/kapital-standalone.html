<style>
/* ============================================================
   Каптал — учёт займов под проценты
   iOS-first PWA. Без внешних зависимостей.
   ============================================================ */

:root{
  --green:#28a745;  --green-d:#1e7e34;
  --red:#e5484d;    --orange:#f5a524;
  --blue:#0a84ff;   --violet:#7c5cff;

  --radius:16px;
  --radius-sm:11px;
  --tap:44px;

  --ease:cubic-bezier(.32,.72,0,1);
  --safe-b:env(safe-area-inset-b, 0px);
}

/* ---------- тема: светлая (по умолчанию) ---------- */
:root,
html[data-theme="light"]{
  --bg:#f2f2f7;
  --bg-elev:#ffffff;
  --bg-sunken:#e9e9ee;
  --fill:rgba(120,120,128,.12);
  --fill-2:rgba(120,120,128,.08);
  --text:#000000;
  --text-2:rgba(60,60,67,.6);
  --text-3:rgba(60,60,67,.35);
  --line:rgba(60,60,67,.13);
  --bar:rgba(249,249,251,.82);
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.05);
  --accent:#12a150;
  --accent-soft:rgba(18,161,80,.12);
  --danger-soft:rgba(229,72,77,.12);
  --warn-soft:rgba(245,165,36,.15);
  color-scheme:light;
}

/* ---------- тема: тёмная ---------- */
@media (prefers-color-scheme:dark){
  html:not([data-theme="light"]){
    --bg:#000000;
    --bg-elev:#1c1c1e;
    --bg-sunken:#0b0b0d;
    --fill:rgba(120,120,128,.24);
    --fill-2:rgba(120,120,128,.16);
    --text:#ffffff;
    --text-2:rgba(235,235,245,.6);
    --text-3:rgba(235,235,245,.3);
    --line:rgba(84,84,88,.5);
    --bar:rgba(22,22,24,.8);
    --shadow:none;
    --accent:#30d158;
    --accent-soft:rgba(48,209,88,.16);
    --danger-soft:rgba(255,69,58,.18);
    --warn-soft:rgba(255,159,10,.2);
    --red:#ff453a; --orange:#ff9f0a; --blue:#0a84ff; --violet:#9a7cff;
    color-scheme:dark;
  }
}
html[data-theme="dark"]{
  --bg:#000000;
  --bg-elev:#1c1c1e;
  --bg-sunken:#0b0b0d;
  --fill:rgba(120,120,128,.24);
  --fill-2:rgba(120,120,128,.16);
  --text:#ffffff;
  --text-2:rgba(235,235,245,.6);
  --text-3:rgba(235,235,245,.3);
  --line:rgba(84,84,88,.5);
  --bar:rgba(22,22,24,.8);
  --shadow:none;
  --accent:#30d158;
  --accent-soft:rgba(48,209,88,.16);
  --danger-soft:rgba(255,69,58,.18);
  --warn-soft:rgba(255,159,10,.2);
  --red:#ff453a; --orange:#ff9f0a; --blue:#0a84ff; --violet:#9a7cff;
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font:400 17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;
}
body.no-scroll{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:17px;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;color:var(--accent)}
input,textarea,select{-webkit-appearance:none;appearance:none}
a{color:var(--accent);text-decoration:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- каркас ---------- */
#screen{
  min-height:100%;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
.wrap{padding:0 16px;max-width:640px;margin:0 auto}

.topbar{
  position:sticky;top:0;z-index:40;
  height:calc(48px + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:8px;
  padding-left:8px;padding-right:8px;
  background:transparent;
  transition:background .2s linear;
}
.topbar.solid{
  background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--line);
}
.topbar .tb-title{
  flex:1;text-align:center;font-size:17px;font-weight:600;
  opacity:0;transition:opacity .2s linear;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar.solid .tb-title{opacity:1}
.tb-btn{
  min-width:var(--tap);height:var(--tap);display:flex;align-items:center;
  justify-content:center;gap:3px;font-size:17px;color:var(--accent);
}
.tb-btn.right{justify-content:flex-end;padding-right:8px}
.tb-btn:active{opacity:.4}

h1.big{
  font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.6px;
  margin:2px 0 14px;
}
h2.sec{
  font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;
  color:var(--text-2);margin:26px 4px 8px;
}
h2.sec .act{float:right;text-transform:none;letter-spacing:0;color:var(--accent);font-weight:400}

/* ---------- карточки / списки ---------- */
.card{
  background:var(--bg-elev);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.card + .card{margin-top:12px}
.pad{padding:16px}

.list{background:var(--bg-elev);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.row{
  display:flex;align-items:center;gap:12px;
  min-height:52px;padding:11px 14px;position:relative;
  color:inherit;width:100%;text-align:left;background:none;font-size:17px;
}
.row + .row::before{
  content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line);
}
.row.tap:active{background:var(--fill-2)}
.row .grow{flex:1;min-width:0;display:block}
.row .chev{color:var(--text-3);font-size:15px;flex:none}
.row .ttl{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{display:block;font-size:13px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{text-align:right;flex:none;display:block;max-width:42%}
.row .val .v1{display:block;font-size:17px;font-weight:600;white-space:nowrap}
.row .val .v2{display:block;font-size:12px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.avatar{
  width:38px;height:38px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:#fff;letter-spacing:.2px;
}

/* ---------- сводка ---------- */
.hero{
  background:var(--bg-elev);border-radius:20px;padding:18px 18px 16px;
  box-shadow:var(--shadow);
}
.hero .lbl{font-size:13px;color:var(--text-2)}
.hero .amt{font-size:clamp(26px,8.6vw,38px);font-weight:700;letter-spacing:-1px;line-height:1.1;margin-top:3px;overflow-wrap:anywhere}
.hero .delta{font-size:13px;color:var(--text-2);margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--bg-elev);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:5px}
.stat .v{font-size:clamp(16px,5vw,21px);font-weight:650;letter-spacing:-.3px;margin-top:4px;overflow-wrap:anywhere}
.stat .v.sm{font-size:18px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

/* ---------- бейджи / чипы ---------- */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;font-weight:600;padding:3px 8px;border-radius:100px;
  background:var(--fill);color:var(--text-2);white-space:nowrap;
}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.badge.bad{background:var(--danger-soft);color:var(--red)}
.badge.warn{background:var(--warn-soft);color:var(--orange)}

.seg{
  display:flex;background:var(--fill-2);border-radius:9px;padding:2px;gap:2px;margin:0 0 14px;
}
.seg button{
  flex:1;min-height:32px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text);
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.seg button.on{background:var(--bg-elev);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.seg .cnt{font-size:11px;color:var(--text-2)}
.seg button.on .cnt{color:var(--text-2)}

/* ---------- кнопки ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;border-radius:14px;font-size:17px;font-weight:600;
  background:var(--accent);color:#fff;width:100%;padding:0 14px;white-space:nowrap;
  transition:transform .12s var(--ease),opacity .12s;
}
.btn:active{transform:scale(.975);opacity:.9}
.btn.sec{background:var(--fill);color:var(--text)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--danger-soft);color:var(--red)}
.btn.sm{min-height:40px;font-size:15px;border-radius:11px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{font-size:16px}
.btn-row .btn{flex:1}

.fab{
  position:fixed;right:16px;z-index:45;
  bottom:calc(74px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:300;line-height:1;
  box-shadow:0 6px 20px rgba(0,0,0,.28);
  transition:transform .15s var(--ease);
}
.fab:active{transform:scale(.9)}

/* ---------- таббар ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);
}
.tabbar a{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;height:52px;color:var(--text-3);font-size:10px;font-weight:500;
}
.tabbar a.on{color:var(--accent)}
.tabbar a:active{opacity:.55}
.tabbar svg{width:25px;height:25px;display:block}

/* ---------- формы ---------- */
.field{
  display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;
  position:relative;background:var(--bg-elev);
}
.field + .field::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line)}
.field label{font-size:17px;flex:none;min-width:104px;color:var(--text)}
.field input,.field select,.field textarea{
  flex:1;min-width:0;border:0;background:transparent;outline:none;
  padding:10px 0;font-size:17px;text-align:right;
}
.field.col{flex-direction:column;align-items:stretch;gap:0;padding:10px 14px}
.field.col label{font-size:13px;color:var(--text-2);margin-bottom:2px}
.field.col input,.field.col textarea{text-align:left;padding:4px 0}
.field textarea{resize:none;min-height:60px;line-height:1.35}
.field select{
  text-align:right;color:var(--text);padding-right:17px;
  background:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 16'%3E%3Cpath d='M2 6l3-3 3 3M2 10l3 3 3-3' fill='none' stroke='%23999' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right center/9px 15px;
}
.field .unit{color:var(--text-2);font-size:15px;flex:none}
.field input::placeholder,.field textarea::placeholder{color:var(--text-3)}
.hint{font-size:12.5px;color:var(--text-2);padding:8px 6px 0;line-height:1.4}
.hint b{color:var(--text);font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;background:var(--bg-elev)}
.chip{
  padding:7px 13px;border-radius:100px;background:var(--fill-2);
  font-size:14px;color:var(--text);border:1.5px solid transparent;
}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip:active{opacity:.6}

.search{
  display:flex;align-items:center;gap:7px;background:var(--fill-2);
  border-radius:10px;padding:0 10px;height:38px;margin-bottom:14px;
}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:17px;min-width:0}
.search svg{width:16px;height:16px;color:var(--text-3);flex:none}

/* ---------- модальный лист ---------- */
.sheet-bg{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.42);
  opacity:0;transition:opacity .3s var(--ease);
  -webkit-backdrop-filter:blur(1px);backdrop-filter:blur(1px);
}
.sheet-bg.in{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  max-height:92vh;display:flex;flex-direction:column;
  background:var(--bg);border-radius:14px 14px 0 0;
  transform:translateY(100%);transition:transform .34s var(--ease);
  padding-bottom:env(safe-area-inset-bottom);
  max-width:640px;margin:0 auto;
  box-shadow:0 -8px 40px rgba(0,0,0,.3);
}
.sheet.in{transform:translateY(0)}
.sheet-hd{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-bottom:.5px solid var(--line);flex:none;
}
.sheet-hd .t{font-size:17px;font-weight:600;flex:1;text-align:center}
.sheet-hd button{font-size:17px;min-width:64px}
.sheet-hd button.strong{font-weight:600;text-align:right}
.sheet-bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;flex:1}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:7px auto 0;flex:none}

/* ---------- всплывающее уведомление ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);z-index:90;
  background:rgba(30,30,32,.95);color:#fff;font-size:14.5px;font-weight:500;
  padding:11px 18px;border-radius:100px;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
#toast.in{opacity:1;transform:translate(-50%,0)}

/* ---------- служебное ---------- */
.empty{text-align:center;padding:46px 26px;color:var(--text-2)}
.empty .ic{font-size:44px;margin-bottom:10px;opacity:.5}
.empty .t{font-size:17px;font-weight:600;color:var(--text);margin-bottom:5px}
.empty .d{font-size:14px;line-height:1.45}

.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .4s var(--ease)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:15px}
.kv + .kv{border-top:.5px solid var(--line)}
.kv .k{color:var(--text-2)}
.kv .v{font-weight:600;text-align:right;overflow-wrap:anywhere}
.kv.big .v{font-size:19px}

.tl{position:relative;padding-left:22px}
.tl .ev{position:relative;padding:9px 0}
.tl .ev + .ev{border-top:.5px solid var(--line)}
.tl .ev::before{
  content:"";position:absolute;left:-18px;top:16px;width:9px;height:9px;
  border-radius:50%;background:var(--accent);
}
.tl::before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:1.5px;background:var(--line)}

.lock{
  position:fixed;inset:0;z-index:100;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
}
.pin-dots{display:flex;gap:16px}
.pin-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--text-2)}
.pin-dots i.on{background:var(--text);border-color:var(--text)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:18px;justify-content:center}
.keypad button{
  width:72px;height:72px;border-radius:50%;background:var(--fill-2);
  font-size:28px;font-weight:400;color:var(--text);
  display:flex;align-items:center;justify-content:center;
}
.keypad button:active{background:var(--fill)}
.keypad button.blank{background:none;pointer-events:none}
.shake{animation:shake .4s}
@keyframes shake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
}
.fade{animation:fade .22s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

/* ---------- диалог подтверждения ---------- */
.ask-bg{
  position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;padding:28px;
  opacity:0;transition:opacity .2s ease;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.ask-bg.in{opacity:1}
.ask{
  width:100%;max-width:290px;background:var(--bg-elev);border-radius:15px;
  overflow:hidden;text-align:center;
  transform:scale(.92);transition:transform .22s var(--ease);
  box-shadow:0 12px 44px rgba(0,0,0,.3);
}
.ask-bg.in .ask{transform:scale(1)}
.ask .ask-t{font-size:17px;font-weight:600;padding:20px 18px 0}
.ask .ask-d{font-size:13.5px;color:var(--text-2);line-height:1.4;padding:6px 18px 18px}
.ask .ask-btns{display:flex;border-top:.5px solid var(--line)}
.ask .ask-btns button{
  flex:1;min-height:46px;font-size:17px;color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.ask .ask-btns button + button{border-left:.5px solid var(--line)}
.ask .ask-btns button.danger{color:var(--red);font-weight:600}
.ask .ask-btns button:active{background:var(--fill-2)}
</style>

<script>
/* Утилиты: форматирование, даты, DOM-хелперы */
(function (w) {
  'use strict';

  var U = {};

  /* ---------- id ---------- */
  U.uid = function () {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  };

  /* ---------- экранирование ---------- */
  U.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };

  /* ---------- числа и деньги ---------- */
  U.num = function (v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    var s = String(v == null ? '' : v).replace(/\s| /g, '').replace(',', '.').replace(/[^\d.\-]/g, '');
    var n = parseFloat(s);
    return isFinite(n) ? n : 0;
  };

  var nf0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
  var nf2 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  /* U.money(1000) — в базовой валюте
     U.money(1000, 'USD') — в указанной
     U.money(1000, {cur:'USD', exact:true, noCur:true})                */
  U.money = function (v, opt) {
    if (typeof opt === 'string') opt = { cur: opt };
    opt = opt || {};
    var code = opt.cur || (w.FX ? FX.base() : 'UZS');
    var info = w.FX ? FX.byCode(code) : { sym: '', dec: 0 };
    var n = U.num(v), sign = n < 0 ? '−' : '', abs = Math.abs(n);
    var frac = opt.exact || (info.dec === 2 && abs > 0 && abs < 1000 && Math.round(abs) !== abs);
    var body = frac ? nf2.format(abs) : nf0.format(Math.round(abs));

/* Валюты и курсы.
   Курсы хранятся как «сколько единиц валюты за 1 доллар».
   Пока курс не задан — приложение не выдумывает его, а считает

(function (w) {
  'use strict';

  var FX = {};

  FX.LIST = [
    { code: 'UZS', sym: 'сум', name: 'Узбекский сум', dec: 0, step: 1000 },
    { code: 'KGS', sym: 'сом', name: 'Киргизский сом', dec: 0, step: 100 },
    { code: 'USD', sym: '$', name: 'Доллар США', dec: 2, step: 100 },
    { code: 'RUB', sym: '₽', name: 'Российский рубль', dec: 0, step: 1000 },
    { code: 'KZT', sym: '₸', name: 'Казахский тенге', dec: 0, step: 1000 },
    { code: 'EUR', sym: '€', name: 'Евро', dec: 2, step: 100 }
  ];

  FX.byCode = function (c) {
    for (var i = 0; i < FX.LIST.length; i++) if (FX.LIST[i].code === c) return FX.LIST[i];
    return FX.LIST[0];
  };
  FX.sym = function (c) { return FX.byCode(c).sym; };
  FX.base = function () { return (DB.data && DB.data.settings.currency) || 'UZS'; };

  /* старые записи хранили символ валюты — переводим в код */
  FX.fromSymbol = function (s) {
    var map = { '₽': 'RUB', '$': 'USD', '€': 'EUR', '₸': 'KZT', 'сум': 'UZS', 'сом': 'KGS', '₴': 'UAH', '£': 'GBP' };
    if (map[s]) return map[s];
    for (var i = 0; i < FX.LIST.length; i++) if (FX.LIST[i].code === s) return s;
    return 'UZS';
  };

  /* ---------- пересчёт ---------- */
  FX.rate = function (code) {
    var r = DB.data.settings.rates || {};
    if (code === 'USD') return 1;
    return U.num(r[code]) || 0;
  };
  FX.can = function (from, to) {
    if (from === to) return true;
    return FX.rate(from) > 0 && FX.rate(to) > 0;
  };
  FX.conv = function (amount, from, to) {
    if (from === to) return amount;
    var a = FX.rate(from), b = FX.rate(to);
    if (!a || !b) return null;
    return amount / a * b;
  };

  /* Собрать суммы по валютам в базовую, если это возможно.
     Возвращает {ok:true, value} либо {ok:false, parts:{код:сумма}}      */
  FX.total = function (parts, to) {
    to = to || FX.base();
    var sum = 0, ok = true, left = {};
    for (var c in parts) {

      var v = FX.conv(parts[c], c, to);

        var arr = JSON.parse(text);
        if (!Array.isArray(arr) || !arr.length) throw new Error('пустой ответ');
        var perUzs = {}, date = null;                 // сумов за 1 единицу валюты
        arr.forEach(function (x) {
          var code = x.Ccy || x.ccy, val = U.num(String(x.Rate || x.rate).replace(',', '.'));
          var nom = U.num(x.Nominal || x.nominal) || 1;
          if (code && val) perUzs[code] = val / nom;
          if (!date && (x.Date || x.date)) date = String(x.Date || x.date);
        });
        if (!perUzs.USD) throw new Error('нет курса доллара');
        var out = { USD: 1, UZS: perUzs.USD };        // сумов за доллар
        FX.LIST.forEach(function (c) {
          if (c.code === 'USD' || c.code === 'UZS') return;
          if (perUzs[c.code]) out[c.code] = perUzs.USD / perUzs[c.code];

    nbkr: {
      name: 'Нацбанк Кыргызстана',

        if (!nodes.length) throw new Error('пустой ответ');
        var perKgs = {};                               // сомов за 1 единицу
        for (var i = 0; i < nodes.length; i++) {

          var nEl = nodes[i].getElementsByTagName('Nominal')[0];

  FX.update = function (pref, cb) {

      if (i >= order.length) { cb(null, 'Не удалось получить курс ни из одного источника'); return; }

})(window);

  /* ============ общие кусочки ============ */
  V.avatar = function (name) {
    return '<div class="avatar" style="background:' + U.color(name) + '">' + esc(U.initials(name)) + '</div>';
  };

  /* Итог, который может не сводиться в базовую валюту */
  V.sum = function (value, bag) {
    if (value != null) return U.money(value);
    var parts = [];
    for (var c in bag) if (bag[c]) parts.push(U.money(bag[c], c));
    return parts.length ? parts.join(' + ') : U.money(0);
  };
  V.hasMoney = function (value, bag) {
    if (value != null) return value > 0.5;
    for (var c in bag) if (bag[c] > 0.5) return true;
    return false;
  };

  V.badge = function (l, r) {
    if (r.isClosed) return '<span class="badge">Закрыт</span>';
    if (r.isPaidOff) return '<span class="badge ok">Погашен</span>';
    if (r.missed) return '<span class="badge bad">Не заплатил ' + r.missed + ' ' +
      U.plural(r.missed, 'месяц', 'месяца', 'месяцев') + '</span>';
    if (r.isOverdue) return '<span class="badge bad">Просрочка ' + U.days(r.overdueDays) + '</span>';
    if (r.nextPay && U.diffDays(U.today(), r.nextPay.date) <= 3)
      return '<span class="badge warn">Проценты ' + U.relDate(r.nextPay.date) + '</span>';
    if (r.daysLeft != null && r.daysLeft <= 3) return '<span class="badge warn">Возврат ' + U.relDate(l.dueAt) + '</span>';
    return '';
  };

  V.rateText = function (l, r) {
    if (l.model === 'fixed') return 'фикс. возврат ' + U.money(l.returnAmount, l.currency);
    var txt = U.pct(l.rate) + CALC.PERIOD_SHORT[l.ratePeriod];
    if (l.payMode === 'monthly') {
      var bal = r ? r.balance : U.num(l.principal);
      txt += ' · ' + U.money(CALC.perMonth(l, bal), l.currency) + '/мес';
    }
    return txt;
  };

  V.loanRow = function (l) {
    var c = DB.client(l.clientId) || { name: 'Без клиента' };
    var r = CALC.loan(l);
    var b = V.badge(l, r);
    var meta = V.rateText(l, r);
    var v2 = r.isClosed ? 'закрыт'
      : r.nextPay ? 'платёж ' + U.fmtDate(r.nextPay.date)
        : l.dueAt ? 'до ' + U.fmtDate(l.dueAt) : 'без срока';
    return '<button class="row tap" data-act="loan" data-id="' + l.id + '">' +
      V.avatar(c.name) +
      '<span class="grow"><span class="ttl">' + esc(c.name) + '</span>' +
      '<span class="sub">' + (b ? b + ' ' : '') + esc(meta) + '</span></span>' +
      '<span class="val"><span class="v1 num">' + U.money(r.isClosed ? r.principal : r.totalDue, l.currency) + '</span>' +
      '<span class="v2">' + v2 + '</span></span>' +
      '<span class="chev">' + V.ICON.chev + '</span></button>';
  };

  V.clientRow = function (c) {
    var loans = DB.loansOf(c.id);
    var p = CALC.portfolio(loans);
    var active = loans.filter(function (l) { return l.status !== 'closed'; }).length;
    var sub = active ? active + ' ' + U.plural(active, 'активный заём', 'активных займа', 'активных займов')
      : (loans.length ? 'нет активных займов' : (c.phone ? esc(c.phone) : 'без займов'));
    return '<button class="row tap" data-act="client" data-id="' + c.id + '">' +
      V.avatar(c.name) +
      '<span class="grow"><span class="ttl">' + esc(c.name) + '</span><span class="sub">' + sub +
      (p.overdueCount ? ' · <b style="color:var(--red)">просрочка</b>' : '') + '</span></span>' +
      '<span class="val"><span class="v1 num">' + V.sum(p.totalDue, p.cur.totalDue) + '</span>' +
      (V.hasMoney(p.profitRealized, p.cur.profit) ? '<span class="v2">заработано ' + V.sum(p.profitRealized, p.cur.profit) + '</span>' : '') +
      '</span><span class="chev">' + V.ICON.chev + '</span></button>';

  V.empty = function (ic, t, d, btn) {
    return '<div class="empty"><div class="ic">' + ic + '</div><div class="t">' + esc(t) + '</div>' +

  V.topbar = function (title, right) {
    return '<div class="topbar" id="topbar"><span class="tb-btn" style="visibility:hidden">' + V.ICON.back + '</span>' +
      '<span class="tb-title">' + esc(title) + '</span>' +
      '<span class="tb-btn right">' + (right || '') + '</span></div>';
  };
  V.topbarBack = function (title, right) {
    return '<div class="topbar" id="topbar"><button class="tb-btn" data-act="back">' + V.ICON.back + '</button>' +
      '<span class="tb-title">' + esc(title) + '</span>' +
      '<span class="tb-btn right">' + (right || '') + '</span></div>';
  };

  /* ============ ОБЗОР ============ */
  V.home = function () {

    var mk = U.monthKey(U.today());

    if (s.mixed) {
      h += '<div class="card pad" style="margin-top:12px;background:var(--warn-soft)">' +

        '<div style="font-size:14px;color:var(--text-2);line-height:1.4">Чтобы видеть один общий итог, задайте курс валют — вручную или обновите из банка.</div>' +
        '<button class="btn sec sm" style="margin-top:12px;width:100%" data-act="go-rates">Задать курс</button></div>';
    }

    /* главное для ежемесячных процентов */
    var expects = V.hasMoney(s.monthDue, s.cur.monthDue);
    if (expects || mProfit) {
      h += '<h2 class="sec">Проценты за ' + U.monthName(mk).toLowerCase().replace(/ \d+$/, '') + '</h2>' +
        '<div class="card pad">' +
        '<div class="kv big"><span class="k">Уже получено</span><span class="v num" style="color:var(--accent)">' +
        (mProfit ? U.money(mProfit) : '—') + '</span></div>' +
        '<div class="kv big"><span class="k">Ещё ждём</span><span class="v num">' +

        '</div>';
    }

    h += '<div class="stats">' +
      '<div class="stat"><div class="k"><span class="dot" style="background:var(--red)"></span>Просрочено</div>' +
      '<div class="v num" style="color:' + (s.overdueCount ? 'var(--red)' : 'inherit') + '">' +
      (s.overdueCount ? V.sum(s.overdueSum, s.cur.overdueSum) : '—') + '</div>' +
      '<div class="k" style="margin-top:2px">' + (s.overdueCount ? s.overdueCount + ' ' + U.plural(s.overdueCount, 'заём', 'займа', 'займов') : 'всё по графику') + '</div></div>' +

      '<div class="stat"><div class="k"><span class="dot" style="background:var(--violet)"></span>Ожидаю всего</div>' +
      '<div class="v num">' + V.sum(s.profitExpected, s.cur.expected) + '</div>' +
      '<div class="k" style="margin-top:2px">процентов по активным</div></div>' +

      '<div class="stat"><div class="k"><span class="dot" style="background:var(--blue)"></span>Выдано за месяц</div>' +
      '<div class="v num">' + (mIssued ? U.money(mIssued) : '—') + '</div>' +
      '<div class="k" style="margin-top:2px">' + U.monthName(mk) + '</div></div>' +

      '<div class="stat"><div class="k"><span class="dot" style="background:var(--accent)"></span>В работе</div>' +
      '<div class="v num">' + V.sum(s.outstanding, s.cur.outstanding) + '</div>' +
      '<div class="k" style="margin-top:2px">' + s.activeCount + ' ' + U.plural(s.activeCount, 'активный заём', 'активных займа', 'активных займов') + '</div></div>' +
      '</div>';

    h += '<div class="btn-row"><button class="btn" data-act="new-loan">＋ Выдать заём</button>' +
      '<button class="btn sec" data-act="quick-pay">Принять платёж</button></div>';

    if (s.overdue.length) {
      h += '<h2 class="sec" style="color:var(--red)">Просрочено · ' + s.overdue.length + '</h2><div class="list">';
      s.overdue.slice(0, 8).forEach(function (x) { h += V.loanRow(x.loan); });
      h += '</div>';
    }
    if (s.dueSoon.length) {
      h += '<h2 class="sec">Ближайшие платежи</h2><div class="list">';
      s.dueSoon.slice(0, 8).forEach(function (x) { h += V.loanRow(x.loan); });
      h += '</div>';
    }

    var recent = [];
    loans.forEach(function (l) {
      (l.payments || []).forEach(function (p) { recent.push({ l: l, p: p }); });
    });
    recent.sort(function (a, b) { return a.p.date < b.p.date ? 1 : -1; });
    if (recent.length) {
      h += '<h2 class="sec">Последние платежи</h2><div class="list">';
      recent.slice(0, 5).forEach(function (x) {
        var c = DB.client(x.l.clientId) || { name: '—' };
        h += '<button class="row tap" data-act="loan" data-id="' + x.l.id + '">' + V.avatar(c.name) +
          '<span class="grow"><span class="ttl">' + esc(c.name) + '</span>' +
          '<span class="sub">' + U.relDate(x.p.date) + (x.p.note ? ' · ' + esc(x.p.note) : '') + '</span></span>' +
          '<span class="val"><span class="v1 num" style="color:var(--accent)">+' + U.money(x.p.amount, x.l.currency) + '</span></span>' +

    if (!DB.data.settings.lastExport || U.diffDays(DB.data.settings.lastExport, U.today()) > 14) {

        '<div style="font-weight:600;margin-bottom:4px">Сделайте резервную копию</div>' +
        '<div style="font-size:14px;color:var(--text-2);line-height:1.4">База хранится только на этом телефоне. Сохраните файл копии в «Файлы» или отправьте себе — тогда данные не пропадут при смене телефона.</div>' +
        '<button class="btn sec sm" style="margin-top:12px;width:100%" data-act="export-json">Сохранить копию</button></div>';
    }

    return h + '</div>';
  };

  /* ============ ЗАЙМЫ ============ */
  V.loansFilter = 'active';
  V.loansQuery = '';

  V.loans = function () {
    var all = DB.loans();
    var act = all.filter(function (l) { return l.status !== 'closed'; });
    var over = act.filter(function (l) { return CALC.loan(l).isOverdue; });
    var cl = all.filter(function (l) { return l.status === 'closed'; });

    var list = V.loansFilter === 'active' ? act : V.loansFilter === 'overdue' ? over :
      V.loansFilter === 'closed' ? cl : all;

    var q = V.loansQuery.trim().toLowerCase();
    if (q) {
      list = list.filter(function (l) {
        var c = DB.client(l.clientId) || { name: '', phone: '' };
        return (c.name + ' ' + (c.phone || '') + ' ' + (l.note || '')).toLowerCase().indexOf(q) >= 0;
      });
    }
    list = list.slice().sort(function (a, b) {
      var ra = CALC.loan(a), rb = CALC.loan(b);
      if (ra.isOverdue !== rb.isOverdue) return ra.isOverdue ? -1 : 1;
      var da = a.dueAt || '9999', db = b.dueAt || '9999';
      return da < db ? -1 : da > db ? 1 : 0;
    });

    var sum = list.reduce(function (a, l) { var r = CALC.loan(l); return a + (r.isClosed ? 0 : r.totalDue); }, 0);

    var h = V.topbar('Займы', '<button data-act="new-loan" style="font-size:26px;font-weight:300">＋</button>');
    h += '<div class="wrap"><h1 class="big">Займы</h1>';
    h += '<div class="search">' + V.ICON.search +
      '<input id="q" type="search" placeholder="Имя, телефон, заметка" value="' + esc(V.loansQuery) + '" autocomplete="off"></div>';
    h += '<div class="seg">' +
      seg('active', 'Активные', act.length) +
      seg('overdue', 'Просрочка', over.length) +
      seg('closed', 'Закрытые', cl.length) +
      seg('all', 'Все', all.length) + '</div>';

    if (!list.length) {
      h += V.empty('🔍', 'Ничего не найдено', q ? 'Попробуйте другой запрос.' : 'В этой вкладке пока пусто.');
    } else {
      if (V.loansFilter !== 'closed' && sum > 0) {
        h += '<div style="font-size:13px;color:var(--text-2);margin:0 4px 8px">' +
          list.length + ' ' + U.plural(list.length, 'заём', 'займа', 'займов') + ' · к возврату <b class="num" style="color:var(--text)">' + U.money(sum) + '</b></div>';
      }
      h += '<div class="list">';
      list.forEach(function (l) { h += V.loanRow(l); });
      h += '</div>';
    }
    return h + '</div>';

    function seg(k, t, n) {
      return '<button data-act="filter" data-f="' + k + '" class="' + (V.loansFilter === k ? 'on' : '') + '">' +
        t + (n ? ' <span class="cnt">' + n + '</span>' : '') + '</button>';
    }
  };

  /* ============ КЛИЕНТЫ ============ */
  V.clientsQuery = '';

  V.clients = function () {
    var list = DB.clients().slice();
    var q = V.clientsQuery.trim().toLowerCase();
    if (q) list = list.filter(function (c) { return (c.name + ' ' + (c.phone || '') + ' ' + (c.note || '')).toLowerCase().indexOf(q) >= 0; });

    list.sort(function (a, b) {
      var pa = CALC.portfolio(DB.loansOf(a.id)), pb = CALC.portfolio(DB.loansOf(b.id));
      if (!!pa.overdueCount !== !!pb.overdueCount) return pa.overdueCount ? -1 : 1;
      if (pb.totalDue !== pa.totalDue) return pb.totalDue - pa.totalDue;
      return a.name.localeCompare(b.name, 'ru');
    });

    var h = V.topbar('Клиенты', '<button data-act="new-client" style="font-size:26px;font-weight:300">＋</button>');
    h += '<div class="wrap"><h1 class="big">Клиенты</h1>';
    if (DB.clients().length > 6) {
      h += '<div class="search">' + V.ICON.search +
        '<input id="qc" type="search" placeholder="Поиск по имени или телефону" value="' + esc(V.clientsQuery) + '" autocomplete="off"></div>';
    }
    if (!list.length) {
      h += V.empty('👤', q ? 'Никого не нашлось' : 'Список клиентов пуст',

        return '<option value="' + t[0] + '"' + (st.defaultPeriod === t[0] ? ' selected' : '') + '>' + t[1] + '</option>';
      }).join('') + '</select></div>';
    h += '<div class="field"><label>Проценты платят</label><select data-act="set" data-k="defaultPayMode">' +
      [['monthly', 'каждый месяц'], ['end', 'в конце срока']].map(function (t) {
        return '<option value="' + t[0] + '"' + (st.defaultPayMode === t[0] ? ' selected' : '') + '>' + t[1] + '</option>';
      }).join('') + '</select></div>';

    h += '<h2 class="sec">Проценты</h2><div class="seg" id="f-model">' +
      '<button data-model="simple" class="' + (d.model === 'simple' ? 'on' : '') + '">На остаток долга</button>' +
      '<button data-model="fixed" class="' + (d.model === 'fixed' ? 'on' : '') + '">Фикс. сумма</button></div>';

    h += '<div id="box-simple"' + (d.model === 'fixed' ? ' style="display:none"' : '') + '>' +
      '<div class="seg" id="f-ratemode">' +
      '<button data-rm="percent" class="' + (d.rateMode !== 'amount' ? 'on' : '') + '">Ставкой в %</button>' +
      '<button data-rm="amount" class="' + (d.rateMode === 'amount' ? 'on' : '') + '">Суммой в месяц</button></div>' +
      '<div class="list">' +
      '<div class="field" id="row-pct"><label>Ставка</label><input id="f-rate" type="text" inputmode="decimal" value="' + (d.rate != null ? d.rate : '') + '"><span class="unit">%</span></div>' +
      '<div class="field" id="row-per"><label>Период</label><select id="f-period">' +
      [['day', 'в день'], ['week', 'в неделю'], ['month', 'в месяц'], ['year', 'в год']].map(function (t) {
        return '<option value="' + t[0] + '"' + (d.ratePeriod === t[0] ? ' selected' : '') + '>' + t[1] + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field" id="row-amt"><label>Платёж</label><input id="f-rateamt" type="text" inputmode="decimal" placeholder="0" value="' + (d.rateAmount || '') + '"><span class="unit" id="u-amt">в месяц</span></div>' +
      '</div>' +
      '<div class="chips" id="rate-chips">' + [2, 3, 5, 8, 10, 15, 20].map(function (n) {
        return '<button class="chip" data-rate="' + n + '">' + n + '%</button>';
      }).join('') + '</div>' +
      '<h2 class="sec">Как платит проценты</h2>' +
      '<div class="seg" id="f-paymode">' +
      '<button data-pm="monthly" class="' + (d.payMode !== 'end' ? 'on' : '') + '">Каждый месяц</button>' +
      '<button data-pm="end" class="' + (d.payMode === 'end' ? 'on' : '') + '">В конце срока</button></div>' +
      '</div>';

    h += '<div class="list" id="box-fixed"' + (d.model !== 'fixed' ? ' style="display:none"' : '') + '>' +
      '<div class="field"><label>Вернёт всего</label><input id="f-return" type="text" inputmode="decimal" placeholder="0" value="' + (d.returnAmount || '') + '"></div></div>';

    h += '<div class="list" style="margin-top:12px">' +
      '<div class="field"><label>Пеня</label><input id="f-penalty" type="text" inputmode="decimal" value="' + (d.penaltyRate || 0) + '"><span class="unit">% в день</span></div>' +
      '<div class="field"><label style="min-width:auto;flex:1;font-size:16px">После срока проценты не растут</label>' +
      '<input id="f-stop" type="checkbox" style="flex:none;width:auto;-webkit-appearance:checkbox;appearance:checkbox;transform:scale(1.3)"' + (d.stopAccrual ? ' checked' : '') + '></div>' +
      '<div class="field col"><label>Заметка</label><textarea id="f-note" placeholder="Залог, поручитель, договорённости…">' + esc(d.note || '') + '</textarea></div>' +
      '</div>';

    h += '<div class="card pad" id="preview" style="margin-top:16px"></div>';

    App.sheet({
      title: l ? 'Изменить заём' : 'Новый заём',
      html: h,
      save: l ? 'Сохранить' : 'Выдать',
      onOpen: function (bd) {
        var $ = function (x) { return bd.querySelector(x); };
        function seg(id) { var b = bd.querySelector('#' + id + ' .on'); return b ? b.dataset : {}; }
        function model() { return seg('f-model').model || 'simple'; }
        function rateMode() { return seg('f-ratemode').rm || 'percent'; }
        function payMode() { return seg('f-paymode').pm || 'monthly'; }

        function draft() {
          var principal = U.num($('#f-principal').value);
          var rm = rateMode(), rate, period;
          if (rm === 'amount') {
            rate = CALC.rateFromAmount(principal, U.num($('#f-rateamt').value));
            period = 'month';
          } else {
            rate = U.num($('#f-rate').value);
            period = $('#f-period').value;
          }
          return {
            principal: principal,
            currency: $('#f-cur').value,
            model: model(),
            rate: rate, ratePeriod: period, rateMode: rm,
            rateAmount: U.num($('#f-rateamt').value),
            payMode: payMode(),
            returnAmount: U.num($('#f-return').value),
            issuedAt: $('#f-issued').value || U.today(),
            dueAt: $('#f-due').value || null,
            penaltyRate: U.num($('#f-penalty').value),
            stopAccrual: $('#f-stop').checked,
            note: $('#f-note').value.trim()
          };
        }

        function sync() {
          $('#new-client-fields').style.display = $('#f-client').value === '__new' ? '' : 'none';
          var am = rateMode() === 'amount';
          $('#row-pct').style.display = am ? 'none' : '';
          $('#row-per').style.display = am ? 'none' : '';
          $('#row-amt').style.display = am ? '' : 'none';
          $('#rate-chips').style.display = am ? 'none' : '';
          $('#u-amt').textContent = FX.sym($('#f-cur').value) + ' в месяц';
        }

        function preview() {
          var dr = draft(), box = $('#preview'), cur = dr.currency;
          var mm = function (v, o) { o = o || {}; o.cur = cur; return U.money(v, o); };
          if (!dr.principal) { box.innerHTML = '<div style="color:var(--text-2);font-size:15px">Введите сумму — покажу платёж и доход.</div>'; return; }

          if (dr.model === 'fixed') {
            var pr = Math.max(0, dr.returnAmount - dr.principal);
            box.innerHTML =
              '<div class="kv"><span class="k">Выдаёте</span><span class="v num">' + mm(dr.principal) + '</span></div>' +
              '<div class="kv big"><span class="k">Вернёт всего</span><span class="v num">' + mm(dr.returnAmount) + '</span></div>' +
              '<div class="kv big"><span class="k">Ваш доход</span><span class="v num" style="color:var(--accent)">+' + mm(pr) + '</span></div>';
            return;
          }

          var perM = CALC.perMonth(dr, dr.principal);
          var days = dr.dueAt ? U.diffDays(dr.issuedAt, dr.dueAt) : 0;
          var p = CALC.plan(Object.assign({ payments: [], status: 'active' }, dr));
          var out = '<div class="kv"><span class="k">Выдаёте</span><span class="v num">' + mm(dr.principal) + '</span></div>';

          if (dr.payMode === 'monthly') {
            out += '<div class="kv big"><span class="k">Каждый месяц</span><span class="v num" style="color:var(--accent)">' + mm(perM) + '</span></div>' +
              '<div class="kv"><span class="k">Тело вернёт</span><span class="v num">' +
              (dr.dueAt ? U.fmtDate(dr.dueAt, true) : 'когда договоритесь') + '</span></div>';
            if (days > 0) {
              out += '<div class="kv big"><span class="k">Доход за ' + U.days(days) + '</span><span class="v num" style="color:var(--accent)">+' +
                mm(p.interestDue + p.penaltyDue) + '</span></div>';
            } else {
              out += '<div class="kv"><span class="k">За год получится</span><span class="v num" style="color:var(--accent)">+' + mm(perM * 12) + '</span></div>';
            }
          } else {
            out += '<div class="kv"><span class="k">Срок</span><span class="v num">' + (days > 0 ? U.days(days) : 'не указан') + '</span></div>' +
              '<div class="kv big"><span class="k">Вернёт всего</span><span class="v num">' + mm(p.balance + p.interestDue + p.penaltyDue) + '</span></div>' +
              '<div class="kv big"><span class="k">Ваш доход</span><span class="v num" style="color:var(--accent)">+' + mm(p.interestDue + p.penaltyDue) + '</span></div>';
          }
          if (rateMode() === 'amount' && dr.principal) {
            out += '<div class="kv"><span class="k">Это ставка</span><span class="v num">' + U.pct(dr.rate) + ' в месяц</span></div>';
          }
          box.innerHTML = out;
        }

        bd.addEventListener('input', function () { sync(); preview(); });
        bd.addEventListener('change', function () { sync(); preview(); });
        bd.addEventListener('click', function (e) {
          var t = e.target.closest('[data-term]');
          if (t) {
            var n = +t.dataset.term;
            $('#f-due').value = n ? U.addDays($('#f-issued').value || U.today(), n) : '';
            U.$$('[data-term]', bd).forEach(function (c) { c.classList.remove('on'); });
            t.classList.add('on'); preview(); return;
          }
          var rc = e.target.closest('[data-rate]');
          if (rc) {
            $('#f-rate').value = rc.dataset.rate;
            U.$$('[data-rate]', bd).forEach(function (c) { c.classList.remove('on'); });
            rc.classList.add('on'); preview(); return;
          }
          var g = e.target.closest('[data-model],[data-rm],[data-pm]');
          if (g) {
            var box = g.closest('.seg');
            U.$$('button', box).forEach(function (b) { b.classList.remove('on'); });
            g.classList.add('on');
            if (g.dataset.model) {
              $('#box-simple').style.display = g.dataset.model === 'simple' ? '' : 'none';
              $('#box-fixed').style.display = g.dataset.model === 'fixed' ? '' : 'none';
            }
            sync(); preview();
          }
        });
        sync(); preview();
        if (!l) setTimeout(function () { $('#f-principal').focus(); }, 380);
      },

      onSave: function (bd) {
        var $ = function (x) { return bd.querySelector(x); };
        var segOn = function (id) { var b = bd.querySelector('#' + id + ' .on'); return b ? b.dataset : {}; };
        var rm = segOn('f-ratemode').rm || 'percent';
        var principal = U.num($('#f-principal').value);
        var dr = {
          principal: principal,
          currency: $('#f-cur').value,
          model: segOn('f-model').model || 'simple',
          rate: rm === 'amount' ? CALC.rateFromAmount(principal, U.num($('#f-rateamt').value)) : U.num($('#f-rate').value),
          ratePeriod: rm === 'amount' ? 'month' : $('#f-period').value,
          rateMode: rm,
          rateAmount: U.num($('#f-rateamt').value),
          payMode: segOn('f-paymode').pm || 'monthly',
          returnAmount: U.num($('#f-return').value),
          issuedAt: $('#f-issued').value || U.today(),
          dueAt: $('#f-due').value || null,
          penaltyRate: U.num($('#f-penalty').value),
          stopAccrual: $('#f-stop').checked,
          note: $('#f-note').value.trim()
        };
        if (!dr.principal || dr.principal <= 0) { U.toast('Укажите сумму займа'); return false; }
        if (dr.model === 'fixed' && dr.returnAmount < dr.principal) { U.toast('Сумма возврата меньше выданной'); return false; }
        if (dr.model === 'simple' && rm === 'amount' && !U.num($('#f-rateamt').value)) { U.toast('Укажите месячный платёж'); return false; }

        var cid = $('#f-client').value;
        if (cid === '__new') {
          var nm = $('#f-cname').value.trim();
          if (!nm) { U.toast('Введите имя клиента'); return false; }
          var ex = DB.clientByName(nm);
          cid = ex ? ex.id : DB.addClient({ name: nm, phone: $('#f-cphone').value.trim() }).id;
        }
        dr.clientId = cid;

        if (l) { DB.updLoan(l.id, dr); U.toast('Изменения сохранены'); App.go('#/loan/' + l.id); }
        else { var nl = DB.addLoan(dr); U.toast('Заём выдан'); App.go('#/loan/' + nl.id); }
        return true;
      }
    });
  };

  /* ============ ФОРМА КЛИЕНТА ============ */
  F.clientForm = function (clientId) {
    var c = clientId ? DB.client(clientId) : null;
    var h = '<div class="list">' +
      '<div class="field"><label>Имя</label><input id="c-name" placeholder="Иван Петров" value="' + esc(c ? c.name : '') + '" autocomplete="off"></div>' +
      '<div class="field"><label>Телефон</label><input id="c-phone" type="tel" inputmode="tel" placeholder="+7 900 000-00-00" value="' + esc(c ? c.phone || '' : '') + '"></div>' +
      '<div class="field col"><label>Заметка</label><textarea id="c-note" placeholder="Где работает, кто поручитель, как платит…">' + esc(c ? c.note || '' : '') + '</textarea></div>' +
      '</div>';
    App.sheet({
      title: c ? 'Изменить клиента' : 'Новый клиент',
      html: h, save: 'Сохранить',
      onOpen: function (bd) { setTimeout(function () { bd.querySelector('#c-name').focus(); }, 380); },
      onSave: function (bd) {
        var name = bd.querySelector('#c-name').value.trim();
        if (!name) { U.toast('Введите имя'); return false; }
        var patch = { name: name, phone: bd.querySelector('#c-phone').value.trim(), note: bd.querySelector('#c-note').value.trim() };
        if (c) { DB.updClient(c.id, patch); U.toast('Сохранено'); App.render(); }
        else { var nc = DB.addClient(patch); U.toast('Клиент добавлен'); App.go('#/client/' + nc.id); }
        return true;
      }
    });
  };

  /* ============ ФОРМА ПЛАТЕЖА ============ */
  F.paymentForm = function (loanId) {
    var l = DB.loan(loanId);
    if (!l) return;
    var c = DB.client(l.clientId) || { name: '—' };
    var r = CALC.loan(l);
    var cur = l.currency || FX.base();
    var m = function (v, o) { o = o || {}; o.cur = cur; return U.money(v, o); };

    var perM = l.model === 'fixed' ? 0 : CALC.perMonth(l, r.balance);
    var owed = Math.round(r.interestDue + r.penaltyDue);      // всё, что накопилось процентами
    var all = Math.round(r.totalDue);

    var h = '<div style="text-align:center;margin-bottom:14px">' +
      '<div style="font-size:13px;color:var(--text-2)">' + esc(c.name) + ' · долг на сегодня</div>' +
      '<div style="font-size:30px;font-weight:700;letter-spacing:-.6px" class="num">' + m(r.totalDue) + '</div>' +
      (l.payMode === 'monthly' && r.missed
        ? '<div style="font-size:13px;color:var(--red);font-weight:600;margin-top:3px">не платил ' + r.missed + ' ' +
        U.plural(r.missed, 'месяц', 'месяца', 'месяцев') + '</div>' : '') +
      '</div>';

    h += '<div class="list">' +
      '<div class="field"><label>Сумма</label><input id="p-amount" type="text" inputmode="decimal" placeholder="0" style="font-size:22px;font-weight:600"><span class="unit">' + esc(FX.sym(cur)) + '</span></div>' +
      '<div class="field"><label>Дата</label><input id="p-date" type="date" value="' + U.today() + '"></div>' +
      '<div class="field col"><label>Заметка</label><textarea id="p-note" placeholder="Наличные, перевод…" style="min-height:44px"></textarea></div>' +
      '</div>';

    h += '<div class="chips" style="margin-top:12px;border-radius:var(--radius)">';
    if (perM > 0.5) h += '<button class="chip" data-amt="' + Math.round(perM) + '">Проценты за месяц · ' + m(perM) + '</button>';
    if (owed > 0.5 && Math.abs(owed - Math.round(perM)) > 0.5) h += '<button class="chip" data-amt="' + owed + '">Все накопленные проценты · ' + m(owed) + '</button>';
    if (all > 0.5) h += '<button class="chip" data-amt="' + all + '">Закрыть весь долг · ' + m(all) + '</button>';
    h += '</div>';

    h += '<div class="card pad" id="p-prev" style="margin-top:14px"></div>';

    App.sheet({
      title: 'Платёж', html: h, save: 'Принять',
      onOpen: function (bd) {
        var inp = bd.querySelector('#p-amount');
        function prev() {
          var amt = U.num(inp.value), box = bd.querySelector('#p-prev');
          if (!amt) { box.innerHTML = '<div style="color:var(--text-2);font-size:15px">Введите сумму — покажу, как она распределится.</div>'; return; }
          var left = amt, pen = Math.min(left, r.penaltyDue); left -= pen;
          var int = Math.min(left, r.interestDue); left -= int;
          var prin = Math.min(left, r.balance); left -= prin;
          var rest = r.totalDue - (pen + int + prin);
          box.innerHTML =
            (pen > 0.5 ? kvv('Погасит пеню', m(pen)) : '') +
            kvv('Погасит проценты', m(int)) +
            kvv('Уйдёт в тело долга', m(prin)) +
            (left > 0.5 ? kvv('Переплата', m(left)) : '') +
            '<div class="kv big"><span class="k">Останется долга</span><span class="v num"' + (rest < 0.5 ? ' style="color:var(--accent)"' : '') + '>' +
            (rest < 0.5 ? 'ноль — заём закроется' : m(rest)) + '</span></div>';
        }
        bd.addEventListener('input', prev);
        bd.addEventListener('click', function (e) {
          var t = e.target.closest('[data-amt]');
          if (t) { inp.value = t.dataset.amt; prev(); }
        });
        prev();
        setTimeout(function () { inp.focus(); }, 380);
      },
      onSave: function (bd) {
        var amt = U.num(bd.querySelector('#p-amount').value);
        if (amt <= 0) { U.toast('Укажите сумму платежа'); return false; }
        DB.addPayment(l.id, {
          amount: amt,
          date: bd.querySelector('#p-date').value || U.today(),
          note: bd.querySelector('#p-note').value.trim()
        });
        var after = CALC.loan(DB.loan(l.id));
        U.toast(after.isClosed ? 'Платёж принят, заём закрыт' : 'Платёж принят · осталось ' + m(after.totalDue));
        App.render();
        return true;
      }
    });

    function kvv(k, v) { return '<div class="kv"><span class="k">' + k + '</span><span class="v num">' + v + '</span></div>'; }
  };

  /* ============ БЫСТРЫЙ ПЛАТЁЖ: выбор займа ============ */
  F.quickPay = function () {
    var act = DB.loans().filter(function (l) { return l.status !== 'closed'; });
    if (!act.length) { U.toast('Нет активных займов'); return; }
    if (act.length === 1) { F.paymentForm(act[0].id); return; }
    var h = '<div class="list">' + act.map(function (l) { return V.loanRow(l); }).join('') + '</div>';
    App.sheet({
      title: 'Кто платит?', html: h, save: null,
      onOpen: function (bd) {
        bd.addEventListener('click', function (e) {
          var b = e.target.closest('[data-act="loan"]');
          if (b) { App.closeSheet(); setTimeout(function () { F.paymentForm(b.dataset.id); }, 340); }
        });
      }
    });
  };

  /* ============ ИМПОРТ ============ */
  F.importSheet = function () {
    var h = '<div class="hint" style="padding:0 4px 14px">Выберите файл резервной копии <b>.json</b> или таблицу <b>.csv</b>. Можно также вставить текст ниже.</div>' +
      '<div class="list">' +
      '<button class="row tap" id="pick"><span class="grow"><span class="ttl" style="color:var(--accent)">Выбрать файл</span>' +
      '<span class="sub">.json или .csv</span></span></button></div>' +
      '<input type="file" id="file" accept=".json,.csv,.txt,application/json,text/csv" style="display:none">' +
      '<h2 class="sec">Или вставьте текст</h2>' +
      '<div class="list"><div class="field col"><textarea id="paste" style="min-height:130px;font-size:14px" ' +
      'placeholder="Иван Петров;+79000000000;50000;01.09.2026;10;месяц;30;залог — телефон"></textarea></div></div>' +
      '<div class="hint">Столбцы CSV: <b>Имя;Телефон;Сумма;Дата выдачи;Ставка;Период;Срок в днях;Заметка</b>. ' +
      'Разделитель — точка с запятой. Первая строка с заголовками не обязательна.</div>' +
      '<h2 class="sec">Как загружать</h2>' +
      '<div class="seg" id="mode"><button data-m="merge" class="on">Добавить к текущим</button>' +
      '<button data-m="replace">Заменить всё</button></div>';

    App.sheet({
      title: 'Загрузка базы', html: h, save: 'Загрузить',
      onOpen: function (bd) {
        bd.querySelector('#pick').addEventListener('click', function () { bd.querySelector('#file').click(); });
        bd.querySelector('#file').addEventListener('change', function (e) {
          var f = e.target.files[0];
          if (!f) return;
          var fr = new FileReader();
          fr.onload = function () { bd.querySelector('#paste').value = fr.result; U.toast('Файл прочитан: ' + f.name); };
          fr.readAsText(f);
        });
        bd.addEventListener('click', function (e) {
          var m = e.target.closest('[data-m]');
          if (m) { U.$$('#mode button', bd).forEach(function (b) { b.classList.remove('on'); }); m.classList.add('on'); }
        });
      },
      onSave: function (bd) {
        var text = bd.querySelector('#paste').value.trim();
        if (!text) { U.toast('Не выбран файл и не вставлен текст'); return false; }
        var mode = bd.querySelector('#mode .on').dataset.m;

        function run() {
          try {
            if (text[0] === '{') {
              var res = DB.importJSON(text, mode);
              U.toast('Загружено: ' + res.clients + ' клиентов, ' + res.loans + ' займов');
            } else {
              if (mode === 'replace') { DB.data = DB.empty(); DB.save(); }
              var n = DB.importCSV(text);
              U.toast(n ? 'Добавлено займов: ' + n : 'Ни одной строки не распознано');
            }
            App.closeSheet();
            App.go('#/');
          } catch (err) {
            U.toast('Ошибка: ' + err.message);
          }
        }

        if (mode === 'replace') {
          App.ask({
            title: 'Заменить всю базу?',
            text: 'Текущие клиенты, займы и платежи будут стёрты и заменены загружаемыми.',
            ok: 'Заменить', danger: true, onOk: run
          });
        } else {
          run();
        }
        return false;   // лист закрывается внутри run()
      }
    });
  };

  /* ============ КОД-ПАРОЛЬ ============ */
  F.pinSheet = function () {
    var h = '<div class="hint" style="padding:0 4px 14px">Код из 4 цифр будет спрашиваться при каждом запуске приложения.</div>' +
      '<div class="list"><div class="field"><label>Новый код</label>' +

/* Запуск, навигация, модальные листы, действия */
(function (w) {

  App.hash = function (s) {
    var h = 5381, str = 'kapital.' + s;

    else if (r === '#/loans') html = V.loans();

    requestAnimationFrame(function () { bg.classList.add('in'); sh.classList.add('in'); });

    bg.addEventListener('click', function () { App.closeSheet(); });
    sh.addEventListener('click', function (e) {
      var b = e.target.closest('[data-sheet]');

        if (!opt.onSave || opt.onSave(bd) !== false) App.closeSheet();

    App._sheet = { bg: bg, sh: sh };
    if (opt.onOpen) opt.onOpen(bd);
  };

  App.closeSheet = function (now) {

  /* ---------- сохранение файла ----------
     Порядок попыток: среда Artifact (claude.use) → «Поделиться» на iOS →
     обычное скачивание → показать текст для копирования вручную.     */
  App.saveFile = function (name, text, mime, done) {
    done = done || function () { };

    /* 1. страница открыта внутри просмотрщика Artifact */
    if (w.claude && typeof w.claude.use === 'function') {
      App._dlp = App._dlp || w.claude.use('downloads');
      App._dlp.then(function (dl) {
        if (!dl) return App.copyFallback(name, text, done);
        dl.save({ filename: name, data: text })
          .then(function () { done(true); })
          .catch(function (e) {
            if (e && e.code === 'declined') { done(false); return; }
            App.copyFallback(name, text, done);
          });
      }, function () { App.copyFallback(name, text, done); });
      return;
    }

    /* 2. системное «Поделиться» — на iPhone кладёт файл в «Файлы» или мессенджер */
    try {
      if (w.File && navigator.canShare) {
        var f = new File([text], name, { type: mime });
        if (navigator.canShare({ files: [f] })) {
          navigator.share({ files: [f], title: name })
            .then(function () { done(true); })
            .catch(function () { done(false); });
          return;
        }
      }
    } catch (e) { }

    /* 3. обычное скачивание */
    try {
      var blob = new Blob([text], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      done(true);
      return;
    } catch (e) { }

    /* 4. ничего не вышло — отдаём текст руками */
    App.copyFallback(name, text, done);
  };

  /* Файл сохранить не удалось: показываем текст, чтобы скопировать и сохранить самому */
  App.copyFallback = function (name, text, done) {
    App.sheet({
      title: 'Скопируйте копию',
      save: null,
      html: '<div class="hint" style="padding:0 4px 12px">Здесь сохранить файл нельзя. Скопируйте текст и вставьте его в заметку, письмо или мессенджер — из него база восстанавливается целиком через «Загрузить базу».</div>' +
        '<button class="btn" id="cp">Скопировать всё</button>' +
        '<div class="list" style="margin-top:12px"><div class="field col">' +
        '<label>' + U.esc(name) + '</label>' +
        '<textarea id="dump" readonly style="min-height:220px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace"></textarea>' +
        '</div></div>',
      onOpen: function (bd) {
        var ta = bd.querySelector('#dump');
        ta.value = text;
        bd.querySelector('#cp').addEventListener('click', function () {
          ta.focus(); ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { }
          if (ok) { U.toast('Скопировано'); done(true); return; }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
              .then(function () { U.toast('Скопировано'); done(true); })
              .catch(function () { U.toast('Скопируйте выделенный текст вручную'); });
          } else {
            U.toast('Скопируйте выделенный текст вручную');
          }
        });
      }
    });
  };
