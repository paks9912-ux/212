<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" role="img" aria-label="KYOTO — sushi &amp; chicken">
  <title>KYOTO — sushi &amp; chicken</title>

  <!-- Красное солнце в круге энсо (вместо первой O) -->
  <circle cx="305" cy="62" r="30" fill="#E8322D"/>

  <!-- Кольцо энсо: рисованный круг с разрывом -->
  <path d="M305 12
           a50 50 0 1 1 -35.4 14.6"
        fill="none" stroke="#332F2F" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M262 32
           a50 50 0 0 0 -8 30"
        fill="none" stroke="#332F2F" stroke-width="5.5" stroke-linecap="round" opacity=".85"/>

  <!-- KYOT_O — буквы -->
  <g fill="#332F2F" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
     font-size="118" font-weight="400" letter-spacing="6">
    <text x="8" y="104">K</text>
    <text x="122" y="104">Y</text>
    <text x="382" y="104">T</text>
    <text x="500" y="104">O</text>
  </g>

  <!-- Подпись -->
  <text x="310" y="141" fill="#E8322D" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="31" font-weight="700">sushi &amp; chicken</text>
</svg>
