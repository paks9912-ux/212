      '<div class="field"><label>Отработано</label><input id="f-work" type="text" inputmode="decimal" placeholder="0" value="' +
      (d.work || '') + '"><span class="unit mu">м·ч</span></div></div>';

    h += '<div class="list" style="margin-top:12px"><div class="field col"><label>Заметка</label>' +
      '<textarea id="f-note" placeholder="Что делали, простои, поломки…">' + esc(d.note || '') + '</textarea></div></div>';
    h += '<div class="card pad" id="preview" style="margin-top:16px"></div>';

    App.sheet({
      title: op ? 'Изменить смену' : 'Смена',
      html: h, save: op ? 'Сохранить' : 'Записать',
      onOpen: function (bd) {
        var $ = function (x) { return bd.querySelector(x); };
        watchDriverSelect(bd);
        function mode2() { var b = bd.querySelector('#f-mode .on'); return b ? b.dataset.m : 'meter'; }
        function draft() {
          return { start: $('#f-start').value, end: $('#f-end').value, work: $('#f-work').value };
        }
        function preview() {
          var u = DB.unit($('#f-unit').value);
          if (!u) return;
          U.$$('.mu', bd).forEach(function (x) { x.textContent = U.meterInfo(u.meter).unit; });
          $('#box-meter').style.display = mode2() === 'meter' ? '' : 'none';
          $('#box-work').style.display = mode2() === 'work' ? '' : 'none';
          var s = draft();
          var wk = mode2() === 'meter'
            ? Math.max(0, U.num(s.end) - U.num(s.start))
            : Math.max(0, U.num(s.work));
          var norm = CALC.normFor(u, wk);
          var left = CALC.tankLeft(u, $('#f-date').value).left;
          if (op) left += CALC.normFor(u, CALC.shiftWork(op));
          var html = V.kv('Наработка', U.work(wk, u.meter), 'big') +
            V.kv('Спишется по норме', U.liters(norm)) +
            V.kv('Останется в баке', (left - norm < 0
              ? '<span style="color:var(--orange)">' + U.liters(left - norm) + '</span>'
              : U.liters(left - norm)));
          if (left - norm < 0) html += '<div class="hint" style="padding:8px 0 0">Расчётный остаток уходит в минус: ' +
            'скорее всего, какие-то заправки ещё не внесены.</div>';
          $('#preview').innerHTML = html;
        }
        bd.addEventListener('input', preview);
        bd.addEventListener('change', function (e) {
          if (e.target.id === 'f-unit' && !op) {
            var u = DB.unit(e.target.value);
            if (u) {
              $('#f-start').value = U.dec(CALC.meterNow(u), 1);
              if (u.driverId) $('#f-driver').value = u.driverId;
            }
          }
          preview();
        });
        bd.addEventListener('click', function (e) {
          var b = e.target.closest('#f-mode [data-m]');
          if (!b) return;
          U.$$('#f-mode button', bd).forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          preview();
        });
        preview();
        if (!op) setTimeout(function () { $('#f-end').focus(); }, 380);
      },
      onSave: function (bd) {
        var $ = function (x) { return bd.querySelector(x); };
        var mb = bd.querySelector('#f-mode .on');
        var byMeter = (mb ? mb.dataset.m : 'meter') === 'meter';
        var wk = byMeter ? U.num($('#f-end').value) - U.num($('#f-start').value) : U.num($('#f-work').value);
        if (!(wk > 0)) { U.toast(byMeter ? 'Показания на конец должны быть больше' : 'Укажите наработку'); return false; }
        var drv = resolveDriver(bd);
        if (drv === '__error') { U.toast('Введите имя водителя'); return false; }
        var rec = {
          unitId: $('#f-unit').value, driverId: drv, date: $('#f-date').value || U.today(),
          start: byMeter ? U.num($('#f-start').value) : null,
          end: byMeter ? U.num($('#f-end').value) : null,
          work: byMeter ? null : wk,
          site: $('#f-site').value.trim(), note: $('#f-note').value.trim()
        };
        if (op) { DB.updShift(op.id, rec); U.toast('Смена изменена'); }
        else { DB.addShift(rec); U.toast('Смена записана'); }
        App.render();
        return true;
      }
    });
  };

  /* ---------- ЗАМЕР БАКА ---------- */

    var h = '<div class="hint" style="padding:0 4px 12px">Замер — точка опоры. Приложение сравнит его со своим расчётом ' +

      '<div class="list">' + unitSelect(d.unitId) +
      '<div class="field"><label>Дата</label><input id="f-date" type="date" value="' + esc(d.date) + '"></div>' +
      '<div class="field"><label>В баке</label><input id="f-liters" type="text" inputmode="decimal" placeholder="0" value="' +
      (d.liters !== '' && d.liters != null ? d.liters : '') + '"><span class="unit">л</span></div>' +
      '<div class="field"><label>Счётчик</label><input id="f-meter" type="text" inputmode="decimal" placeholder="необязательно" value="' +
      (d.meter != null && d.meter !== '' ? d.meter : '') + '"><span class="unit" id="u-m">м·ч</span></div>' +
      '<div class="field col"><label>Заметка</label><textarea id="f-note" placeholder="Кто замерял, чем…">' +
      esc(d.note || '') + '</textarea></div></div>' +
      '<div class="card pad" id="preview" style="margin-top:16px"></div>';

    App.sheet({
      title: op ? 'Изменить замер' : 'Замер бака',

      onOpen: function (bd) {
        var $ = function (x) { return bd.querySelector(x); };
        function preview() {
          var u = DB.unit($('#f-unit').value);
          if (!u) return;
          $('#u-m').textContent = U.meterInfo(u.meter).unit;
          var expected = CALC.tankLeft(u, $('#f-date').value).left;
          var found = U.num($('#f-liters').value);
          var dev = found - expected;
          var html = V.kv('По расчёту должно быть', U.liters(expected), 'big');
          if ($('#f-liters').value !== '') {
            html += V.kv('Разница', (dev < -0.5
              ? '<span style="color:var(--red)">недостача ' + U.liters(-dev) + '</span>'
              : dev > 0.5 ? '<span style="color:var(--accent)">излишек ' + U.liters(dev) + '</span>'
                : 'сходится'));
            if (dev < -0.5 && DB.data.settings.price) {
              html += V.kv('В деньгах', U.money(-dev * DB.data.settings.price));
            }
          }
          $('#preview').innerHTML = html;
        }
        bd.addEventListener('input', preview);
        bd.addEventListener('change', preview);
        preview();
        if (!op) setTimeout(function () { $('#f-liters').focus(); }, 380);
      },
      onSave: function (bd) {
        var $ = function (x) { return bd.querySelector(x); };
        if ($('#f-liters').value === '') { U.toast('Сколько литров в баке?'); return false; }
        var rec = {
          type: 'check', unitId: $('#f-unit').value, date: $('#f-date').value || U.today(),
          liters: U.num($('#f-liters').value), price: 0, sum: 0,
          meter: $('#f-meter').value !== '' ? U.num($('#f-meter').value) : null,
          note: $('#f-note').value.trim()

      }

  /* ---------- СЛИВ ТОПЛИВА ----------
     Отдельная операция: топливо ушло, но не на работу. Пока слив не
     записан, он тянет вниз расчётный остаток и валит всю арифметику.   */
  F.drainForm = function (opId, unitId) {
    var op = opId ? DB.fuelOp(opId) : null;
    var hasUnits = DB.units().length > 0;
    var d = op || {
      unitId: unitId || (hasUnits ? DB.units()[0].id : null),
      date: U.today(), liters: '', note: ''
    };

    var h = '<div class="hint" style="padding:0 4px 12px">Записывайте сюда только топливо, ушедшее ' +
      '<b>мимо работы</b>: слив, утечка, хищение. После записи остаток в баке и недостача сойдутся.</div>';
    h += '<div class="seg" id="f-where">' +
      '<button data-w="unit" class="' + (fromTank ? '' : 'on') + '">Из бака техники</button>' +
      '<button data-w="tank" class="' + (fromTank ? 'on' : '') + '">Со склада</button></div>';
    h += '<div class="list">' +
      '<div id="unit-box"' + (fromTank ? ' style="display:none"' : '') + '>' +
      (hasUnits ? unitSelect(d.unitId) : '') + '</div>' +
      '<div class="field"><label>Дата</label><input id="f-date" type="date" value="' + esc(d.date) + '"></div>' +
      '<div class="field"><label>Сколько ушло</label><input id="f-liters" type="text" inputmode="decimal" placeholder="0" value="' +
      (d.liters || '') + '"><span class="unit">л</span></div>' +
      '<div class="field col"><label>Что случилось</label><textarea id="f-note" placeholder="Слив на стоянке, порыв шланга, составлен акт…">' +
      esc(d.note || '') + '</textarea></div></div>' +
      '<div class="card pad" id="preview" style="margin-top:16px"></div>';

    App.sheet({
      title: op ? 'Изменить запись' : 'Слив топлива',
      html: h, save: op ? 'Сохранить' : 'Записать',
      onOpen: function (bd) {
        var $ = function (x) { return bd.querySelector(x); };
        function where() { var b = bd.querySelector('#f-where .on'); return b ? b.dataset.w : 'unit'; }
        function preview() {
          var lit = U.num($('#f-liters').value);
          $('#unit-box').style.display = where() === 'unit' ? '' : 'none';
          var was, label;
          if (where() === 'tank') {
            was = CALC.tankState($('#f-date').value).left + (op && !op.unitId ? U.num(op.liters) : 0);
            label = 'На складе было';
          } else {
            var u = $('#f-unit') ? DB.unit($('#f-unit').value) : null;
            if (!u) { $('#preview').innerHTML = ''; return; }
            was = CALC.tankLeft(u, $('#f-date').value).left + (op && op.unitId ? U.num(op.liters) : 0);
            label = 'В баке было';
          }
          var html = V.kv(label, U.liters(was)) + V.kv('Останется', U.liters(was - lit), 'big');
          if (lit > 0 && DB.data.settings.price) {
            html += V.kv('Убыток', '<span style="color:var(--red)">' +
              U.money(lit * DB.data.settings.price) + '</span>');
          }
          $('#preview').innerHTML = html;
        }
        bd.addEventListener('input', preview);
        bd.addEventListener('change', preview);
        bd.addEventListener('click', function (e) {
          var b = e.target.closest('#f-where [data-w]');
          if (!b) return;
          U.$$('#f-where button', bd).forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          preview();
        });
        preview();
        if (!op) setTimeout(function () { $('#f-liters').focus(); }, 380);
      },
      onSave: function (bd) {
        var $ = function (x) { return bd.querySelector(x); };
        var lit = U.num($('#f-liters').value);
        if (lit <= 0) { U.toast('Сколько литров ушло?'); return false; }
        var wb = bd.querySelector('#f-where .on');
        var toTank = wb && wb.dataset.w === 'tank';
        var rec = {
          type: 'drain',
          unitId: toTank ? null : ($('#f-unit') ? $('#f-unit').value : null),
          date: $('#f-date').value || U.today(),
          liters: lit, price: 0, sum: 0, note: $('#f-note').value.trim()
        };
        if (op) { DB.updFuel(op.id, rec); U.toast('Запись изменена'); }
        else { DB.addFuel(rec); U.toast('Слив записан: ' + U.liters(lit)); }
        App.render();
        return true;
      }
    });
  };

  /* ---------- РАБОТА В РЕГЛАМЕНТЕ ---------- */
  F.programForm = function (unitId, programId) {
    var u = DB.unit(unitId);
    if (!u) return;
    var pr = programId ? DB.program(u, programId) : null;
    var d = pr || { name: '', everyWork: '', everyDays: 0 };
    var mi = U.meterInfo(u.meter);

    var h = '<div class="list">' +
      '<div class="field"><label>Название</label><input id="p-name" placeholder="Замена масла" value="' +
      esc(d.name) + '" autocomplete="off"></div>' +

      (d.everyWork || '') + '"><span class="unit">' + esc(mi.unit) + '</span></div>' +

      (d.everyDays || '') + '"><span class="unit">дней</span></div></div>' +
      '<div class="chips">' + [['', 'без срока'], [90, '3 месяца'], [180, 'полгода'], [365, 'год']].map(function (x) {
        return '<button class="chip" data-days="' + x[0] + '">' + x[1] + '</button>';
      }).join('') + '</div>' +
      '<div class="hint">Можно задать оба интервала — тогда срок наступит по тому, что придёт раньше. ' +
      'Так делают и в паспорте техники: «каждые 250 моточасов, но не реже раза в год».</div>' +
      '<div class="card pad" id="preview" style="margin-top:16px"></div>' +
      (pr ? '<button class="btn danger" id="del" style="margin-top:16px">Удалить работу</button>' : '');

    App.sheet({
      title: pr ? 'Работа регламента' : 'Новая работа',
      html: h, save: 'Сохранить',
      onOpen: function (bd) {
        var $ = function (x) { return bd.querySelector(x); };
        function preview() {
          var work = U.num($('#p-work').value), days = U.num($('#p-days').value);
          if (!work && !days) {
            $('#preview').innerHTML = '<div class="hint" style="padding:0">Задайте хотя бы один интервал, ' +
              'иначе напоминать не о чем.</div>';
            return;
          }
          var meterNow = CALC.meterNow(u);
          $('#preview').innerHTML =
            (work ? V.kv('Следующий срок', U.work(meterNow + work, u.meter) + ' по счётчику', 'big') : '') +
            (days ? V.kv(work ? 'или не позже' : 'Следующий срок',
              U.fmtDateFull(U.addDays(U.today(), days))) : '');
        }
        bd.addEventListener('input', preview);
        bd.addEventListener('click', function (e) {
          var c = e.target.closest('[data-days]');
          if (c) {
            $('#p-days').value = c.dataset.days;
            U.$$('[data-days]', bd).forEach(function (x) { x.classList.remove('on'); });
            c.classList.add('on');
            preview();
            return;
          }
          if (e.target.closest('#del')) {
            App.closeSheet();
            setTimeout(function () {
              App.ask({
                title: 'Удалить «' + pr.name + '»?',
                text: 'Записи о выполненных работах останутся в истории.',
                ok: 'Удалить', danger: true,
                onOk: function () { DB.delProgram(u.id, pr.id); U.toast('Работа удалена'); App.render(); }
              });
            }, 320);
          }
        });
        preview();
        if (!pr) setTimeout(function () { $('#p-name').focus(); }, 380);
      },
      onSave: function (bd) {
        var name = bd.querySelector('#p-name').value.trim();
        if (!name) { U.toast('Как называется работа?'); return false; }
        var work = U.num(bd.querySelector('#p-work').value);
        var days = U.num(bd.querySelector('#p-days').value);
        if (!work && !days) { U.toast('Задайте интервал — по наработке или по времени'); return false; }
        var patch = { name: name, everyWork: work, everyDays: days };
        if (pr) DB.updProgram(u.id, pr.id, patch);
        else DB.addProgram(u.id, patch);
        U.toast('Сохранено');
        App.render();
        return true;
      }
    });
  };

              ok: 'Удалить', danger: true,
              onOk: function () {
                if (kind === 'shift') DB.delShift(id);
                else if (kind === 'service') DB.delService(id);
                else DB.delFuel(id);
                U.toast('Запись удалена');
                App.render();
              }
            });
          }, 320);
        });
      }
    });
  };

  /* ---------- действия ---------- */
  var ACTIONS = {
    back: function () { history.length > 1 ? history.back() : App.go('#/'); },
    unit: function (d) { App.go('#/unit/' + d.id); },
    driver: function (d) { App.go('#/driver/' + d.id); },

    'add-menu': function () { F.addMenu(); },
    'new-unit': function () { F.unitForm(); },
    'edit-unit': function (d) { F.unitForm(d.id); },
    'new-driver': function () { F.driverForm(); },
    'edit-driver': function (d) { F.driverForm(d.id); },
    'new-fill': function (d) { F.fillForm(null, d.id || null); },
    'new-shift': function (d) { F.shiftForm(null, d.id || null); },
    'new-check': function (d) { F.checkForm(null, d.id || null); },
    'new-service': function (d) { F.serviceForm(null, d.id || null); },
    'new-intake': function () { F.intakeForm(); },
    'new-drain': function (d) { F.drainForm(null, d.id || null); },
    'new-program': function (d) { F.programForm(d.id); },
    'edit-program': function (d) { F.programForm(d.id, d.pid); },
    'new-tankcheck': function () { F.tankCheckForm(); },

    'op-fuel': function (d) { App.opMenu('fuel', d.id); },
    'op-shift': function (d) { App.opMenu('shift', d.id); },
    'op-service': function (d) { App.opMenu('service', d.id); },

    'del-unit': function (d) {
      var u = DB.unit(d.id);
      if (!u) return;
      var n = CALC.feed(null, u.id).length;
      App.ask({
        title: 'Удалить ' + u.name + '?',
        text: n ? 'Вместе со всеми записями по ней (' + n + '): смены, заправки, ТО. Отменить это будет нельзя.'
          : 'Отменить это будет нельзя.',
        ok: 'Удалить', danger: true,
        onOk: function () { DB.delUnit(d.id); U.toast('Техника удалена'); App.go('#/units'); }
      });
    },
    'del-driver': function (d) {
      var dr = DB.driver(d.id);
      App.ask({
        title: 'Удалить ' + (dr ? dr.name : 'водителя') + '?',
        text: 'Смены и заправки останутся, но будут без водителя.',
        ok: 'Удалить', danger: true,
        onOk: function () { DB.delDriver(d.id); U.toast('Водитель удалён'); App.go('#/drivers'); }
      });
    },

    ufilter: function (d) { V.unitsFilter = d.f; App.render(); },
    lfilter: function (d) { V.logFilter = d.f; V.logLimit = 60; App.render(); },
    'log-more': function () { V.logLimit += 100; App.render(); },
    'go-log': function () { App.go('#/log'); },
    'go-report': function () { App.go('#/report'); },
    'go-tank': function () { App.go('#/tank'); },
    'go-drivers': function () { App.go('#/drivers'); },

    'rep-month': function (d) {
      var cur = V.reportMonth || U.monthKey(U.today());
      var next = U.monthKey(U.addMonths(cur + '-01', +d.d));
      if (next > U.monthKey(U.today())) return;
      V.reportMonth = next;
      App.render();
    },
    'rep-tab': function (d) { V.reportTab = d.t; App.render(); },
    'rep-goto': function (d) { V.reportMonth = d.m; V.reportTab = 'units'; App.render(); },

    demo: function () {
      DB.data = DB.demo();
      DB.save();
      U.toast('Загружен пример: 6 единиц техники за два месяца');
      App.go('#/');
    },
    'demo-off': function () {
      App.ask({
        title: 'Очистить пример?',
        text: 'Демонстрационная техника, смены и заправки будут удалены, приложение станет пустым.',
        ok: 'Очистить',
        onOk: function () { DB.data = DB.empty(); DB.save(); U.toast('Готово — можно заносить своё'); App.go('#/'); }
      });
    },

    'export-json': function () {
      var name = 'avtopark-' + U.today() + '.json';
      App.saveFile(name, DB.exportJSON(), 'application/json', function (ok) {
        if (!ok) return;
        DB.data.settings.lastExport = U.today();
        DB.save();
        U.toast('Копия сохранена: ' + name);
        if (App.route === '#/more' || App.route === '#/') App.render();
      });
    },
    'export-csv': function () {
      App.saveFile('avtopark-toplivo-' + U.today() + '.csv', DB.exportCSV(), 'text/csv;charset=utf-8',
        function (ok) { if (ok) U.toast('Журнал топлива сохранён'); });
    },
    'export-shifts': function () {
      App.saveFile('avtopark-smeny-' + U.today() + '.csv', DB.exportShiftsCSV(), 'text/csv;charset=utf-8',
        function (ok) { if (ok) U.toast('Смены сохранены'); });
    },
    'export-report': function (d) {
      App.saveFile('avtopark-otchet-' + d.from.slice(0, 7) + '.csv', DB.exportReportCSV(d.from, d.to),
        'text/csv;charset=utf-8', function (ok) { if (ok) U.toast('Отчёт сохранён'); });
    },
    import: function () { F.importSheet(); },

    wipe: function () {
      App.ask({
        title: 'Стереть все данные?',
        text: 'Техника, смены, заправки и ТО будут удалены. Восстановить их можно будет только из резервной копии.',
        ok: 'Стереть', danger: true,
        onOk: function () {
          App.ask({
            title: 'Точно стереть?', text: 'Последнее предупреждение.',
            ok: 'Да, стереть', danger: true,
            onOk: function () { DB.data = DB.empty(); DB.save(); U.toast('Все данные стёрты'); App.go('#/'); }
          });
        }
      });
    },
    pin: function () { F.pinSheet(); },
    'pin-off': function () {
      App.ask({
        title: 'Отключить код-пароль?',
        text: 'Приложение будет открываться без кода.',
        ok: 'Отключить',
        onOk: function () { DB.data.settings.pin = null; DB.save(); U.toast('Код отключён'); App.render(); }
      });
    }
  };

  /* вызвать действие по имени — этим пользуется меню «＋» */
  App.run = function (name, data) {
    var f = ACTIONS[name];
    if (f) f(data || {});
  };

  /* ---------- тема ---------- */
  App.applyTheme = function () {
    var t = DB.data.settings.theme || 'auto';
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    var meta = U.$('#theme-color');
    if (meta) {
      var dark = t === 'dark' || (t === 'auto' && w.matchMedia('(prefers-color-scheme:dark)').matches);
      meta.setAttribute('content', dark ? '#000000' : '#f2f2f7');
    }
  };

  /* ---------- экран блокировки ---------- */
  App.lock = function (done) {
    var buf = '';
    var el = document.createElement('div');
    el.className = 'lock';
    el.innerHTML = '<div style="font-size:44px">🔐</div>' +
      '<div style="font-size:19px;font-weight:600">Введите код</div>' +
      '<div class="pin-dots" id="dots"><i></i><i></i><i></i><i></i></div>' +
      '<div class="keypad" style="margin-top:8px">' +
      [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button data-n="' + n + '">' + n + '</button>'; }).join('') +
      '<button class="blank"></button><button data-n="0">0</button>' +
      '<button data-n="del" style="font-size:20px">⌫</button></div>';
    document.body.appendChild(el);

    function draw() {
      U.$$('#dots i', el).forEach(function (d, i) { d.classList.toggle('on', i < buf.length); });
    }
    el.addEventListener('click', function (e) {
      var b = e.target.closest('[data-n]');
      if (!b) return;
      if (b.dataset.n === 'del') { buf = buf.slice(0, -1); draw(); return; }
      if (buf.length >= 4) return;
      buf += b.dataset.n;
      draw();
      if (buf.length === 4) {
        if (App.hash(buf) === DB.data.settings.pin) {
          el.style.opacity = '0';
          el.style.transition = 'opacity .25s';
          setTimeout(function () { el.remove(); }, 260);
          done();
        } else {
          el.classList.add('shake');
          setTimeout(function () { el.classList.remove('shake'); buf = ''; draw(); }, 420);
        }
      }
    });
  };

  /* ---------- старт ---------- */
  App.start = function () {
    DB.load();
    App.applyTheme();

    var run = function () {
      App.render();
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { });
    };

    if (DB.data.settings.pin) App.lock(run);
    else run();

    w.addEventListener('hashchange', App.render);
    w.addEventListener('scroll', App.onScroll, { passive: true });
    var mq = w.matchMedia('(prefers-color-scheme:dark)');
    if (mq.addEventListener) mq.addEventListener('change', App.applyTheme);

    /* сутки могли смениться, пока приложение висело в фоне */
    var day = U.today();
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && U.today() !== day) { day = U.today(); App.render(); }
    });

    /* делегирование кликов */
    document.addEventListener('click', function (e) {
      if (e.target.closest('.sheet')) return;
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var act = ACTIONS[b.dataset.act];
      if (act) { e.preventDefault(); act(b.dataset, b); }
    });

    /* поиск */
    var tmr;
    document.addEventListener('input', function (e) {
      if (e.target.closest('.sheet')) return;
      var t = e.target;
      if (t.id === 'qu' || t.id === 'ql') {
        V[t.id === 'qu' ? 'unitsQuery' : 'logQuery'] = t.value;
        clearTimeout(tmr);
        tmr = setTimeout(function () {
          App.render();
          var i = U.$('#' + t.id);
          if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
        }, 160);
      }
    });

    /* настройки */
    document.addEventListener('change', function (e) {
      if (e.target.closest('.sheet')) return;
      var t = e.target;
      if (!t.dataset || t.dataset.act !== 'set') return;
      var k = t.dataset.k;
      var v = ['price', 'tankVolume', 'serviceWarnPct'].indexOf(k) >= 0 ? U.num(t.value) : t.value;
      if (k === 'currency' && !String(v).trim()) v = 'сум';
      DB.data.settings[k] = v;
      DB.save();
      if (k === 'theme') App.applyTheme();
      U.toast('Сохранено');
      if (['theme', 'currency', 'tankVolume', 'tankName', 'serviceWarnPct'].indexOf(k) >= 0) App.render();
    });
  };

  w.App = App;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', App.start);
  else App.start();
})(window);

['home','units','log','more'].forEach(function(k){
  document.getElementById('i-'+k).innerHTML = V.ICON[k];
});
</script>
</body>
</html>
