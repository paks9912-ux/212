<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Автопарк — техника и ГСМ</title>
<meta name="theme-color" content="#f2f2f7" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Автопарк">
<meta name="format-detection" content="telephone=no">
</head>
<body>
<main id="screen"></main>
<nav class="tabbar">
  <a href="#/"      data-tab="home"><span id="i-home"></span><span>Обзор</span></a>
  <a href="#/units" data-tab="units"><span id="i-units"></span><span>Техника</span></a>
  <a href="#/log"   data-tab="log"><span id="i-log"></span><span>Журнал</span></a>
  <a href="#/more"  data-tab="more"><span id="i-more"></span><span>Ещё</span></a>
</nav>
<div id="toast"></div>

<style>
/* ============================================================
   Автопарк — техника, ГСМ и наработка
   iOS-first PWA. Без внешних зависимостей.
   ============================================================ */

:root{
  --green:#28a745;
  --red:#e5484d;    --orange:#f5a524;
  --blue:#0a84ff;   --violet:#7c5cff;

  --radius:16px;
  --radius-sm:11px;
  --tap:44px;

  --ease:cubic-bezier(.32,.72,0,1);
}

/* ---------- тема: светлая (по умолчанию) ---------- */
:root,
html[data-theme="light"]{
  --bg:#f2f2f7;
  --bg-elev:#ffffff;
  --fill:rgba(120,120,128,.12);
  --fill-2:rgba(120,120,128,.08);
  --text:#000000;
  --text-2:rgba(60,60,67,.6);
  --text-3:rgba(60,60,67,.35);
  --line:rgba(60,60,67,.13);
  --bar:rgba(249,249,251,.82);
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.05);
  --accent:#0a6fd1;
  --accent-soft:rgba(10,111,209,.12);
  --danger-soft:rgba(229,72,77,.12);
  --warn-soft:rgba(245,165,36,.15);
  color-scheme:light;
}

/* ---------- тема: тёмная ---------- */
@media (prefers-color-scheme:dark){
  html:not([data-theme="light"]){
    --bg:#000000;
    --bg-elev:#1c1c1e;
    --fill:rgba(120,120,128,.24);
    --fill-2:rgba(120,120,128,.16);
    --text:#ffffff;
    --text-2:rgba(235,235,245,.6);
    --text-3:rgba(235,235,245,.3);
    --line:rgba(84,84,88,.5);
    --bar:rgba(22,22,24,.8);
    --shadow:none;
    --accent:#0a84ff;
    --accent-soft:rgba(10,132,255,.18);
    --danger-soft:rgba(255,69,58,.18);
    --warn-soft:rgba(255,159,10,.2);
    --red:#ff453a; --orange:#ff9f0a; --violet:#9a7cff;
    color-scheme:dark;
  }
}
html[data-theme="dark"]{
  --bg:#000000;
  --bg-elev:#1c1c1e;
  --fill:rgba(120,120,128,.24);
  --fill-2:rgba(120,120,128,.16);
  --text:#ffffff;
  --text-2:rgba(235,235,245,.6);
  --text-3:rgba(235,235,245,.3);
  --line:rgba(84,84,88,.5);
  --bar:rgba(22,22,24,.8);
  --shadow:none;
  --accent:#0a84ff;
  --accent-soft:rgba(10,132,255,.18);
  --danger-soft:rgba(255,69,58,.18);
  --warn-soft:rgba(255,159,10,.2);
  --red:#ff453a; --orange:#ff9f0a; --violet:#9a7cff;
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font:400 17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;
}
body.no-scroll{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:17px;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;color:var(--accent)}
input,textarea,select{-webkit-appearance:none;appearance:none}
a{color:var(--accent);text-decoration:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- каркас ---------- */
#screen{
  min-height:100%;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
.wrap{padding:0 16px;max-width:640px;margin:0 auto}

.topbar{
  position:sticky;top:0;z-index:40;
  height:calc(48px + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:8px;
  padding-left:8px;padding-right:8px;
  background:transparent;
  transition:background .2s linear;
}
.topbar.solid{
  background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--line);
}
.topbar .tb-title{
  flex:1;text-align:center;font-size:17px;font-weight:600;
  opacity:0;transition:opacity .2s linear;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar.solid .tb-title{opacity:1}
.tb-btn{
  min-width:var(--tap);height:var(--tap);display:flex;align-items:center;
  justify-content:center;gap:3px;font-size:17px;color:var(--accent);
}
.tb-btn.right{justify-content:flex-end;padding-right:8px}
.tb-btn:active{opacity:.4}

h1.big{
  font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.6px;
  margin:2px 0 14px;
}
h2.sec{
  font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;
  color:var(--text-2);margin:26px 4px 8px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
}
h2.sec .act{text-transform:none;letter-spacing:0;color:var(--accent);font-weight:400;font-size:13px;white-space:nowrap}

/* ---------- карточки / списки ---------- */
.card{
  background:var(--bg-elev);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.card + .card{margin-top:12px}
.pad{padding:16px}

.warnbox,.badbox{margin-top:12px}
.warnbox{background:var(--warn-soft)}
.badbox{background:var(--danger-soft)}
.warnbox .t,.badbox .t{font-weight:600;margin-bottom:3px}
.badbox .t{color:var(--red)}
.warnbox .d,.badbox .d{font-size:14px;color:var(--text-2);line-height:1.42;margin-bottom:4px}
.warnbox .d b,.badbox .d b{color:var(--text)}
.btn.full,.btn.sm.full{width:100%;margin-top:12px}

.minilist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.mini{
  display:flex;justify-content:space-between;gap:10px;align-items:center;
  background:var(--bg-elev);border-radius:10px;padding:9px 12px;
  font-size:14px;color:var(--text);width:100%;text-align:left;
}
.mini b{color:var(--red);white-space:nowrap;font-variant-numeric:tabular-nums}
.mini span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini:active{opacity:.6}

.list{background:var(--bg-elev);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.row{
  display:flex;align-items:center;gap:12px;
  min-height:52px;padding:11px 14px;position:relative;
  color:inherit;width:100%;text-align:left;background:none;font-size:17px;
}
.row + .row::before{
  content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line);
}
.row.tap:active{background:var(--fill-2)}
.row .grow{flex:1;min-width:0;display:block}
.row .chev{color:var(--text-3);font-size:15px;flex:none}
.row .ttl{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{display:block;font-size:13px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{text-align:right;flex:none;display:block;max-width:44%}
.row .val .v1{display:block;font-size:17px;font-weight:600;white-space:nowrap}
.row .val .v2{display:block;font-size:12px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.avatar{
  width:38px;height:38px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:#fff;letter-spacing:.2px;
}
.avatar.sq{border-radius:11px;font-size:19px}
.op-ic{
  width:34px;height:34px;border-radius:10px;flex:none;background:var(--fill-2);
  display:flex;align-items:center;justify-content:center;font-size:17px;
}

.unit-head{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.unit-name{font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.15;overflow-wrap:anywhere}
.unit-sub{font-size:13px;color:var(--text-2);margin-top:2px}

/* ---------- сводка ---------- */
.hero{
  background:var(--bg-elev);border-radius:20px;padding:18px 18px 16px;
  box-shadow:var(--shadow);
}
.hero .lbl{font-size:13px;color:var(--text-2)}
.hero .amt{font-size:clamp(26px,8.6vw,38px);font-weight:700;letter-spacing:-1px;line-height:1.1;margin-top:3px;overflow-wrap:anywhere}
.hero .delta{font-size:13px;color:var(--text-2);margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--bg-elev);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:5px}
.stat .v{font-size:clamp(16px,5vw,21px);font-weight:650;letter-spacing:-.3px;margin-top:4px;overflow-wrap:anywhere}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

/* ---------- бейджи / чипы ---------- */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;font-weight:600;padding:3px 8px;border-radius:100px;
  background:var(--fill);color:var(--text-2);white-space:nowrap;
}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.badge.bad{background:var(--danger-soft);color:var(--red)}
.badge.warn{background:var(--warn-soft);color:var(--orange)}

.seg{
  display:flex;background:var(--fill-2);border-radius:9px;padding:2px;gap:2px;margin:0 0 14px;
}
.seg button{
  flex:1;min-height:32px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text);
  display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px;
}
.seg button.on{background:var(--bg-elev);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.seg .cnt{font-size:11px;color:var(--text-2)}

.monthnav{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--fill-2);border-radius:11px;padding:4px 6px;margin-bottom:14px;
}
.monthnav span{font-size:16px;font-weight:600}
.monthnav button{
  width:38px;height:34px;border-radius:8px;font-size:22px;line-height:1;color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.monthnav button:active{background:var(--fill)}
.monthnav button[disabled]{opacity:.25;pointer-events:none}

/* ---------- кнопки ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;border-radius:14px;font-size:17px;font-weight:600;
  background:var(--accent);color:#fff;width:100%;padding:0 14px;white-space:nowrap;
  transition:transform .12s var(--ease),opacity .12s;
}
.btn:active{transform:scale(.975);opacity:.9}
.btn.sec{background:var(--fill);color:var(--text)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--danger-soft);color:var(--red)}
.btn.sm{min-height:40px;font-size:15px;border-radius:11px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1;font-size:16px}

.fab{
  position:fixed;right:16px;z-index:45;
  bottom:calc(74px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:300;line-height:1;
  box-shadow:0 6px 20px rgba(0,0,0,.28);
  transition:transform .15s var(--ease);
}
.fab:active{transform:scale(.9)}

/* ---------- таббар ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);
}
.tabbar a{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;height:52px;color:var(--text-3);font-size:10px;font-weight:500;
}
.tabbar a.on{color:var(--accent)}
.tabbar a:active{opacity:.55}
.tabbar svg{width:25px;height:25px;display:block}

/* ---------- формы ---------- */
.field{
  display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;
  position:relative;background:var(--bg-elev);
}
.field + .field::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line)}
.field label{font-size:17px;flex:none;min-width:112px;color:var(--text)}
.field input,.field select,.field textarea{
  flex:1;min-width:0;border:0;background:transparent;outline:none;
  padding:10px 0;font-size:17px;text-align:right;
}
.field.col{flex-direction:column;align-items:stretch;gap:0;padding:10px 14px}
.field.col label{font-size:13px;color:var(--text-2);margin-bottom:2px;min-width:0}
.field.col input,.field.col textarea{text-align:left;padding:4px 0}
.field textarea{resize:none;min-height:60px;line-height:1.35}
.field select{
  text-align:right;color:var(--text);padding-right:17px;
  background:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 16'%3E%3Cpath d='M2 6l3-3 3 3M2 10l3 3 3-3' fill='none' stroke='%23999' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right center/9px 15px;
}
.field .unit{color:var(--text-2);font-size:15px;flex:none}
.field input::placeholder,.field textarea::placeholder{color:var(--text-3)}
.field input.cb{flex:none;width:auto;-webkit-appearance:checkbox;appearance:checkbox;transform:scale(1.3)}
.hint{font-size:12.5px;color:var(--text-2);padding:8px 6px 0;line-height:1.45}
.hint b{color:var(--text);font-weight:600}

.search{
  display:flex;align-items:center;gap:7px;background:var(--fill-2);
  border-radius:10px;padding:0 10px;height:38px;margin-bottom:14px;
}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:17px;min-width:0}
.search svg{width:16px;height:16px;color:var(--text-3);flex:none}

/* ---------- модальный лист ---------- */
.sheet-bg{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.42);
  opacity:0;transition:opacity .3s var(--ease);
}
.sheet-bg.in{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  max-height:92vh;display:flex;flex-direction:column;
  background:var(--bg);border-radius:14px 14px 0 0;
  transform:translateY(100%);transition:transform .34s var(--ease);
  padding-bottom:env(safe-area-inset-bottom);
  max-width:640px;margin:0 auto;
  box-shadow:0 -8px 40px rgba(0,0,0,.3);
}
.sheet.in{transform:translateY(0)}
.sheet-hd{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-bottom:.5px solid var(--line);flex:none;
}
.sheet-hd .t{font-size:17px;font-weight:600;flex:1;text-align:center}
.sheet-hd button{font-size:17px;min-width:64px}
.sheet-hd button.strong{font-weight:600;text-align:right}
.sheet-bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;flex:1}
.sheet-bd h2.sec:first-child{margin-top:6px}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:7px auto 0;flex:none}

/* ---------- всплывающее уведомление ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);z-index:90;
  background:rgba(30,30,32,.95);color:#fff;font-size:14.5px;font-weight:500;
  padding:11px 18px;border-radius:100px;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
#toast.in{opacity:1;transform:translate(-50%,0)}

/* ---------- служебное ---------- */
.empty{text-align:center;padding:46px 26px;color:var(--text-2)}
.empty .ic{font-size:44px;margin-bottom:10px;opacity:.5}
.empty .t{font-size:17px;font-weight:600;color:var(--text);margin-bottom:5px}
.empty .d{font-size:14px;line-height:1.45}

.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .4s var(--ease)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:15px}
.kv + .kv{border-top:.5px solid var(--line)}
.kv .k{color:var(--text-2);flex:none;max-width:52%}
.kv .v{font-weight:600;text-align:right;overflow-wrap:anywhere}
.kv.big .v{font-size:19px}

.lock{
  position:fixed;inset:0;z-index:100;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
}
.pin-dots{display:flex;gap:16px}
.pin-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--text-2)}
.pin-dots i.on{background:var(--text);border-color:var(--text)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:18px;justify-content:center}
.keypad button{
  width:72px;height:72px;border-radius:50%;background:var(--fill-2);
  font-size:28px;font-weight:400;color:var(--text);
  display:flex;align-items:center;justify-content:center;
}
.keypad button:active{background:var(--fill)}
.keypad button.blank{background:none;pointer-events:none}
.shake{animation:shake .4s}
@keyframes shake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
}
.fade{animation:fade .22s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

/* ---------- диалог подтверждения ---------- */
.ask-bg{
  position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;padding:28px;
  opacity:0;transition:opacity .2s ease;
}
.ask-bg.in{opacity:1}
.ask{
  width:100%;max-width:290px;background:var(--bg-elev);border-radius:15px;
  overflow:hidden;text-align:center;
  transform:scale(.92);transition:transform .22s var(--ease);
  box-shadow:0 12px 44px rgba(0,0,0,.3);
}
.ask-bg.in .ask{transform:scale(1)}
.ask .ask-t{font-size:17px;font-weight:600;padding:20px 18px 0}
.ask .ask-d{font-size:13.5px;color:var(--text-2);line-height:1.4;padding:6px 18px 18px}
.ask .ask-btns{display:flex;border-top:.5px solid var(--line)}
.ask .ask-btns button{
  flex:1;min-height:46px;font-size:17px;color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.ask .ask-btns button + button{border-left:.5px solid var(--line)}
.ask .ask-btns button.danger{color:var(--red);font-weight:600}
.ask .ask-btns button:active{background:var(--fill-2)}

/* ---------- график уровня топлива ---------- */
.chart svg{display:block;width:100%;height:108px}
.chart-x{
  display:flex;justify-content:space-between;gap:8px;
  font-size:11px;color:var(--text-3);margin-top:2px;
}
.chart-legend{
  display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;
  font-size:11.5px;color:var(--text-2);
}
.chart-legend span{display:flex;align-items:center;gap:5px}
.chart-legend i{display:block;flex:none}
.chart-legend i.ln{width:12px;height:2px;border-radius:2px;background:var(--accent)}
.chart-legend i.pt{width:7px;height:7px;border-radius:50%;border:1.6px solid var(--accent);background:var(--bg-elev)}

<script>
/* Утилиты: числа, литры, наработка, даты, DOM-хелперы */
(function (w) {
  'use strict';

  var U = {};

  /* ---------- id ---------- */
  U.uid = function () {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  };

  /* ---------- экранирование ---------- */
  U.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };

  /* ---------- числа ---------- */
  U.num = function (v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    var s = String(v == null ? '' : v).replace(/\s| /g, '').replace(',', '.').replace(/[^\d.\-]/g, '');
    var n = parseFloat(s);
    return isFinite(n) ? n : 0;
  };

  var nf0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
  var nf1 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  var nf2 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  /* число с нужной точностью: 12.5 → «12,5» */
  U.dec = function (v, digits) {
    var n = U.num(v);
    if (digits === 2) return nf2.format(n);
    if (digits === 1 || (digits == null && Math.round(n) !== n)) return nf1.format(n);
    return nf0.format(Math.round(n));
  };

  /* ---------- деньги ---------- */
  U.cur = function () {
    return (w.DB && DB.data && DB.data.settings && DB.data.settings.currency) || 'сум';
  };
  U.money = function (v, opt) {
    opt = opt || {};
    var n = U.num(v), sign = n < 0 ? '−' : '', abs = Math.abs(n);
    var body = opt.exact ? nf2.format(abs) : nf0.format(Math.round(abs));
    return sign + body + (opt.noCur ? '' : ' ' + U.cur());
  };
  U.moneyShort = function (v) {
    var n = Math.abs(U.num(v)), s = U.num(v) < 0 ? '−' : '', sym = ' ' + U.cur();
    if (n >= 1e9) return s + nf1.format(n / 1e9) + ' млрд' + sym;
    if (n >= 1e6) return s + nf1.format(n / 1e6) + ' млн' + sym;
    if (n >= 1e5) return s + nf0.format(Math.round(n / 1e3)) + ' тыс' + sym;
    return s + nf0.format(Math.round(n)) + sym;
  };

  /* ---------- топливо и наработка ---------- */
  U.liters = function (v, opt) {
    opt = opt || {};
    var n = U.num(v), sign = n < 0 ? '−' : (opt.sign && n > 0 ? '+' : '');
    return sign + U.dec(Math.abs(n), Math.abs(n) < 100 && Math.round(n) !== n ? 1 : 0) + (opt.noUnit ? '' : ' л');
  };

  /* единица наработки: моточасы или километры */
  U.METER = {
    hours: { unit: 'м·ч', long: 'моточасы', one: 'моточас', few: 'моточаса', many: 'моточасов', norm: 'л/м·ч' },
    km: { unit: 'км', long: 'километры', one: 'километр', few: 'километра', many: 'километров', norm: 'л/100 км' }
  };
  U.meterInfo = function (m) { return U.METER[m] || U.METER.hours; };
  U.work = function (v, meter, opt) {
    opt = opt || {};
    var i = U.meterInfo(meter), n = U.num(v);
    return U.dec(n, meter === 'km' ? 0 : (Math.abs(n) < 1000 && Math.round(n) !== n ? 1 : 0)) +
      (opt.noUnit ? '' : ' ' + i.unit);
  };
  U.normText = function (v, meter) {
    return U.dec(v, 1) + ' ' + U.meterInfo(meter).norm;
  };

  /* ---------- склонение ---------- */
  U.plural = function (n, one, few, many) {
    n = Math.abs(Math.round(n)) % 100;
    var n1 = n % 10;
    if (n > 10 && n < 20) return many;
    if (n1 > 1 && n1 < 5) return few;
    if (n1 === 1) return one;
    return many;
  };
  U.days = function (n) { return Math.round(n) + ' ' + U.plural(n, 'день', 'дня', 'дней'); };
  U.cnt = function (n, one, few, many) { return n + ' ' + U.plural(n, one, few, many); };

  /* ---------- даты (хранятся как 'YYYY-MM-DD') ---------- */
  U.today = function () { return U.iso(new Date()); };
  U.iso = function (d) {
    var m = String(d.getMonth() + 1), day = String(d.getDate());
    return d.getFullYear() + '-' + (m.length < 2 ? '0' + m : m) + '-' + (day.length < 2 ? '0' + day : day);
  };
  U.parse = function (s) {
    if (!s) return null;
    var p = String(s).slice(0, 10).split('-');
    if (p.length !== 3) return null;
    return Date.UTC(+p[0], +p[1] - 1, +p[2]);
  };
  U.diffDays = function (a, b) {                       // b − a, в днях
    var x = U.parse(a), y = U.parse(b);
    if (x == null || y == null) return 0;
    return Math.round((y - x) / 86400000);
  };
  U.addDays = function (s, n) {
    var t = U.parse(s);
    if (t == null) return s;
    var d = new Date(t + n * 86400000);
    return d.getUTCFullYear() + '-' +
      String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(d.getUTCDate()).padStart(2, '0');
  };
  U.addMonths = function (s, n) {
    var t = U.parse(s);
    if (t == null) return s;
    var d = new Date(t), day = d.getUTCDate();
    d.setUTCMonth(d.getUTCMonth() + n);
    if (d.getUTCDate() < day) d.setUTCDate(0);
    return d.getUTCFullYear() + '-' +
      String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(d.getUTCDate()).padStart(2, '0');
  };
  U.monthStart = function (s) { return String(s).slice(0, 7) + '-01'; };
  U.monthEnd = function (s) { return U.addDays(U.addMonths(U.monthStart(s), 1), -1); };

  var MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  var MONF = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var MONN = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];

  U.fmtDate = function (s, full) {
    var t = U.parse(s);
    if (t == null) return '—';
    var d = new Date(t), cy = new Date().getFullYear();
    var out = d.getUTCDate() + ' ' + (full ? MONF : MON)[d.getUTCMonth()];
    if (d.getUTCFullYear() !== cy) out += ' ' + d.getUTCFullYear();
    return out;
  };
  U.fmtDateFull = function (s) {
    var t = U.parse(s);
    if (t == null) return '—';
    var d = new Date(t);
    return d.getUTCDate() + ' ' + MONF[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
  };
  U.relDate = function (s) {
    var n = U.diffDays(U.today(), s);
    if (n === 0) return 'сегодня';
    if (n === 1) return 'завтра';
    if (n === -1) return 'вчера';
    if (n > 1 && n < 30) return 'через ' + U.days(n);
    if (n < -1 && n > -30) return U.days(-n) + ' назад';
    return U.fmtDate(s);
  };
  U.monthKey = function (s) { return String(s).slice(0, 7); };
  U.monthName = function (key, short) {
    var p = String(key).split('-');
    var n = MONN[+p[1] - 1] || '';
    n = n.charAt(0).toUpperCase() + n.slice(1);
    return short ? n : n + ' ' + p[0];
  };

  /* ---------- DOM ---------- */
  U.$ = function (sel, root) { return (root || document).querySelector(sel); };
  U.$$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  U.toast = function (msg) {
    var t = U.$('#toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('in');
    clearTimeout(U._tt);
    U._tt = setTimeout(function () { t.classList.remove('in'); }, 2300);
  };

  /* цвет плашки по названию — стабильный */
  var PALETTE = ['#0a84ff', '#30d158', '#ff9f0a', '#ff453a', '#bf5af2', '#64d2ff', '#ffd60a', '#ff375f', '#5e5ce6', '#66d4cf'];
  U.color = function (str) {
    var h = 0, s = String(str || '?');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  };
  U.initials = function (name) {
    var p = String(name || '?').trim().split(/\s+/);
    return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase();
  };
  U.telHref = function (phone) { return 'tel:' + String(phone || '').replace(/[^\d+]/g, ''); };
  U.waHref = function (phone) {
    var d = String(phone || '').replace(/\D/g, '');
    if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1);
    return 'https://wa.me/' + d;
  };

  w.U = U;
})(window);

/* Хранилище: всё лежит на телефоне (localStorage), ничего не уходит в сеть */
(function (w) {
  'use strict';

  var KEY = 'fleet.db.v1';
  var BAK = 'fleet.autobackup';

  var DB = {
    data: null,
    listeners: [],

    /* виды топлива и типы техники — справочники */
    FUELS: ['ДТ', 'АИ-80', 'АИ-92', 'АИ-95', 'газ'],
    KINDS: [
      { k: 'excavator', n: 'Экскаватор', ic: '🚜', meter: 'hours' },
      { k: 'loader', n: 'Погрузчик', ic: '🚜', meter: 'hours' },
      { k: 'dozer', n: 'Бульдозер', ic: '🚜', meter: 'hours' },
      { k: 'crane', n: 'Кран', ic: '🏗️', meter: 'km' },
      { k: 'truck', n: 'Самосвал', ic: '🚛', meter: 'km' },
      { k: 'car', n: 'Легковая', ic: '🚙', meter: 'km' },
      { k: 'genset', n: 'Генератор', ic: '⚡', meter: 'hours' },
      { k: 'other', n: 'Другое', ic: '🔧', meter: 'hours' }
    ],
    kind: function (k) {
      var f = this.KINDS.filter(function (x) { return x.k === k; })[0];
      return f || this.KINDS[this.KINDS.length - 1];
    },

    empty: function () {
      return {
        version: 2,
        createdAt: U.today(),
        isDemo: false,
        settings: {
          currency: 'сум',
          theme: 'auto',
          fuel: 'ДТ',              // вид топлива по умолчанию
          price: 0,                // последняя цена за литр — подставляется в форму
          tankName: 'Топливозаправщик',
          tankVolume: 0,           // объём ёмкости склада, л (0 — не задан)
          serviceWarnPct: 10,      // предупреждать, когда до ТО осталось меньше этой доли
          pin: null,
          lastExport: null
        },
        units: [],      // техника
        drivers: [],    // водители и машинисты
        shifts: [],     // смены (путевые листы)
        fuel: [],       // журнал топлива: приход, выдача, замеры
        services: []    // ТО и ремонты
      };
    },

    load: function () {
      var raw = null;
      try { raw = localStorage.getItem(KEY); } catch (e) { }
      if (!raw) { this.data = this.empty(); return false; }
      try {
        this.data = this.migrate(JSON.parse(raw));
        return true;
      } catch (e) {
        try {
          var b = localStorage.getItem(BAK);
          if (b) { this.data = this.migrate(JSON.parse(b)); U.toast('Данные восстановлены из копии'); return true; }
        } catch (e2) { }
        this.data = this.empty();
        return false;
      }
    },

    migrate: function (d) {
      d = d || {};
      var base = this.empty();
      d.settings = Object.assign(base.settings, d.settings || {});
      d.isDemo = !!d.isDemo;
      ['units', 'drivers', 'shifts', 'fuel', 'services'].forEach(function (k) {
        d[k] = Array.isArray(d[k]) ? d[k] : [];
      });
      d.units.forEach(function (u) { DB.normUnit(u); });
      d.services.forEach(function (s) {
        if (s.kind === 'to' && !s.programId) s.programId = 'to';
      });
      d.fuel.forEach(function (f) {
        if (!f.type) f.type = 'fill';
        f.liters = U.num(f.liters);
        if (f.sum == null) f.sum = U.num(f.liters) * U.num(f.price);
      });
      d.version = 2;
      return d;
    },

    /* Приводим единицу техники в порядок: числа числами, регламент списком.
       Поле «ТО каждые N» в форме — это первая работа регламента с id 'to',
       поэтому держим их синхронными в обе стороны.                        */
    normUnit: function (u) {
      if (!u) return u;
      if (!u.meter) u.meter = 'hours';
      if (u.active == null) u.active = true;
      u.norm = U.num(u.norm);
      u.tank = U.num(u.tank);
      if (!Array.isArray(u.programs)) u.programs = [];
      u.programs.forEach(function (pr) {
        pr.id = pr.id || U.uid();
        pr.everyWork = U.num(pr.everyWork);
        pr.everyDays = U.num(pr.everyDays);
      });
      var every = U.num(u.serviceEvery);
      var to = u.programs.filter(function (p) { return p.id === 'to'; })[0];
      if (every > 0) {
        if (to) to.everyWork = every;
        else u.programs.unshift({ id: 'to', name: 'ТО по регламенту', everyWork: every, everyDays: 0 });
      } else if (to && !to.everyDays) {
        u.programs = u.programs.filter(function (p) { return p.id !== 'to'; });
      }
      return u;
    },

    /* ---------- регламенты обслуживания ---------- */
    programs: function (u) { return (u && u.programs) || []; },
    program: function (u, id) {
      return this.programs(u).filter(function (p) { return p.id === id; })[0] || null;
    },
    addProgram: function (unitId, pr) {
      var u = this.unit(unitId);
      if (!u) return null;
      if (!Array.isArray(u.programs)) u.programs = [];
      pr.id = pr.id || U.uid();
      pr.everyWork = U.num(pr.everyWork);
      pr.everyDays = U.num(pr.everyDays);
      u.programs.push(pr);
      this.syncEvery(u);
      this.save();
      return pr;
    },
    updProgram: function (unitId, id, patch) {
      var pr = this.program(this.unit(unitId), id);
      if (pr) {
        Object.assign(pr, patch);
        pr.everyWork = U.num(pr.everyWork);
        pr.everyDays = U.num(pr.everyDays);
        this.syncEvery(this.unit(unitId));
        this.save();
      }
      return pr;
    },
    delProgram: function (unitId, id) {
      var u = this.unit(unitId);
      if (!u) return;
      u.programs = this.programs(u).filter(function (p) { return p.id !== id; });
      this.data.services.forEach(function (s) { if (s.programId === id) s.programId = null; });
      this.syncEvery(u);
      this.save();
    },

    save: function () {
      try {
        var json = JSON.stringify(this.data);
        localStorage.setItem(KEY, json);
        try { localStorage.setItem(BAK, json); } catch (e) { }
        if (w.CALC) CALC.clearCache();
      } catch (e) {
        U.toast('Не удалось сохранить: нет места в памяти');
        return false;
      }
      this.listeners.forEach(function (f) { try { f(); } catch (e) { } });
      return true;
    },

    onChange: function (f) { this.listeners.push(f); },

    /* ---------- техника ---------- */
    units: function () { return this.data.units; },
    unit: function (id) { return this.data.units.filter(function (u) { return u.id === id; })[0] || null; },
    unitByName: function (name) {
      var n = String(name || '').trim().toLowerCase();
      return this.data.units.filter(function (u) {
        return u.name.trim().toLowerCase() === n || String(u.plate || '').trim().toLowerCase() === n;
      })[0] || null;
    },
    addUnit: function (u) {
      u.id = u.id || U.uid();
      u.createdAt = u.createdAt || U.today();
      this.normUnit(u);
      this.data.units.push(u);
      this.save();
      return u;
    },
    updUnit: function (id, patch) {
      var u = this.unit(id);
      if (u) { Object.assign(u, patch); this.normUnit(u); this.save(); }
      return u;
    },
    delUnit: function (id) {
      this.data.units = this.data.units.filter(function (u) { return u.id !== id; });
      this.data.shifts = this.data.shifts.filter(function (s) { return s.unitId !== id; });
      this.data.fuel = this.data.fuel.filter(function (f) { return f.unitId !== id; });
      this.data.services = this.data.services.filter(function (s) { return s.unitId !== id; });
      this.save();
    },

    syncEvery: function (u) {
      if (!u) return;
      var to = this.programs(u).filter(function (p) { return p.id === 'to'; })[0];
      u.serviceEvery = to ? U.num(to.everyWork) : 0;
    },

    /* ---------- водители ---------- */
    drivers: function () { return this.data.drivers; },
    driver: function (id) { return this.data.drivers.filter(function (d) { return d.id === id; })[0] || null; },
    driverName: function (id) { var d = this.driver(id); return d ? d.name : ''; },
    driverByName: function (name) {
      var n = String(name || '').trim().toLowerCase();
      return this.data.drivers.filter(function (d) { return d.name.trim().toLowerCase() === n; })[0] || null;
    },
    addDriver: function (d) {
      d.id = d.id || U.uid();
      d.createdAt = d.createdAt || U.today();
      this.data.drivers.push(d);
      this.save();
      return d;
    },
    updDriver: function (id, patch) {
      var d = this.driver(id);
      if (d) { Object.assign(d, patch); this.save(); }
      return d;
    },
    delDriver: function (id) {
      this.data.drivers = this.data.drivers.filter(function (d) { return d.id !== id; });
      this.data.shifts.forEach(function (s) { if (s.driverId === id) s.driverId = null; });
      this.data.fuel.forEach(function (f) { if (f.driverId === id) f.driverId = null; });
      this.save();
    },

    /* ---------- смены ---------- */
    shifts: function () { return this.data.shifts; },
    shift: function (id) { return this.data.shifts.filter(function (s) { return s.id === id; })[0] || null; },
    addShift: function (s) {
      s.id = s.id || U.uid();
      s.date = s.date || U.today();
      this.data.shifts.push(s);
      this.sortAll();
      this.save();
      return s;
    },
    updShift: function (id, patch) {
      var s = this.shift(id);
      if (s) { Object.assign(s, patch); this.sortAll(); this.save(); }
      return s;
    },
    delShift: function (id) {
      this.data.shifts = this.data.shifts.filter(function (s) { return s.id !== id; });
      this.save();
    },

    /* ---------- топливо ---------- */
    fuelOps: function () { return this.data.fuel; },
    fuelOp: function (id) { return this.data.fuel.filter(function (f) { return f.id === id; })[0] || null; },
    addFuel: function (f) {
      f.id = f.id || U.uid();
      f.date = f.date || U.today();
      f.type = f.type || 'fill';
      f.liters = U.num(f.liters);
      f.sum = f.sum != null ? U.num(f.sum) : U.num(f.liters) * U.num(f.price);
      this.data.fuel.push(f);
      this.sortAll();
      if (f.type === 'fill' && U.num(f.price) > 0) this.data.settings.price = U.num(f.price);
      this.save();
      return f;
    },
    updFuel: function (id, patch) {
      var f = this.fuelOp(id);
      if (f) {
        Object.assign(f, patch);
        f.sum = patch.sum != null ? U.num(patch.sum) : U.num(f.liters) * U.num(f.price);
        this.sortAll();
        this.save();
      }
      return f;
    },
    delFuel: function (id) {
      this.data.fuel = this.data.fuel.filter(function (f) { return f.id !== id; });
      this.save();
    },

    /* ---------- ТО и ремонты ---------- */
    services: function () { return this.data.services; },
    service: function (id) { return this.data.services.filter(function (s) { return s.id === id; })[0] || null; },
    addService: function (s) {
      s.id = s.id || U.uid();
      s.date = s.date || U.today();
      s.kind = s.kind || 'to';
      this.data.services.push(s);
      this.sortAll();
      this.save();
      return s;
    },
    updService: function (id, patch) {
      var s = this.service(id);
      if (s) { Object.assign(s, patch); this.sortAll(); this.save(); }
      return s;
    },
    delService: function (id) {
      this.data.services = this.data.services.filter(function (s) { return s.id !== id; });
      this.save();
    },

    /* журналы держим отсортированными по дате — на них опираются расчёты */
    sortAll: function () {
      var by = function (a, b) {
        if (a.date !== b.date) return a.date < b.date ? -1 : 1;
        return (a.id || '') < (b.id || '') ? -1 : 1;
      };
      this.data.shifts.sort(by);
      this.data.fuel.sort(by);
      this.data.services.sort(by);
    },

    /* объекты, которые уже встречались — для подсказок в форме */
    sites: function () {
      var seen = {}, out = [];
      this.data.shifts.forEach(function (s) {
        var v = String(s.site || '').trim();
        if (v && !seen[v.toLowerCase()]) { seen[v.toLowerCase()] = 1; out.push(v); }
      });
      return out.sort(function (a, b) { return a.localeCompare(b, 'ru'); });

    /* ---------- экспорт / импорт ---------- */
    exportJSON: function () { return JSON.stringify(this.data, null, 2); },

    importJSON: function (text, mode) {
      var d = JSON.parse(text);
      if (!d || !Array.isArray(d.units)) throw new Error('Не похоже на резервную копию «Автопарка»');
      d = this.migrate(d);
      if (mode === 'replace') {
        this.data = d;
      } else {
        var self = this, umap = {}, dmap = {};
        d.drivers.forEach(function (dr) {
          var ex = self.driverByName(dr.name);
          if (ex) { dmap[dr.id] = ex.id; return; }
          var nid = U.uid();
          dmap[dr.id] = nid;
          self.data.drivers.push(Object.assign({}, dr, { id: nid }));
        });
        d.units.forEach(function (u) {
          var ex = self.unitByName(u.plate || u.name) || self.unitByName(u.name);
          if (ex) { umap[u.id] = ex.id; return; }
          var nid = U.uid();
          umap[u.id] = nid;
          self.data.units.push(Object.assign({}, u, { id: nid, driverId: dmap[u.driverId] || null }));
        });
        var have = {};
        var key = function (x, extra) { return x.date + '|' + (umap[x.unitId] || x.unitId) + '|' + extra; };
        this.data.shifts.forEach(function (s) { have['s' + key(s, s.work || (s.end - s.start))] = 1; });
        this.data.fuel.forEach(function (f) { have['f' + key(f, f.type + f.liters)] = 1; });
        this.data.services.forEach(function (s) { have['t' + key(s, s.kind + s.meter)] = 1; });

        d.shifts.forEach(function (s) {
          if (have['s' + key(s, s.work || (s.end - s.start))]) return;
          self.data.shifts.push(Object.assign({}, s, { id: U.uid(), unitId: umap[s.unitId] || s.unitId, driverId: dmap[s.driverId] || null }));
        });
        d.fuel.forEach(function (f) {
          if (have['f' + key(f, f.type + f.liters)]) return;
          self.data.fuel.push(Object.assign({}, f, { id: U.uid(), unitId: umap[f.unitId] || f.unitId, driverId: dmap[f.driverId] || null }));
        });
        d.services.forEach(function (s) {
          if (have['t' + key(s, s.kind + s.meter)]) return;
          self.data.services.push(Object.assign({}, s, { id: U.uid(), unitId: umap[s.unitId] || s.unitId }));
        });
      }
      this.sortAll();
      this.save();
      return { units: this.data.units.length, fuel: this.data.fuel.length, shifts: this.data.shifts.length };
    },

    /* ---------- выгрузка из телематики ----------
       Wialon, Omnicomm, заводские КОМТРАКС/LiveLink и прочие отдают отчёт
       «по дням»: счётчик, уровень в баке, заправки, сливы. Колонки у всех
       называются по-разному, поэтому ищем их по смыслу заголовка.        */
    TELEMETRY_COLS: [
      ['date', /дата|date|сутки|день|период/],
      ['unit', /техник|машин|объект|транспорт|unit|name|наименован|госномер|номер/],
      ['meter', /моточас|мото.?час|пробег|наработ|счётчик|счетчик|odometer|mileage|hours|engine/],
      ['level', /уровень|остаток|конец.*бак|бак.*конец|level|fuel.?end/],
      ['fill', /заправ|залито|fill|refuel/],
      ['drain', /слив|слито|утечк|хищен|drain|theft/]
    ],

    /* какая колонка за что отвечает — по заголовку таблицы */
    telemetryMap: function (head) {
      var map = {};
      this.TELEMETRY_COLS.forEach(function (pair) {
        head.forEach(function (h, i) {
          if (map[pair[0]] != null) return;
          if (pair[1].test(String(h).toLowerCase())) map[pair[0]] = i;
        });
      });
      return map;
    },

    /* rows — уже разобранные строки, map — результат telemetryMap */
    importTelemetry: function (rows, map, opt) {
      opt = opt || {};
      var self = this;
      var res = { kind: 'telemetry', units: 0, shifts: 0, fills: 0, checks: 0, drains: 0, skipped: 0 };
      if (map.date == null || map.unit == null) throw new Error('Не нашёл колонки «Дата» и «Техника»');

      /* сначала по технике и датам, иначе наработка посчитается задом наперёд */
      var parsed = [];
      rows.forEach(function (c) {
        var date = self.parseDate(c[map.date]);
        var name = String(c[map.unit] || '').trim();
        if (!date || !name) { res.skipped++; return; }
        parsed.push({ date: date, name: name, row: c });
      });
      parsed.sort(function (a, b) {
        if (a.name !== b.name) return a.name < b.name ? -1 : 1;
        return a.date < b.date ? -1 : 1;
      });

      /* что уже есть — чтобы повторная загрузка того же файла не плодила дубли */
      var have = {};
      this.data.shifts.forEach(function (x) { have['s' + x.unitId + x.date] = 1; });
      this.data.fuel.forEach(function (x) { have[x.type[0] + x.unitId + x.date] = 1; });

      var prevMeter = {};
      parsed.forEach(function (p) {
        var c = p.row;
        var u = self.unitByName(p.name);
        if (!u) {
          u = self.addUnit({
            name: p.name, meter: opt.meter || 'hours', norm: 0, kind: 'other',
            fuel: self.data.settings.fuel, meterStart: map.meter != null ? U.num(c[map.meter]) : 0
          });
          res.units++;
        }
        var num = function (i) { return i != null && c[i] != null && c[i] !== '' ? U.num(c[i]) : null; };

        /* наработка — разница показаний счётчика между строками */
        var meter = num(map.meter);
        if (meter != null) {
          var prev = prevMeter[u.id];
          if (prev == null) prev = U.num(u.meterStart) || meter;
          var work = meter - prev;
          if (work > 0 && !have['s' + u.id + p.date]) {
            self.data.shifts.push({
              id: U.uid(), unitId: u.id, driverId: u.driverId || null, date: p.date,
              start: prev, end: meter, site: '', note: 'из телематики', src: 'telemetry'
            });
            have['s' + u.id + p.date] = 1;
            res.shifts++;
          }
          prevMeter[u.id] = meter;
        }

        var lit = num(map.fill);
        if (lit && lit > 0 && !have['f' + u.id + p.date]) {
          self.data.fuel.push({
            id: U.uid(), type: 'fill', unitId: u.id, driverId: u.driverId || null, date: p.date,
            liters: lit, price: U.num(self.data.settings.price),
            sum: lit * U.num(self.data.settings.price),
            source: opt.source === 'azs' ? 'azs' : 'tank',
            meter: meter, fuel: u.fuel || self.data.settings.fuel,
            note: 'из телематики', src: 'telemetry'
          });
          have['f' + u.id + p.date] = 1;
          res.fills++;
        }

        var dr = num(map.drain);
        if (dr && dr > 0 && !have['d' + u.id + p.date]) {
          self.data.fuel.push({
            id: U.uid(), type: 'drain', unitId: u.id, date: p.date,
            liters: dr, price: 0, sum: 0, note: 'слив по датчику', src: 'telemetry'
          });
          have['d' + u.id + p.date] = 1;
          res.drains++;
        }

        /* уровень в баке — это тот же замер, только его снял датчик, а не человек */
        var lvl = num(map.level);
        if (lvl != null && !have['c' + u.id + p.date]) {
          self.data.fuel.push({
            id: U.uid(), type: 'check', unitId: u.id, date: p.date,
            liters: lvl, price: 0, sum: 0, meter: meter,
            note: 'уровень по датчику', src: 'telemetry'
          });
          have['c' + u.id + p.date] = 1;
          res.checks++;
        }
      });

      this.sortAll();
      this.save();
      return res;
    },

    /* CSV: две таблицы, различаются по заголовку.
       Техника:  Название;Госномер;Тип;Счётчик;Норма;Бак;Топливо;ТО через
       Заправки: Дата;Техника;Водитель;Литры;Цена;Счётчик;Заметка          */
    importCSV: function (text, opt) {
      var lines = String(text).replace(/^﻿/, '').split(/\r?\n/).filter(function (s) { return s.trim(); });
      if (!lines.length) throw new Error('Пустой файл');
      var sep = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
      var head = lines[0].toLowerCase();
      var cut = function (line) {
        return line.split(sep).map(function (s) { return s.trim().replace(/^"|"$/g, ''); });
      };

      /* выгрузка из телематики: там есть уровень в баке, слив или счётчик по дням */
      if (/уровень|остаток|слив|моточас|пробег|наработ/.test(head) && !/норма/.test(head)) {
        var map = this.telemetryMap(cut(lines[0]));
        if (map.date != null && map.unit != null && (map.meter != null || map.level != null)) {
          return this.importTelemetry(lines.slice(1).map(cut), map, opt);
        }
      }

      var isFuel = /литр|дата|заправ/.test(head) && !/норма/.test(head);
      var start = /назван|госномер|дата|литр|техник/.test(head) ? 1 : 0;
      var self = this, added = 0;

      for (var i = start; i < lines.length; i++) {
        var c = cut(lines[i]);
        if (!c[0]) continue;

        if (isFuel) {
          /* Дата;Техника;Водитель;Литров;Цена;Счётчик;Заметка */
          var date = self.parseDate(c[0]);
          if (!date) continue;
          var un = self.unitByName(c[1]);
          if (!un) {
            if (!c[1]) continue;
            un = self.addUnit({ name: c[1], meter: 'hours', norm: 0, kind: 'other', fuel: self.data.settings.fuel });
          }
          var dr = null;
          if (c[2]) dr = self.driverByName(c[2]) || self.addDriver({ name: c[2], phone: '' });
          var lit = U.num(c[3]);
          if (!lit) continue;
          self.addFuel({
            type: 'fill', date: date, unitId: un.id, driverId: dr ? dr.id : null,
            liters: lit, price: U.num(c[4]), meter: c[5] ? U.num(c[5]) : null,
            source: 'azs', fuel: un.fuel || self.data.settings.fuel, note: c[6] || ''
          });
          added++;
        } else {
          /* Название;Госномер;Тип;Счётчик;Норма;Бак;Топливо;ТО через */
          if (self.unitByName(c[0])) continue;
          var meter = /км|km|пробег/i.test(c[3] || '') ? 'km' : 'hours';
          var kind = self.KINDS.filter(function (k) {
            return c[2] && k.n.toLowerCase().indexOf(String(c[2]).toLowerCase().slice(0, 5)) === 0;
          })[0];
          self.addUnit({
            name: c[0], plate: c[1] || '', kind: kind ? kind.k : 'other',
            meter: meter, norm: U.num(c[4]), tank: U.num(c[5]),
            fuel: c[6] || self.data.settings.fuel,
            serviceEvery: U.num(c[7]), meterStart: 0
          });
          added++;
        }
      }
      return { added: added, kind: isFuel ? 'fuel' : 'units' };
    },

    /* принимает 01.02.2026 / 2026-02-01 / 1.2.26 */
    parseDate: function (s) {
      s = String(s || '').trim();
      if (!s) return null;
      var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0');
      m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/);
      if (m) {
        var y = +m[3]; if (y < 100) y += 2000;
        return y + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');
      }
      return null;
    },

    csvRows: function (rows) {
      return '﻿' + rows.map(function (r) {
        return r.map(function (x) { return '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"'; }).join(';');
      }).join('\n');
    },

    /* журнал топлива одной таблицей */
    exportCSV: function () {
      var self = this;
      var TYPE = { fill: 'заправка', intake: 'приход на склад', check: 'замер бака',
        tankcheck: 'замер склада', drain: 'слив' };
      var rows = [['Дата', 'Операция', 'Техника', 'Госномер', 'Водитель', 'Литров', 'Цена за литр', 'Сумма', 'Откуда', 'Счётчик', 'Топливо', 'Заметка']];
      this.data.fuel.forEach(function (f) {
        var u = self.unit(f.unitId);
        rows.push([
          f.date, TYPE[f.type] || f.type, u ? u.name : '', u ? u.plate || '' : '',
          self.driverName(f.driverId), U.dec(f.liters, 1), f.price || '', Math.round(U.num(f.sum)),
          f.type === 'fill' ? (f.source === 'tank' ? self.data.settings.tankName : 'АЗС') : '',
          f.meter != null ? f.meter : '', f.fuel || '', f.note || ''
        ]);
      });
      return this.csvRows(rows);
    },

    /* смены отдельной таблицей */
    exportShiftsCSV: function () {

      var rows = [['Дата', 'Техника', 'Госномер', 'Водитель', 'Объект', 'Начало', 'Конец', 'Наработка', 'Единица', 'Норма расхода, л', 'Заметка']];

          U.dec(wk, 1), U.meterInfo(u.meter).unit, U.dec(CALC.normFor(u, wk), 1), s.note || ''
        ]);

    /* сводка по технике за период */
    exportReportCSV: function (from, to) {
      var self = this;
      var rows = [['Техника', 'Госномер', 'Наработка', 'Единица', 'Норма расхода, л', 'Залито, л',
        'Отклонение по замерам, л', 'Слито, л', 'Потеряно всего, л', 'Средний расход',
        'Топливо, деньги', 'ТО и ремонты', 'Себестоимость наработки']];
      this.data.units.forEach(function (u) {

        rows.push([

          U.dec(r.drained, 1), U.dec(r.lost, 1),
          r.actualRate != null ? U.dec(r.actualRate, 1) : '', Math.round(r.money),
          Math.round(r.serviceCost), r.costPerWork != null ? Math.round(r.costPerWork) : ''
        ]);
      });
      return this.csvRows(rows);

          programs: [

        { id: 'u6', name: 'Автокран XCMG 25 т', plate: '01 B 777 CA', kind: 'crane', meter: 'km',
          norm: 32, tank: 350, fuel: 'ДТ', serviceEvery: 12000, driverId: null, meterStart: 41200,
          tankStart: 250, active: true, note: 'Работает по заявкам',

      db.units.forEach(function (u) { meters[u.id] = u.meterStart; tankLeft[u.id] = u.tankStart; });

        '<div class="d">' + U.cnt(f.problems.length, 'единица', 'единицы', 'единиц') + ' техники теряет топливо' +
        (price ? '. Это примерно <b>' + U.money(lost * price) + '</b> за месяц' : '') + '.' +
        (f.drained > 0 ? ' Из них <b>' + U.liters(f.drained) + '</b> — зафиксированные сливы.' : '') + '</div>' +
        '<div class="minilist">' +
        f.problems.slice(0, 4).map(function (p) {
          return '<button class="mini tap" data-act="unit" data-id="' + p.unit.id + '">' +
            '<span>' + esc(p.unit.name) + '</span><b>' + U.liters(p.problemLiters) + '</b></button>';

    h += '<div class="stats">' +
      '<div class="stat"><div class="k"><span class="dot" style="background:var(--blue)"></span>Наработка</div>' +
      '<div class="v num">' + (f.workHours ? U.work(f.workHours, 'hours') : U.work(f.workKm, 'km')) + '</div>' +
      '<div class="k" style="margin-top:2px">' +
      (f.workHours && f.workKm ? 'и ' + U.work(f.workKm, 'km') : U.cnt(f.shiftDays, 'смена', 'смены', 'смен')) + '</div></div>' +

      '<div class="stat"><div class="k"><span class="dot" style="background:' + (f.deviation < -1 ? 'var(--red)' : 'var(--accent)') + '"></span>' +
      (f.deviation ? 'По замерам' : 'Сверх нормы') + '</div>' +
      '<div class="v num" style="color:' + ((f.deviation < -1 || (!f.deviation && f.over > 0)) ? 'var(--red)' : 'var(--accent)') + '">' +
      (f.deviation ? U.liters(f.deviation, { sign: true }) : U.liters(f.over, { sign: true })) + '</div>' +
      '<div class="k" style="margin-top:2px">' + (f.deviation ? 'недостача в баках' : 'залито минус норма') + '</div></div>' +

      '<div class="stat"><div class="k"><span class="dot" style="background:var(--violet)"></span>Склад ГСМ</div>' +
      '<div class="v num">' + U.liters(tank.left) + '</div>' +
      '<div class="k" style="margin-top:2px">' + (tank.volume > 0
        ? Math.round(tank.left / tank.volume * 100) + '% ёмкости' : 'остаток в ёмкости') + '</div></div>' +

      '<div class="stat"><div class="k"><span class="dot" style="background:var(--orange)"></span>Нужно ТО</div>' +
      '<div class="v num" style="color:' + (f.serviceOverdue.length ? 'var(--red)' : 'inherit') + '">' +
      (f.serviceOverdue.length + f.serviceSoon.length || '—') + '</div>' +
      '<div class="k" style="margin-top:2px">' + (f.serviceOverdue.length ? f.serviceOverdue.length + ' просрочено' : 'из ' + units.length + ' единиц') + '</div></div>' +
      '</div>';

    h += '<div class="btn-row"><button class="btn" data-act="new-fill">⛽ Заправка</button>' +
      '<button class="btn sec" data-act="new-shift">🕒 Смена</button></div>';

    if (f.serviceOverdue.length || f.serviceSoon.length) {
      h += '<h2 class="sec">Обслуживание</h2><div class="list">';
      f.serviceOverdue.concat(f.serviceSoon).slice(0, 6).forEach(function (s) {
        var u = s.unit;
        h += '<button class="row tap" data-act="unit" data-id="' + u.id + '">' + V.unitIcon(u) +
          '<span class="grow"><span class="ttl">' + esc(u.name) + '</span>' +
          '<span class="sub">' + esc(s.service.name) + ' · ' + (s.service.overdue
            ? '<b style="color:var(--red)">просрочено на ' + V.svcLeft(s.service, u) + '</b>'
            : 'осталось ' + V.svcLeft(s.service, u)) + '</span></span>' +
          '<span class="val"><span class="v1 num">' + U.work(s.meterNow, u.meter) + '</span>' +
          '<span class="v2">счётчик</span></span>' +
          '<span class="chev">' + V.ICON.chev + '</span></button>';
      });
      h += '</div>';
    }

    var feed = CALC.feed(6);
    if (feed.length) {
      h += '<h2 class="sec">Последние записи<button class="act" data-act="go-log">Весь журнал</button></h2><div class="list">';
      feed.forEach(function (x) { h += V.opRow(x); });
      h += '</div>';
    }

    if (!st.lastExport || U.diffDays(st.lastExport, U.today()) > 14) {
      h += '<div class="card pad" style="margin-top:22px">' +
        '<div style="font-weight:600;margin-bottom:4px">Сделайте резервную копию</div>' +
        '<div style="font-size:14px;color:var(--text-2);line-height:1.4">База хранится только на этом телефоне. ' +
        'Сохраните файл копии в «Файлы» или отправьте себе — тогда данные не пропадут при смене телефона.</div>' +
        '<button class="btn sec sm full" style="margin-top:12px" data-act="export-json">Сохранить копию</button></div>';
    }

    return h + '</div>';
  };

  /* ============ ТЕХНИКА ============ */
  V.unitsFilter = 'all';
  V.unitsQuery = '';

  V.units = function () {
    var all = DB.units();
    var from = U.monthStart(U.today()), to = U.today();
    var over = all.filter(function (u) { return CALC.unitPeriod(u, from, to).problem; });
    var serv = all.filter(function (u) {
      var s = CALC.unitState(u).service;
      return s.overdue || s.soon;
    });
    var work = all.filter(function (u) { return u.active !== false; });

    var list = V.unitsFilter === 'over' ? over : V.unitsFilter === 'service' ? serv :
      V.unitsFilter === 'work' ? work : all;

    var q = V.unitsQuery.trim().toLowerCase();
    if (q) {
      list = list.filter(function (u) {
        return (u.name + ' ' + (u.plate || '') + ' ' + (u.note || '')).toLowerCase().indexOf(q) >= 0;
      });
    }
    list = list.slice().sort(function (a, b) {
      var pa = CALC.unitPeriod(a, from, to), pb = CALC.unitPeriod(b, from, to);
      if (pa.problem !== pb.problem) return pa.problem ? -1 : 1;
      return a.name.localeCompare(b.name, 'ru');
    });

    var h = V.topbar('Техника', '<button data-act="new-unit" style="font-size:26px;font-weight:300">＋</button>');
    h += '<div class="wrap"><h1 class="big">Техника</h1>';

    if (!all.length) {
      h += V.empty('🚜', 'Техники пока нет',
        'Добавьте первую единицу: название, норма расхода и объём бака — этого достаточно, чтобы начать.',
        '<div style="margin-top:18px"><button class="btn" data-act="new-unit">Добавить технику</button></div>');
      return h + '</div>';
    }

    if (all.length > 5) {
      h += '<div class="search">' + V.ICON.search +
        '<input id="qu" type="search" placeholder="Название, госномер" value="' + esc(V.unitsQuery) + '" autocomplete="off"></div>';
    }
    h += '<div class="seg">' +
      seg('all', 'Вся', all.length) +
      seg('work', 'В работе', work.length) +
      seg('over', 'Перерасход', over.length) +
      seg('service', 'ТО', serv.length) + '</div>';

    if (!list.length) {
      h += V.empty('🔍', 'Ничего не найдено', q ? 'Попробуйте другой запрос.' : 'В этой вкладке пусто — и это хорошо.');
    } else {
      h += '<div class="list">';
      list.forEach(function (u) { h += V.unitRow(u, from, to); });
      h += '</div>';
      h += '<div class="hint">Цифра справа — сколько залито за ' + U.monthName(U.monthKey(to), true).toLowerCase() + '.</div>';
    }
    return h + '</div>';

    function seg(k, t, n) {
      return '<button data-act="ufilter" data-f="' + k + '" class="' + (V.unitsFilter === k ? 'on' : '') + '">' +
        t + (n ? ' <span class="cnt">' + n + '</span>' : '') + '</button>';
    }
  };

  /* ============ ЖУРНАЛ ============ */
  V.logFilter = 'all';
  V.logQuery = '';
  V.logLimit = 60;

  V.log = function () {
    var feed = CALC.feed();
    var f = V.logFilter;
    if (f !== 'all') {
      feed = feed.filter(function (x) {
        if (f === 'fill') return x.kind === 'fuel' && (x.op.type === 'fill');
        if (f === 'shift') return x.kind === 'shift';
        if (f === 'leak') return x.kind === 'fuel' && x.op.type === 'drain';
        if (f === 'tank') return x.kind === 'fuel' &&
          (x.op.type === 'intake' || x.op.type === 'tankcheck' || (x.op.type === 'drain' && !x.op.unitId));
        if (f === 'service') return x.kind === 'service';
        return true;
      });
    }
    var q = V.logQuery.trim().toLowerCase();
    if (q) {
      feed = feed.filter(function (x) {
        var u = DB.unit(x.op.unitId);
        var s = [u ? u.name : '', u ? u.plate : '', DB.driverName(x.op.driverId),
          x.op.note || '', x.op.site || '', x.op.date].join(' ').toLowerCase();
        return s.indexOf(q) >= 0;
      });
    }

    var h = V.topbar('Журнал', '<button data-act="add-menu" style="font-size:26px;font-weight:300">＋</button>');
    h += '<div class="wrap"><h1 class="big">Журнал</h1>';
    h += '<div class="search">' + V.ICON.search +
      '<input id="ql" type="search" placeholder="Техника, водитель, объект" value="' + esc(V.logQuery) + '" autocomplete="off"></div>';
    h += '<div class="seg">' + sg('all', 'Всё') + sg('fill', 'Заправки') + sg('shift', 'Смены') +
      sg('leak', 'Сливы') + sg('tank', 'Склад') + sg('service', 'ТО') + '</div>';

    if (!feed.length) {
      h += V.empty('📋', 'Записей нет',
        q ? 'Попробуйте другой запрос.' : 'Внесите первую заправку или смену — они появятся здесь.',
        q ? '' : '<div style="margin-top:18px"><button class="btn" data-act="new-fill">Внести заправку</button>' +
        '<button class="btn sec" style="margin-top:8px" data-act="new-shift">Внести смену</button></div>');
      return h + '</div>';
    }

    /* группировка по месяцам с итогом сверху */
    var groups = {}, order = [];
    feed.slice(0, V.logLimit).forEach(function (x) {
      var k = U.monthKey(x.date);
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(x);
    });
    var byM = CALC.byMonth();
    order.forEach(function (k) {
      var m = byM[k] || {};
      var parts = [];
      if (m.filled) parts.push('залито ' + U.liters(m.filled));
      if (m.workHours) parts.push(U.work(m.workHours, 'hours'));
      if (m.workKm) parts.push(U.work(m.workKm, 'km'));
      h += '<h2 class="sec">' + esc(U.monthName(k)) +
        (parts.length ? '<span class="act" style="color:var(--text-2)">' + parts.join(' · ') + '</span>' : '') + '</h2>';
      h += '<div class="list">';
      groups[k].forEach(function (x) { h += V.opRow(x); });
      h += '</div>';
    });
    if (feed.length > V.logLimit) {
      h += '<button class="btn sec" style="margin-top:14px" data-act="log-more">Показать ещё · осталось ' +
        (feed.length - V.logLimit) + '</button>';
    }
    return h + '</div>';

    function sg(k, t) {
      return '<button data-act="lfilter" data-f="' + k + '" class="' + (V.logFilter === k ? 'on' : '') + '">' + t + '</button>';
    }
  };

  /* ============ СКЛАД ГСМ ============ */
  V.tank = function () {
    var st = DB.data.settings;
    var t = CALC.tankState();
    var from = U.monthStart(U.today()), to = U.today();
    var f = CALC.fleet(from, to);

    var h = V.topbarBack('Склад ГСМ');
    h += '<div class="wrap"><h1 class="big">Склад ГСМ</h1>';
    h += '<div class="hero">' +
      '<div class="lbl">' + esc(st.tankName || 'Ёмкость') + ' · остаток по расчёту</div>' +
      '<div class="amt num">' + U.liters(t.left) + '</div>' +
      (t.volume > 0 ? '<div class="delta">' + Math.round(t.left / t.volume * 100) + '% от ' + U.liters(t.volume) + '</div>' +
        '<div class="bar"><i style="width:' + Math.round((t.pct || 0) * 100) + '%"></i></div>' : '') +
      '</div>';

    h += '<div class="btn-row"><button class="btn" data-act="new-intake">Приход топлива</button>' +
      '<button class="btn sec" data-act="new-tankcheck">Замер остатка</button></div>';

    h += '<h2 class="sec">За ' + U.monthName(U.monthKey(to), true).toLowerCase() + '</h2><div class="card pad">' +
      V.kv('Пришло на склад', U.liters(f.intake)) +
      V.kv('Выдано в технику', U.liters(f.rows.reduce(function (a, r) { return a + r.filledTank; }, 0))) +
      V.kv('Заправлено на АЗС', U.liters(f.rows.reduce(function (a, r) { return a + r.filledAzs; }, 0))) +
      V.kv('Куплено топлива на', U.money(f.intakeMoney)) +
      '</div>';

    if (t.checks.length) {
      h += '<h2 class="sec">Замеры в ёмкости</h2><div class="list">';
      t.checks.slice().reverse().forEach(function (c) {
        h += '<button class="row tap" data-act="op-fuel" data-id="' + c.id + '">' +
          '<span class="op-ic">📏</span><span class="grow"><span class="ttl">' + U.fmtDate(c.date, true) + '</span>' +
          '<span class="sub">' + (c.hasBase
            ? (c.deviation < -0.5 ? '<b style="color:var(--red)">недостача ' + U.liters(-c.deviation) + '</b>'
              : c.deviation > 0.5 ? 'излишек ' + U.liters(c.deviation) : 'сходится')
            : 'точка отсчёта') + '</span></span>' +
          '<span class="val"><span class="v1 num">' + U.liters(c.found) + '</span>' +
          '<span class="v2">по расчёту ' + U.liters(c.expected) + '</span></span></button>';
      });
      h += '</div>';
      h += '<div class="hint">Замер — это точка опоры: после него расчёт начинается заново от реального остатка. ' +
        'Разница между замером и расчётом и есть недостача.</div>';
    } else {
      h += '<div class="hint">Сделайте замер остатка в ёмкости — тогда приложение сможет показывать недостачу на складе.</div>';
    }

    var ops = CALC.feed().filter(function (x) {
      return x.kind === 'fuel' && (x.op.type === 'intake' || x.op.type === 'tankcheck' ||
        (x.op.type === 'fill' && x.op.source === 'tank'));
    }).slice(0, 30);
    if (ops.length) {
      h += '<h2 class="sec">Движение топлива</h2><div class="list">';
      ops.forEach(function (x) { h += V.opRow(x); });
      h += '</div>';
    }
    return h + '</div>';
  };

  /* ============ ВОДИТЕЛИ ============ */
  V.drivers = function () {
    var from = U.monthStart(U.today()), to = U.today();
    var rows = CALC.byDriver(from, to);
    var map = {};
    rows.forEach(function (r) { map[r.id] = r; });

    var h = V.topbarBack('Водители', '<button data-act="new-driver" style="font-size:26px;font-weight:300">＋</button>');
    h += '<div class="wrap"><h1 class="big">Водители</h1>';
    var list = DB.drivers();
    if (!list.length) {
      h += V.empty('👷', 'Список пуст',
        'Водитель создаётся сам, когда вы вписываете его в смену или заправку — или добавьте вручную.',
        '<div style="margin-top:18px"><button class="btn" data-act="new-driver">Добавить водителя</button></div>');
      return h + '</div>';
    }
    h += '<div class="list">';
    list.slice().sort(function (a, b) {
      var ra = map[a.id] || { norm: 0 }, rb = map[b.id] || { norm: 0 };
      return rb.norm - ra.norm;
    }).forEach(function (d) {
      var r = map[d.id] || { shifts: 0, workHours: 0, workKm: 0, filled: 0 };
      var wk = [];
      if (r.workHours) wk.push(U.work(r.workHours, 'hours'));
      if (r.workKm) wk.push(U.work(r.workKm, 'km'));
      h += '<button class="row tap" data-act="driver" data-id="' + d.id + '">' + V.avatar(d.name) +
        '<span class="grow"><span class="ttl">' + esc(d.name) + '</span>' +
        '<span class="sub">' + (r.shifts ? U.cnt(r.shifts, 'смена', 'смены', 'смен') + ' за месяц' +
          (wk.length ? ' · ' + wk.join(' · ') : '') : (d.phone ? esc(d.phone) : 'смен за месяц нет')) + '</span></span>' +
        '<span class="val"><span class="v1 num">' + U.liters(r.filled) + '</span><span class="v2">залито</span></span>' +
        '<span class="chev">' + V.ICON.chev + '</span></button>';
    });
    h += '</div>';
    return h + '</div>';
  };

  /* ============ ОТЧЁТЫ ============ */
  V.reportMonth = null;
  V.reportTab = 'units';

  V.report = function () {
    var mk = V.reportMonth || U.monthKey(U.today());
    var from = mk + '-01', to = U.monthEnd(from);
    var f = CALC.fleet(from, to);
    var byM = CALC.byMonth();

    var h = V.topbarBack('Отчёт');
    h += '<div class="wrap"><h1 class="big">Отчёт</h1>';

    h += '<div class="monthnav"><button data-act="rep-month" data-d="-1">‹</button>' +
      '<span>' + esc(U.monthName(mk)) + '</span>' +
      '<button data-act="rep-month" data-d="1"' + (mk >= U.monthKey(U.today()) ? ' disabled' : '') + '>›</button></div>';

    h += '<div class="card pad">' +
      V.kv('Залито в технику', U.liters(f.filled), 'big') +
      V.kv('Потрачено на топливо', U.money(f.money)) +
      V.kv('По норме положено', U.liters(f.norm)) +
      V.kv('Недостача по замерам', (f.deviation < -0.5
        ? '<span style="color:var(--red)">' + U.liters(-f.deviation) + '</span>' : '—')) +
      (f.drained ? V.kv('Зафиксировано сливов',
        '<span style="color:var(--red)">' + U.liters(f.drained) + '</span>') : '') +
      (f.workHours ? V.kv('Наработка, моточасы', U.work(f.workHours, 'hours')) : '') +
      (f.workKm ? V.kv('Пробег', U.work(f.workKm, 'km')) : '') +
      V.kv('Пришло на склад', U.liters(f.intake)) +
      V.kv('ТО и ремонты', U.money(f.serviceCost)) +
      '</div>';

    h += '<div class="seg" style="margin-top:14px">' +
      rt('units', 'Техника') + rt('drivers', 'Водители') + rt('sites', 'Объекты') + rt('months', 'Месяцы') + '</div>';

    if (V.reportTab === 'units') {
      var rows = f.rows.slice().filter(function (r) { return r.work > 0 || r.filled > 0; })
        .sort(function (a, b) { return b.filled - a.filled; });
      if (!rows.length) h += V.empty('📊', 'За этот месяц записей нет', 'Выберите другой месяц.');
      else {
        h += '<div class="list">';
        rows.forEach(function (r) {
          var u = r.unit;
          var dev = r.checkCount ? r.deviation : null;
          h += '<button class="row tap" data-act="unit" data-id="' + u.id + '">' + V.unitIcon(u) +
            '<span class="grow"><span class="ttl">' + esc(u.name) + '</span>' +
            '<span class="sub">' + U.work(r.work, u.meter) +
            (r.actualRate ? ' · факт ' + U.normText(r.actualRate, u.meter) : ' · норма ' + U.liters(r.norm)) +
            '</span></span>' +
            '<span class="val"><span class="v1 num">' + U.liters(r.filled) + '</span>' +
            '<span class="v2"' + (r.problem ? ' style="color:var(--red)"' : '') + '>' +
            (dev != null ? (dev < -0.5 ? 'недостача ' + U.liters(-dev) : 'сходится') : U.moneyShort(r.money)) +
            '</span></span><span class="chev">' + V.ICON.chev + '</span></button>';
        });
        h += '</div>';
      }
    } else if (V.reportTab === 'drivers') {
      var dr = CALC.byDriver(from, to);
      if (!dr.length) h += V.empty('👷', 'Смен за месяц нет', 'Выберите другой месяц.');
      else {
        h += '<div class="list">';
        dr.forEach(function (r) {
          var wk = [];
          if (r.workHours) wk.push(U.work(r.workHours, 'hours'));
          if (r.workKm) wk.push(U.work(r.workKm, 'km'));
          h += '<div class="row">' + V.avatar(r.name) +
            '<span class="grow"><span class="ttl">' + esc(r.name) + '</span>' +
            '<span class="sub">' + U.cnt(r.shifts, 'смена', 'смены', 'смен') +
            (wk.length ? ' · ' + wk.join(' · ') : '') + ' · норма ' + U.liters(r.norm) + '</span></span>' +
            '<span class="val"><span class="v1 num">' + U.liters(r.filled) + '</span>' +
            '<span class="v2"' + (r.over > Math.max(15, r.norm * 0.03) ? ' style="color:var(--red)"' : '') + '>' +
            (r.filled ? U.liters(r.over, { sign: true }) + ' к норме' : 'заправок нет') + '</span></span></div>';
        });
        h += '</div>';
        h += '<div class="hint">«К норме» — разница между тем, что водитель залил, и тем, что положено по его сменам. ' +
          'Небольшой разброс — это остаток в баке, устойчивый плюс — повод проверить.</div>';
      }
    } else if (V.reportTab === 'sites') {
      var si = CALC.bySite(from, to);
      if (!si.length) h += V.empty('📍', 'Смен за месяц нет', 'Выберите другой месяц.');
      else {

    };

    }

    var h = '<div class="list">' + unitSelect(d.unitId) + driverSelect(d.driverId) +
      '<div class="field"><label>Дата</label><input id="f-date" type="date" value="' + esc(d.date) + '"></div>' +

    h += '<h2 class="sec">Топливо</h2><div class="list">' +
      '<div class="field"><label>Литров</label><input id="f-liters" type="text" inputmode="decimal" placeholder="0" value="' +
      (d.liters || '') + '"><span class="unit">л</span></div>' +

      '<div class="field"><label>Вид</label><select id="f-fuel">' +
      DB.FUELS.map(function (x) {
        return '<option value="' + esc(x) + '"' + ((d.fuel || st.fuel) === x ? ' selected' : '') + '>' + esc(x) + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field"><label>Счётчик</label><input id="f-meter" type="text" inputmode="decimal" placeholder="необязательно" value="' +
      (d.meter != null && d.meter !== '' ? d.meter : '') + '"><span class="unit" id="u-m">м·ч</span></div>' +
      '</div>';

    h += '<div class="seg" id="f-source" style="margin-top:12px">' +
      '<button data-s="tank" class="' + (d.source !== 'azs' ? 'on' : '') + '">Со склада</button>' +
      '<button data-s="azs" class="' + (d.source === 'azs' ? 'on' : '') + '">На АЗС</button></div>';

    h += '<div class="list"><div class="field col"><label>Заметка</label>' +
      '<textarea id="f-note" placeholder="Номер талона, чек, кто выдал…">' + esc(d.note || '') + '</textarea></div></div>';

    h += '<div class="card pad" id="preview" style="margin-top:16px"></div>';

    App.sheet({
      title: op ? 'Изменить заправку' : 'Заправка',
      html: h, save: op ? 'Сохранить' : 'Записать',
      onOpen: function (bd) {
        var $ = function (x) { return bd.querySelector(x); };
        watchDriverSelect(bd);
        function source() { var b = bd.querySelector('#f-source .on'); return b ? b.dataset.s : 'tank'; }
        function preview() {
          var u = DB.unit($('#f-unit').value);
          if (!u) return;
          $('#u-m').textContent = U.meterInfo(u.meter).unit;
          var lit = U.num($('#f-liters').value), price = U.num($('#f-price').value);
          var before = CALC.tankLeft(u, $('#f-date').value).left;
          if (op) before -= U.num(op.liters);            // при правке не считаем саму себя дважды
          var after = before + lit;
          var over = U.num(u.tank) > 0 && after > U.num(u.tank) * 1.03;
          var tank = CALC.tankState();
          var html = V.kv('Сумма', U.money(lit * price), 'big') +
            V.kv('В баке было', U.liters(before)) +
            V.kv('Станет', (over ? '<span style="color:var(--orange)">' + U.liters(after) + '</span>' : U.liters(after)) +
              (U.num(u.tank) ? ' <span style="color:var(--text-2);font-weight:400">из ' + U.liters(u.tank) + '</span>' : ''));
          if (source() === 'tank') html += V.kv('Останется на складе', U.liters(tank.left - lit + (op && op.source === 'tank' ? U.num(op.liters) : 0)));
          if (over) html += '<div class="hint" style="padding:8px 0 0"><b>В бак столько не влезет.</b> ' +
            'Либо в баке было меньше, чем считает приложение, либо часть топлива уходит мимо — стоит сделать замер.</div>';
          $('#preview').innerHTML = html;
        }
        bd.addEventListener('input', preview);
        bd.addEventListener('change', function (e) {
          if (e.target.id === 'f-unit') {
            var u = DB.unit(e.target.value);
            if (u && !op) {
              if (u.driverId) $('#f-driver').value = u.driverId;
              if (u.fuel) $('#f-fuel').value = u.fuel;
            }
          }
          preview();
        });
        bd.addEventListener('click', function (e) {
          var b = e.target.closest('#f-source [data-s]');
          if (!b) return;
          U.$$('#f-source button', bd).forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          preview();
        });
        preview();
        if (!op) setTimeout(function () { $('#f-liters').focus(); }, 380);
      },
      onSave: function (bd) {
        var $ = function (x) { return bd.querySelector(x); };
        var lit = U.num($('#f-liters').value);
        if (lit <= 0) { U.toast('Сколько литров залили?'); return false; }
        var drv = resolveDriver(bd);
        if (drv === '__error') { U.toast('Введите имя водителя'); return false; }
        var sb = bd.querySelector('#f-source .on');
        var rec = {
          type: 'fill', unitId: $('#f-unit').value, driverId: drv,
          date: $('#f-date').value || U.today(),
          liters: lit, price: U.num($('#f-price').value),
          sum: lit * U.num($('#f-price').value),
          source: sb ? sb.dataset.s : 'tank',
          meter: $('#f-meter').value !== '' ? U.num($('#f-meter').value) : null,
          fuel: $('#f-fuel').value, note: $('#f-note').value.trim()
        };
        if (op) { DB.updFuel(op.id, rec); U.toast('Заправка изменена'); }
        else { DB.addFuel(rec); U.toast('Записано: ' + U.liters(lit)); }
        App.render();
        return true;
      }
    });
  };
