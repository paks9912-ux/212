<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>SAKURA — Суши и роллы · доставка по Ташкенту</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#272c37;
  --tx:#eef1f6; --tx2:#9aa3b2; --tx3:#6b7484;
  --accent:#ff4d4d; --accent-tx:#fff;
  --ok:#2fbf71; --warn:#f5a524; --danger:#f2544b;
  --r:16px; --sh:0 6px 24px rgba(0,0,0,.35);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-t="light"]{
  --bg:#f6f7f9; --card:#fff; --card2:#f0f2f5; --line:#e4e7ec;
  --tx:#12151b; --tx2:#5b6472; --tx3:#8b94a3; --sh:0 6px 24px rgba(16,24,40,.10);
}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(96px + var(--safe-b));
  overscroll-behavior-y:none;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}

/* ---------- header ---------- */
.hero{position:relative;padding:18px 0 14px;background:
   radial-gradient(120% 100% at 50% 0%, color-mix(in srgb,var(--accent) 26%, transparent) 0%, transparent 70%);}
.hrow{display:flex;align-items:center;gap:12px}
.logo{width:56px;height:56px;border-radius:16px;flex:0 0 auto;display:grid;place-items:center;
  font-size:28px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.hname{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0}
.htag{color:var(--tx2);font-size:13px;margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.badge{background:var(--card);border:1px solid var(--line);color:var(--tx2);
  padding:6px 10px;border-radius:999px;font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.badge b{color:var(--tx);font-weight:600}
.badge.on{color:var(--ok)} .badge.off{color:var(--danger)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.themebtn{position:absolute;top:18px;right:14px;width:34px;height:34px;border-radius:10px;
  background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:15px}

/* ---------- category tabs ---------- */
.tabs{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%, transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin-top:14px}
.tabsIn{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:10px 14px;max-width:720px;margin:0 auto}
.tabsIn::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);color:var(--tx2);font-size:13.5px;font-weight:600;transition:.15s}
.tab.act{background:var(--accent);border-color:var(--accent);color:var(--accent-tx)}

/* ---------- menu ---------- */
.cat{padding-top:22px;scroll-margin-top:58px}
.cath{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0 0 3px}
.catd{color:var(--tx3);font-size:12.5px;margin-bottom:12px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:11px;margin-bottom:10px}
.ph{width:84px;height:84px;border-radius:12px;flex:0 0 auto;overflow:hidden;
  display:grid;place-items:center;font-size:32px;background:var(--card2)}
.ph img{width:100%;height:100%;object-fit:cover}
.ib{flex:1;min-width:0;display:flex;flex-direction:column}
.iname{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.idesc{color:var(--tx2);font-size:12.5px;margin-top:3px;line-height:1.35}
.imeta{color:var(--tx3);font-size:11.5px;margin-top:3px}
.irow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px}
.price{font-weight:800;font-size:15px;white-space:nowrap}
.price s{color:var(--tx3);font-weight:500;font-size:12px;margin-right:5px}
.add{background:var(--accent);color:var(--accent-tx);font-weight:700;font-size:13px;
  padding:8px 16px;border-radius:10px;white-space:nowrap;transition:.12s}
.add:active{transform:scale(.95)}
.qty{display:flex;align-items:center;gap:2px;background:var(--card2);border-radius:10px;padding:3px}
.qty button{width:30px;height:30px;border-radius:8px;font-size:17px;font-weight:700;
  display:grid;place-items:center;background:var(--card);color:var(--accent)}
.qty span{min-width:26px;text-align:center;font-weight:700;font-size:14px}
.tagline{align-self:flex-start;display:inline-block;background:color-mix(in srgb,var(--accent) 18%, transparent);
  color:var(--accent);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-bottom:4px}

/* ---------- cart bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 14px calc(10px + var(--safe-b));
  background:color-mix(in srgb,var(--bg) 90%, transparent);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);transform:translateY(130%);transition:.25s}
.bar.show{transform:none}
.barIn{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;
  background:var(--accent);color:var(--accent-tx);border-radius:14px;padding:13px 16px;box-shadow:var(--sh)}
.barIn b{font-size:15px} .barIn small{opacity:.85;font-size:12px;display:block}
.barIn .go{margin-left:auto;font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}

/* ---------- sheet ---------- */
.ov{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--bg);
  border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
.sheet.show{transform:none}
.sh{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.sh h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.x{margin-left:auto;width:32px;height:32px;border-radius:9px;background:var(--card2);
  display:grid;place-items:center;font-size:15px;color:var(--tx2)}
.sb{overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}
.sf{padding:12px 16px calc(14px + var(--safe-b));border-top:1px solid var(--line);background:var(--bg)}

.crow{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border:0}
.cn{flex:1;min-width:0} .cn div:first-child{font-weight:600;font-size:14px}
.cn small{color:var(--tx3);font-size:12px}
.sum{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:var(--tx2)}
.sum b{color:var(--tx);font-weight:700}
.sum.tot{font-size:17px;color:var(--tx);padding-top:11px;margin-top:5px;border-top:1px solid var(--line)}
.sum.tot b{font-size:19px;font-weight:800}
.hint{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;font-size:12.5px;color:var(--tx2);margin:10px 0}
.hint b{color:var(--accent)}
.prog{height:5px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:7px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:.3s}

label.f{display:block;margin-bottom:11px}
label.f span{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:5px;font-weight:600}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:12px 13px;font-size:15px;outline:none;transition:.15s;color:var(--tx)}
.inp:focus{border-color:var(--accent)}
.inp.bad{border-color:var(--danger)}
textarea.inp{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 13px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  font-size:13.5px;color:var(--tx2);font-weight:600;transition:.15s}
.chip.act{background:color-mix(in srgb,var(--accent) 16%, transparent);border-color:var(--accent);color:var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--accent);color:var(--accent-tx);font-weight:800;font-size:15.5px;
  padding:15px;border-radius:13px;transition:.12s}
.btn:active{transform:scale(.985)}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line);font-size:14.5px;padding:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.split{display:flex;gap:9px;margin-top:9px}
.split .btn{flex:1}
.empty{text-align:center;padding:40px 20px;color:var(--tx3)}
.empty div:first-child{font-size:42px;margin-bottom:10px}

.foot{text-align:center;color:var(--tx3);font-size:12px;padding:26px 14px 12px;line-height:1.7}
.foot a{color:var(--tx2);text-decoration:none;border-bottom:1px solid var(--line)}
.links{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.links a{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);font-size:19px;text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(104px + var(--safe-b));transform:translate(-50%,20px);
  background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:11px;font-size:13.5px;
  font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:560px){.ph{width:100px;height:100px}}
</style>
</head>
<body>
<div class="wrap">

<script>

me":"Кока-кола 0,5","price":12000,"emoji":"🥤","id":"i3_0"},{"name":"Чай зелёный","weight":"400 мл","price":15000,"emoji":"🍵","id":"i3_1"},{"name":"Вода без газа 0,5","price":7000,"emoji":"💧","id":"i3_2"}]}]};
(function () {
'use strict';
var S = window.SHOP, $ = function (id) { return document.getElementById(id); };
var CART = {}, PAY = null, WHEN = 'asap', MODE = 'delivery';
var CKEY = 'menu.cart.' + (S.id || 'shop');

/* ---------------- helpers ---------------- */
function money(n) {
  n = Math.round(n || 0);
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}
function cur(n) { return money(n) + ' ' + (S.currency || 'сум'); }
function esc(s) { return String(s == null ? '' : s).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }); }
function toast(t) {

}

  if (!S.hours || !S.hours.from) return null;
  var p = function (t) { var a = String(t).split(':'); return (+a[0]) * 60 + (+(a[1] || 0)); };
  var d = new Date(), now = d.getHours() * 60 + d.getMinutes();
  var f = p(S.hours.from), t = p(S.hours.to);
  return t > f ? (now >= f && now < t) : (now >= f || now < t);
}

function loadCart() { try { CART = JSON.parse(localStorage.getItem(CKEY)) || {}; } catch (e) { CART = {}; } }

/* ---------------- render: header ---------------- */
function renderHead() {

  if (d.zone) b.push('<span class="badge">📍 ' + esc(d.zone) + '</span>');
  $('badges').innerHTML = b.join('');

  var L = [];
  if (S.phone) L.push('<a href="tel:' + esc(S.phone) + '" title="Позвонить">📞</a>');
  if (S.telegram) L.push('<a href="https://t.me/' + esc(S.telegram) + '" target="_blank" rel="noopener" title="Telegram">✈️</a>');

function renderTabs() {

}
function renderMenu() {
  $('menu').innerHTML = (S.categories || []).map(function (c, n) {
    return '<section class="cat" id="c' + n + '"><h2 class="cath">' + esc(c.name) + '</h2>' +
      (c.desc ? '<div class="catd">' + esc(c.desc) + '</div>' : '') +
      (c.items || []).map(function (i) {

  if (!n) return;
  $('barIn').innerHTML = '<div><b>' + cur(total()) + '</b><small>' + n + ' ' +
    (n % 10 === 1 && n % 100 !== 11 ? 'товар' : (n % 10 > 1 && n % 10 < 5 && (n % 100 < 10 || n % 100 > 20) ? 'товара' : 'товаров')) +
    '</small></div><span class="go">Оформить →</span>';
  $('barIn').onclick = openCart;
}

/* ---------------- sheet ---------------- */
function openSheet(view, title) {
  $('sheet')._view = view; $('sheetTitle').textContent = title;
  $('ov').classList.add('show'); $('sheet').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  $('ov').classList.remove('show'); $('sheet').classList.remove('show');
  document.body.style.overflow = '';
}
$('ov').onclick = closeSheet; $('sheetX').onclick = closeSheet;

function openCart() {
  openSheet('cart', 'Ваш заказ');
  var rows = [];
  for (var k in CART) {
    var i = findItem(k); if (!i) continue;
    rows.push('<div class="crow"><div class="ph" style="width:52px;height:52px;font-size:22px;border-radius:10px">' +
      (i.img ? '<img src="' + esc(i.img) + '" alt="">' : (i.emoji || '🍽')) + '</div>' +
      '<div class="cn"><div>' + esc(i.name) + '</div><small>' + cur(i.price) + '</small></div>' +
      '<div class="qty"><button data-m="' + i.id + '">−</button><span>' + CART[i.id] + '</span><button data-p="' + i.id + '">+</button></div></div>');
  }
  if (!rows.length) {
    $('sheetBody').innerHTML = '<div class="empty"><div>🛒</div>Корзина пуста</div>';
    $('sheetFoot').innerHTML = ''; return;
  }
  var d = S.delivery || {}, left = (d.freeFrom || 0) - goods(), htm = rows.join('');
  if (MODE === 'delivery' && d.freeFrom && left > 0) {
    htm += '<div class="hint">До бесплатной доставки <b>' + cur(left) + '</b>' +
      '<div class="prog"><i style="width:' + Math.min(100, goods() / d.freeFrom * 100) + '%"></i></div></div>';
  }
  htm += '<div class="sum"><span>Блюда</span><b>' + cur(goods()) + '</b></div>';
  if (MODE === 'delivery') htm += '<div class="sum"><span>Доставка</span><b>' + (deliveryFee() ? cur(deliveryFee()) : 'бесплатно') + '</b></div>';
  htm += '<div class="sum tot"><span>Итого</span><b>' + cur(total()) + '</b></div>';
  $('sheetBody').innerHTML = htm;

  var min = +(d.minOrder || 0), okMin = !(MODE === 'delivery' && min && goods() < min);
  $('sheetFoot').innerHTML = (okMin ? '' : '<div class="hint" style="margin-top:0">Минимальный заказ на доставку — <b>' + cur(min) + '</b></div>') +
    '<button class="btn" id="toCheckout"' + (okMin ? '' : ' disabled') + '>Продолжить</button>' +
    '<div class="split"><button class="btn sec" id="clearCart">Очистить</button></div>';
  [].forEach.call($('sheetBody').querySelectorAll('[data-p]'), function (b) { b.onclick = function () { setQty(b.dataset.p, (CART[b.dataset.p] || 0) + 1); }; });
  [].forEach.call($('sheetBody').querySelectorAll('[data-m]'), function (b) { b.onclick = function () { setQty(b.dataset.m, (CART[b.dataset.m] || 0) - 1); }; });
  $('toCheckout').onclick = openCheckout;
  $('clearCart').onclick = function () { CART = {}; saveCart(); renderMenu(); renderBar(); closeSheet(); };
}

/* ---------------- checkout ---------------- */
function openCheckout() {
  openSheet('checkout', 'Оформление');
  var pays = S.payments || ['Наличными курьеру', 'Картой курьеру', 'Перевод на карту'];
  var pick = S.pickup !== false;
  $('sheetBody').innerHTML =
    (pick ? '<label class="f"><span>Способ получения</span><div class="chips" id="modeC">' +
      '<button class="chip act" data-mode="delivery">🛵 Доставка</button>' +
      '<button class="chip" data-mode="pickup">🏃 Самовывоз</button></div></label>' : '') +
    '<label class="f"><span>Ваше имя</span><input class="inp" id="fName" placeholder="Как к вам обращаться" autocomplete="name"></label>' +
    '<label class="f"><span>Телефон</span><input class="inp" id="fPhone" type="tel" placeholder="+998 __ ___ __ __" autocomplete="tel"></label>' +
    '<div id="addrBox"><label class="f"><span>Адрес доставки</span><textarea class="inp" id="fAddr" placeholder="Улица, дом, подъезд, квартира, ориентир"></textarea></label></div>' +
    '<label class="f"><span>Когда</span><div class="chips" id="whenC">' +
      '<button class="chip act" data-when="asap">Как можно скорее</button>' +
      '<button class="chip" data-when="time">Ко времени</button></div></label>' +
    '<div id="timeBox" style="display:none"><label class="f"><span>Время</span><input class="inp" id="fTime" type="time"></label></div>' +
    '<label class="f"><span>Оплата</span><div class="chips" id="payC">' +
      pays.map(function (p, n) { return '<button class="chip' + (n === 0 ? ' act' : '') + '" data-pay="' + esc(p) + '">' + esc(p) + '</button>'; }).join('') +
    '</div></label>' +
    '<label class="f"><span>Комментарий</span><textarea class="inp" id="fNote" placeholder="Пожелания к заказу"></textarea></label>' +
    '<div class="sum tot"><span>К оплате</span><b id="ckTotal">' + cur(total()) + '</b></div>';
  PAY = pays[0];

  function chips(box, attr, cb) {
    var el = $(box); if (!el) return;
    [].forEach.call(el.children, function (b) {
      b.onclick = function () {
        [].forEach.call(el.children, function (x) { x.classList.remove('act'); });
        b.classList.add('act'); cb(b.dataset[attr]);
      };
    });
  }
  chips('modeC', 'mode', function (v) {
    MODE = v; $('addrBox').style.display = v === 'pickup' ? 'none' : '';
    $('ckTotal').textContent = cur(total());
  });
  chips('whenC', 'when', function (v) { WHEN = v; $('timeBox').style.display = v === 'time' ? '' : 'none'; });
  chips('payC', 'pay', function (v) { PAY = v; });

  var ch = S.channels || {};
  var btns = '';
  if (ch.whatsapp !== false && S.whatsapp) btns += '<button class="btn" id="sendWA">💬 Отправить заказ в WhatsApp</button>';
  if (ch.telegram !== false && S.telegram) btns += '<button class="btn ' + (S.whatsapp ? 'sec' : '') + '" id="sendTG" style="margin-top:9px">✈️ Отправить заказ в Telegram</button>';
  if (S.phone) btns += '<div class="split"><button class="btn sec" id="sendCall">📞 Позвонить</button><button class="btn sec" id="copyOrd">📋 Копировать</button></div>';
  $('sheetFoot').innerHTML = btns || '<div class="hint">Контакты не заданы</div>';
  if ($('sendWA')) $('sendWA').onclick = function () { send('wa'); };
  if ($('sendTG')) $('sendTG').onclick = function () { send('tg'); };
  if ($('sendCall')) $('sendCall').onclick = function () { if (validate()) location.href = 'tel:' + S.phone; };
  if ($('copyOrd')) $('copyOrd').onclick = function () { if (validate()) copy(orderText()) && toast('Заказ скопирован'); };
}

function validate() {
  var ok = true, n = $('fName'), p = $('fPhone'), a = $('fAddr');
  [n, p, a].forEach(function (e) { if (e) e.classList.remove('bad'); });
  if (!n.value.trim()) { n.classList.add('bad'); ok = false; }
  if (String(p.value).replace(/\D/g, '').length < 9) { p.classList.add('bad'); ok = false; }
  if (MODE === 'delivery' && a && !a.value.trim()) { a.classList.add('bad'); ok = false; }
  if (!ok) toast('Заполните имя, телефон и адрес');
  return ok;
}

function orderText() {
  var L = [];
  L.push('🧾 НОВЫЙ ЗАКАЗ — ' + S.name);
  L.push('');
  L.push('👤 ' + $('fName').value.trim());
  L.push('📞 ' + $('fPhone').value.trim());
  if (MODE === 'delivery') L.push('📍 Доставка: ' + $('fAddr').value.trim().replace(/\s+/g, ' '));
  else L.push('🏃 Самовывоз' + (S.address ? ' — ' + S.address : ''));
  L.push('🕐 ' + (WHEN === 'time' && $('fTime').value ? 'Ко времени: ' + $('fTime').value : 'Как можно скорее'));
  L.push('💳 ' + PAY);
  L.push('');
  L.push('———————————');
  var n = 1;
  for (var k in CART) {
    var i = findItem(k); if (!i) continue;
    L.push(n++ + '. ' + i.name + ' × ' + CART[k] + ' — ' + cur(i.price * CART[k]));
  }
  L.push('———————————');
  L.push('Блюда: ' + cur(goods()));
  if (MODE === 'delivery') L.push('Доставка: ' + (deliveryFee() ? cur(deliveryFee()) : 'бесплатно'));
  L.push('ИТОГО: ' + cur(total()));
  var note = $('fNote').value.trim();
  if (note) { L.push(''); L.push('💬 ' + note); }
  return L.join('\n');
}

function copy(t) {
  try {
    if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(t); return true; }
    var a = document.createElement('textarea');
    a.value = t; a.style.position = 'fixed'; a.style.opacity = '0';
    document.body.appendChild(a); a.select(); document.execCommand('copy'); document.body.removeChild(a);
    return true;
  } catch (e) { return false; }
}

function send(how) {
  if (!validate()) return;
  var t = orderText();
  if (how === 'wa') {
    var ph = String(S.whatsapp).replace(/\D/g, '');
    window.open('https://wa.me/' + ph + '?text=' + encodeURIComponent(t), '_blank');
  } else {
    /* Telegram не поддерживает предзаполнение текста в личный чат по ссылке,
       поэтому кладём заказ в буфер обмена и открываем чат. */
    copy(t);
    toast('Заказ скопирован — вставьте его в чат');
    setTimeout(function () { window.open('https://t.me/' + S.telegram, '_blank'); }, 700);
  }
  CART = {}; saveCart(); renderMenu(); renderBar(); closeSheet();
  setTimeout(function () { toast('Спасибо! Отправьте сообщение — и мы примем заказ'); }, 1400);
}

/* ---------------- theme + scroll spy ---------------- */
(function theme() {
  var k = 'menu.theme', v = null;
  try { v = localStorage.getItem(k); } catch (e) { }
  if (v) document.documentElement.dataset.t = v;
  else if (S.theme === 'light') document.documentElement.dataset.t = 'light';
  $('themebtn').onclick = function () {
    var cu = document.documentElement.dataset.t === 'light' ? '' : 'light';
    document.documentElement.dataset.t = cu;
    try { localStorage.setItem(k, cu); } catch (e) { }
  };
})();
window.addEventListener('scroll', function () {
  var tabs = $('tabs').children, best = 0;
  (S.categories || []).forEach(function (c, n) {
    var el = $('c' + n); if (el && el.getBoundingClientRect().top - 70 <= 0) best = n;
  });
  [].forEach.call(tabs, function (b, n) { b.classList.toggle('act', n === best); });
}, { passive: true });

/* ---------------- boot ---------------- */
loadCart();
for (var k in CART) if (!findItem(k)) delete CART[k];
renderHead(); renderTabs(); renderMenu(); renderBar();
})();
</script>
</body>
</html>
