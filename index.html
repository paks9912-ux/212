<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Construction Control — демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --bg-soft:#f7f8f9;
  --surface:#ffffff;
  --ink:#0d0f12;
  --graphite:#3a4048;
  --muted:#767e88;
  --line:#e5e8eb;
  --line-strong:#d3d8dd;
  --red:#c8322b;
  --red-soft:#fdf1f0;
  --amber:#b7801a;
  --amber-soft:#fdf7ec;
  --green:#1f7a4d;
  --green-soft:#eff8f3;
  --radius:10px;
  --sidebar:248px;
  --shadow:0 1px 2px rgba(13,15,18,.04),0 8px 24px rgba(13,15,18,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg-soft);
  color:var(--ink);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
table{border-collapse:collapse;width:100%}
h1{font-size:38px;line-height:1.15;letter-spacing:-.022em;font-weight:600}
h2{font-size:25px;line-height:1.2;letter-spacing:-.018em;font-weight:600}
h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.mono-label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;height:100vh;z-index:40;
}
.brand{padding:22px 20px 18px;border-bottom:1px solid var(--line)}
.brand-mark{display:flex;align-items:center;gap:9px}
.brand-dot{width:9px;height:9px;border-radius:2px;background:var(--ink)}
.brand-name{font-size:12.5px;font-weight:700;letter-spacing:.12em}
.brand-sub{margin-top:6px;font-size:11px;color:var(--muted);letter-spacing:.02em}
.demo-chip{display:inline-block;margin-top:10px;padding:2px 7px;border:1px solid var(--line-strong);border-radius:4px;
  font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav-item{
  width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;
  font-size:13.5px;color:var(--graphite);text-align:left;transition:background .14s,color .14s;
}
.nav-item:hover{background:var(--bg-soft)}
.nav-item.active{background:#101318;color:#fff;font-weight:500}
.nav-item .ico{width:16px;text-align:center;font-size:13px;opacity:.85}
.nav-item .badge{margin-left:auto;font-size:10.5px;font-weight:600;background:var(--red);color:#fff;
  padding:1px 6px;border-radius:20px}
.nav-item.active .badge{background:#fff;color:#101318}
.sidebar-foot{padding:14px 20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:7px;
  box-shadow:0 0 0 3px rgba(31,122,77,.12)}

.main{flex:1;margin-left:var(--sidebar);min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:14px 34px;display:flex;align-items:center;gap:18px;
}
.topbar h1{font-size:15px;font-weight:600;letter-spacing:.01em}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.date-pill{font-size:12px;font-weight:600;letter-spacing:.07em;color:var(--graphite)}
.role-switch{display:flex;gap:2px;max-width:100%;overflow-x:auto;background:var(--bg-soft);border:1px solid var(--line);border-radius:8px;padding:3px}
.role-switch button{padding:5px 10px;border-radius:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.role-switch button.active{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.burger{display:none}
.content{padding:30px 34px 70px;max-width:1360px;width:100%}

/* ---------- Blocks ---------- */
.page-head{margin-bottom:26px}
.page-head .sub{color:var(--muted);margin-top:7px;font-size:14px}
.section{margin-top:34px}
.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.section-head .mono-label{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:20px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.split{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.kpi .v{font-size:34px;font-weight:600;letter-spacing:-.02em;margin-top:10px;line-height:1}
.kpi .v.red{color:var(--red)}.kpi .v.amber{color:var(--amber)}.kpi .v.green{color:var(--green)}
.kpi .foot{margin-top:8px;font-size:12px;color:var(--muted)}

.stat{padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.stat .v{font-size:23px;font-weight:600;margin-top:8px;letter-spacing:-.015em}

.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--ink);transition:width .8s cubic-bezier(.22,1,.36,1)}
.bar.green > i{background:var(--green)}.bar.amber > i{background:var(--amber)}.bar.red > i{background:var(--red)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.gray{background:var(--bg-soft);color:var(--muted)}

th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:0 14px 10px;border-bottom:1px solid var(--line)}
td{padding:14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr.clickable{cursor:pointer;transition:background .12s}
tbody tr.clickable:hover{background:var(--bg-soft)}
.tbl-wrap{overflow-x:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;
  font-size:13px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);transition:.15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:#101318;color:#fff;border-color:#101318}
.btn.primary:hover{background:#000}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.btn.danger{border-color:var(--red);color:var(--red)}

.alert{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;
  animation:slideIn .35s ease both}
.alert:last-child{border-bottom:none}
.alert:hover{background:var(--bg-soft)}
.alert .mark{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 8px}
.alert.red .mark{background:var(--red)}.alert.amber .mark{background:var(--amber)}
.alert .t{font-size:12.5px;font-weight:600;letter-spacing:.03em}
.alert .d{font-size:13px;color:var(--graphite);margin-top:3px}
@keyframes slideIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

.forecast{background:#101318;color:#fff;border-radius:var(--radius);padding:26px;position:relative;overflow:hidden}
.forecast .mono-label{color:rgba(255,255,255,.55)}
.forecast .big{font-size:40px;font-weight:600;letter-spacing:-.025em;margin-top:10px;line-height:1}
.forecast .row{display:flex;gap:34px;flex-wrap:wrap;margin-top:22px;padding-top:20px;border-top:1px solid rgba(255,255,255,.14)}
.forecast .row .v{font-size:17px;font-weight:600;margin-top:6px}
.delay-badge{display:inline-block;background:var(--red);color:#fff;padding:4px 10px;border-radius:6px;font-size:13px;font-weight:600}

.reason{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.reason:last-child{border-bottom:none}
.reason .n{font-size:12px;font-weight:600;color:var(--muted);width:22px;flex:none;padding-top:2px}
.reason .h{font-weight:600}
.reason .p{color:var(--graphite);margin-top:4px;font-size:13.5px}

.action{display:flex;align-items:flex-start;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.action:last-child{border-bottom:none}
.action.done{opacity:.5}
.action.done .h{text-decoration:line-through}

.chat{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:14px 16px;
  font-size:14px;line-height:1.6;max-width:520px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600}

.proc-line{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;color:var(--muted);
  opacity:0;transform:translateY(4px);animation:fadeUp .3s ease forwards}
.proc-line.done{color:var(--ink)}
@keyframes fadeUp{to{opacity:1;transform:none}}
.spin{width:13px;height:13px;border:2px solid var(--line-strong);border-top-color:var(--ink);border-radius:50%;
  animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tick{color:var(--green);font-weight:700}

#toasts{position:fixed;right:22px;bottom:22px;z-index:90;display:flex;flex-direction:column;gap:10px;align-items:flex-end;max-width:calc(100% - 44px)}
.toast{background:#101318;color:#fff;padding:14px 18px;
  border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.22);max-width:340px;animation:slideIn .3s ease both}
.toast .t{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:600}
.toast .d{margin-top:5px;font-size:13.5px}

.page{animation:pageIn .28s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chart-svg .ln{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.report-row{display:flex;align-items:center;gap:18px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.report-row:last-child{border-bottom:none}
.report-row:hover{background:var(--bg-soft)}
.report-row .date{font-weight:600;width:64px;flex:none;font-size:12.5px;letter-spacing:.05em}
.report-detail{padding:0 16px 16px;border-bottom:1px solid var(--line);background:var(--bg-soft)}
.backlink{font-size:13px;color:var(--muted);margin-bottom:14px;display:inline-block}
.backlink:hover{color:var(--ink)}
.overlay-note{font-size:12px;color:var(--muted);margin-top:10px}
.legend{display:flex;gap:18px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:16px;height:2px;vertical-align:middle;margin-right:6px}


/* ---------- Инструкции на странице ---------- */
.howto{background:#fbfcfd;border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:22px}
.howto h4{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.howto .lead{font-size:13.5px;color:var(--graphite);margin-bottom:14px;line-height:1.6}
.howto-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.howto-col .mono-label{margin-bottom:8px;display:block}
.howto ol,.howto ul{margin:0;padding-left:18px}
.howto li{font-size:13px;line-height:1.65;color:var(--graphite);margin-bottom:5px}
.howto li strong{color:var(--ink)}
.howto .tip{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}

/* ---------- Раскрываемая расшифровка расчёта ---------- */
details.calc{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-top:14px}
details.calc > summary{cursor:pointer;padding:13px 16px;font-size:13px;font-weight:600;list-style:none;
  display:flex;align-items:center;gap:8px}
details.calc > summary::-webkit-details-marker{display:none}
details.calc > summary::before{content:"＋";font-size:13px;color:var(--muted);width:14px}
details.calc[open] > summary::before{content:"−"}
details.calc > summary:hover{background:var(--bg-soft)}
.calc-body{padding:4px 16px 18px;border-top:1px solid var(--line)}
.calc-step{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.calc-step:last-child{border-bottom:none}
.calc-step .i{flex:0 0 22px;height:22px;border-radius:6px;background:var(--bg-soft);border:1px solid var(--line);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--graphite)}
.calc-step .t{font-size:13px;line-height:1.55;min-width:0;font-weight:500}
.calc-step .f{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.calc-step .r{margin-left:auto;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- Пошаговый гид ---------- */
.guide{position:fixed;left:calc(var(--sidebar) + 24px);right:24px;bottom:20px;z-index:80;
  background:#101318;color:#fff;border-radius:12px;box-shadow:0 18px 44px rgba(13,15,18,.3);
  padding:18px 22px;display:flex;gap:22px;align-items:flex-start;animation:slideIn .3s ease both}
.guide .g-num{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.09em;color:rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:4px 10px;margin-top:2px}
.guide .g-main{flex:1;min-width:0}
.guide .g-title{font-size:16px;font-weight:600;letter-spacing:-.01em}
.guide .g-text{font-size:13.5px;color:rgba(255,255,255,.78);margin-top:6px;line-height:1.6}
.guide .g-do{margin-top:10px;font-size:13px;background:rgba(255,255,255,.09);border-radius:8px;padding:9px 12px;
  display:flex;gap:9px;align-items:flex-start}
.guide .g-do b{color:#fff;font-weight:600}
.guide .g-watch{margin-top:8px;font-size:12.5px;color:rgba(255,255,255,.6)}
.guide .g-nav{display:flex;flex-direction:column;gap:8px;align-items:stretch;flex:0 0 auto}
.guide .g-nav .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.guide .g-nav .btn:hover{border-color:#fff}
.guide .g-nav .btn.primary{background:#fff;color:#101318;border-color:#fff}
.guide .g-close{position:absolute;top:10px;right:12px;font-size:16px;color:rgba(255,255,255,.5)}
.guide .g-close:hover{color:#fff}
.guide .g-bar{height:3px;background:rgba(255,255,255,.15);border-radius:99px;margin-top:14px;overflow:hidden}
.guide .g-bar > i{display:block;height:100%;background:#fff;transition:width .35s ease}
body.guide-on .content{padding-bottom:240px}
body.guide-on #toasts{bottom:220px}
.hl-target{outline:2px solid var(--red);outline-offset:4px;border-radius:8px;
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{outline-color:rgba(200,50,43,.95)}50%{outline-color:rgba(200,50,43,.25)}}
.guide-btn{border:1px solid var(--line-strong);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.guide-btn.on{background:#101318;color:#fff;border-color:#101318}

@media (max-width:860px){
  .howto-cols{grid-template-columns:1fr;gap:14px}
  .guide{left:12px;right:12px;bottom:12px;flex-direction:column;gap:14px;padding:16px}
  .guide .g-nav{flex-direction:row}
  .guide .g-nav .btn{flex:1}
  body.guide-on .content{padding-bottom:360px}
  /* на узком экране панель гида занимает низ — уведомления уходят наверх */
  body.guide-on #toasts{bottom:auto;top:118px;left:12px;right:12px;align-items:stretch;max-width:none}
  .guide .g-nav .btn{white-space:nowrap}
  .guide .g-num{align-self:flex-start}
}

@media (max-width:1100px){
  .split{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:860px){
  .sidebar{transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--shadow)}
  body.nav-open .sidebar{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(13,15,18,.35);z-index:35}
  .main{margin-left:0}
  .burger{display:inline-flex;font-size:19px;padding:2px 6px}
  .topbar{padding:12px 16px;gap:10px;flex-wrap:wrap}
  .topbar-right{width:100%;min-width:0;gap:10px;justify-content:space-between}
  .topbar-right > .small{display:none}
  .role-switch{max-width:100%;min-width:0;-webkit-overflow-scrolling:touch}
  .role-switch .small{display:none}
  .report-row{flex-wrap:wrap;gap:8px 14px}
  .report-row .date{width:auto}
  .report-row > span:last-child{margin-left:auto}
  .section-head{flex-wrap:wrap;gap:8px}
  .page-head h1{word-break:break-word}
  .content{padding:20px 16px 60px}
  h1{font-size:27px}
  .g4,.g3,.g2{grid-template-columns:1fr 1fr}
  .role-switch{width:100%;overflow-x:auto;order:3}
  /* tables -> cards */
  table.responsive thead{display:none}
  table.responsive tr{display:block;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;padding:6px 12px}
  table.responsive td{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line);text-align:right}
  table.responsive td:last-child{border-bottom:none}
  table.responsive td::before{content:attr(data-l);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);font-weight:600;text-align:left}
}
@media (max-width:420px){
  .g4,.g3,.g2{grid-template-columns:1fr}
  .forecast .big{font-size:32px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><span class="brand-dot"></span><span class="brand-name">AI CONSTRUCTION CONTROL</span></div>
      <div class="brand-sub">Мониторинг строительных объектов на базе AI</div>
      <span class="demo-chip">ДЕМО-ДАННЫЕ</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot"><span class="status-dot"></span>Система работает</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Меню">☰</button>
      <h1 id="topTitle">Обзор</h1>
      <div class="topbar-right">
        <button class="guide-btn" id="guideBtn">▶ Гид по демо</button>
        <div class="role-switch" id="roleSwitch"></div>
        <span class="date-pill" id="todayPill"></span>
        <span class="small"><span class="status-dot"></span>Система работает</span>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="toasts"></div>
<div id="guide"></div>
<script>
/* =============================================================================
   AI CONSTRUCTION CONTROL — DEMO / MVP
   -----------------------------------------------------------------------------
   Frontend-only prototype. All data below is synthetic DEMO DATA.
   No real companies, customers, financials or AI models are involved.

   FUTURE ARCHITECTURE (nothing here is connected yet — see markers below):
     [INTEGRATION:TELEGRAM]   Telegram Bot API -> raw foreman messages / voice notes
     [INTEGRATION:STT]        Speech-to-Text  -> voice message -> text
     [INTEGRATION:CLAUDE]     Claude API      -> text -> structured report + cause analysis
     [INTEGRATION:N8N]        n8n webhooks    -> orchestration between the above
     [INTEGRATION:DB]         PostgreSQL / Supabase -> persistence + history
     [INTEGRATION:STORAGE]    File / photo storage  -> site photos attached to reports
   The data layer (DB), the compute layer (Forecast) and the render layer (UI)
   are kept separate on purpose, so each marker can be replaced independently.
============================================================================= */

/* ============================== 1. DATA MODEL ============================== */

/* ============================== 2. FORECAST LOGIC ==========================
   Plain, transparent JavaScript. No "AI" is involved in any number below.
   AI (later, via [INTEGRATION:CLAUDE]) is only used to parse free text and to
   explain causes — never to compute plan/fact/forecast.
============================================================================ */
const DAY = 86400000;
const d = s => { const [y,m,dd] = s.split('-').map(Number); return new Date(y, m-1, dd); };
const daysBetween = (a,b) => Math.round((b - a) / DAY);
const addDays = (dt,n) => new Date(dt.getTime() + Math.round(n)*DAY);
const MONTHS = ['ЯНВ','ФЕВ','МАР','АПР','МАЙ','ИЮН','ИЮЛ','АВГ','СЕН','ОКТ','НОЯ','ДЕК'];
const fmtDate = dt => `${String(dt.getDate()).padStart(2,'0')} ${MONTHS[dt.getMonth()]} ${dt.getFullYear()}`;
const fmtShort = dt => `${String(dt.getDate()).padStart(2,'0')} ${MONTHS[dt.getMonth()]}`;
const n0 = v => Math.round(v).toLocaleString('ru-RU');
const n1 = v => (Math.round(v*10)/10).toLocaleString('ru-RU');
/** Русское склонение: plural(2,'каток','катка','катков') -> 'катка' */
const plural = (n, one, few, many) => {
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return many;
  if(b > 1 && b < 5)   return few;
  if(b === 1)          return one;
  return many;
};

function reportsOf(projectId){
  return DB.dailyReports.filter(r => r.projectId === projectId)
                        .sort((a,b) => d(a.date) - d(b.date));
}

/** Actual completed volume = pre-window volume + every report we hold. */
function actualVolume(p){
  const rs = reportsOf(p.id);
  if(!rs.length) return p.actualVolume;
  return (DB.volumeBeforeWindow[p.id] || 0) + rs.reduce((s,r) => s + r.production, 0);
}

/** Forecast base date = the last day we have data for (falls back to today). */
function asOf(p){
  const rs = reportsOf(p.id);
  return rs.length ? d(rs[rs.length-1].date) : TODAY;
}

/** averageDailyProduction = mean production over the last 7 reported days. */
function avgRate(p){
  const rs = reportsOf(p.id);
  if(!rs.length) return p.recentRate;
  const last = rs.slice(-7);
  return last.reduce((s,r) => s + r.production, 0) / last.length;
}

/**
 * Core computation for one project.
 *   remainingVolume        = totalVolume - actualCompletedVolume
 *   averageDailyProduction = mean of the last 7 daily reports
 *   forecastDays           = remainingVolume / averageDailyProduction
 *   forecastCompletionDate = today + forecastDays
 *   delayDays              = forecastCompletionDate - plannedCompletionDate
 */
function compute(p){
  const planned    = d(p.plannedCompletion);
  const start      = d(p.startDate);
  const ref        = asOf(p);                                  // last day with data
  const plannedRate = p.totalVolume / p.durationDays;          // m² per day, flat plan
  const elapsed    = Math.max(0, daysBetween(start, ref));
  const plannedVol = Math.min(p.totalVolume, elapsed * plannedRate);
  const actualVol  = actualVolume(p);

  const plannedPct = plannedVol / p.totalVolume * 100;
  const actualPct  = actualVol  / p.totalVolume * 100;
  const deviation  = actualPct - plannedPct;

  const remaining  = Math.max(0, p.totalVolume - actualVol);
  const rate       = avgRate(p);
  const daysToPlan = Math.max(1, daysBetween(ref, planned));
  const requiredRate = remaining / daysToPlan;

  const forecastDays = remaining > 0 ? remaining / rate : 0;
  const forecastDate = addDays(ref, forecastDays);
  const delayDays    = Math.round(daysBetween(planned, forecastDate));

  // Risk is derived from schedule deviation — never hand-written.
  let risk = 'normal';
  if(delayDays > 7) risk = 'critical';
  else if(delayDays > 2) risk = 'warning';

  return { plannedRate, plannedVol, actualVol, plannedPct, actualPct, deviation,
           remaining, rate, requiredRate, forecastDays, forecastDate, delayDays,
           risk, planned, start, ref, elapsed, daysToPlan };
}

const RISK_LABEL = { normal:'В графике', warning:'Риск', critical:'Критично' };
const RISK_CLASS = { normal:'green',    warning:'amber',   critical:'red' };
const project = id => DB.projects.find(p => p.id === id);

function portfolio(){
  const rows = DB.projects.map(p => ({ p, c: compute(p) }));
  const total  = rows.reduce((s,r) => s + r.p.totalVolume, 0);
  const actual = rows.reduce((s,r) => s + r.c.actualVol, 0);
  return {
    rows,
    overall: actual / total * 100,
    onTrack:  rows.filter(r => r.c.risk === 'normal').length,
    atRisk:   rows.filter(r => r.c.risk === 'warning').length,
    critical: rows.filter(r => r.c.risk === 'critical').length
  };
}

function materialRows(){
  return DB.materials.map(m => {
    const daysLeft = m.stock / m.dailyUse;                     // на сколько дней хватит
    const orderBy  = addDays(TODAY, daysLeft - m.leadTime);     // крайняя дата заявки
    const orderQty = Math.max(0, Math.ceil((m.buffer * m.dailyUse - m.stock) / 10) * 10); // до целевого запаса
    const status = daysLeft < 4 ? 'critical' : daysLeft < 6 ? 'warning' : 'normal';
    return { ...m, daysLeft, status, orderBy, orderQty, runsOut: addDays(TODAY, daysLeft) };
  });
}

/* --------------------------- Alerts (derived) ----------------------------- */
let LAST_DELAY = {};           // remembers previous forecast to show movement
DB.projects.forEach(p => LAST_DELAY[p.id] = compute(p).delayDays);

function alerts(){
  const out = [];
  portfolio().rows.forEach(({p,c}) => {
    if(c.risk === 'critical' || c.risk === 'warning'){
      const prev = LAST_DELAY[p.id];
      const moved = prev !== undefined && prev !== c.delayDays;
      out.push({
        level: c.risk === 'critical' ? 'red' : 'amber',
        title: p.code,
        text: moved
          ? `Отставание по прогнозу выросло с +${prev} до +${c.delayDays} дн.`
          : `Прогноз завершения на +${c.delayDays} дн. позже плана.`,
        go: () => go('project', p.id)
      });
    }
  });
  materialRows().filter(m => m.status !== 'normal').forEach(m => {
    out.push({
      level: m.status === 'critical' ? 'red' : 'amber',
      title: project(m.projectId).code,
      text: `Запас «${m.name}» ниже ${m.status === 'critical' ? 4 : 6}-дневного буфера — осталось ${n1(m.daysLeft)} дн.`,
      go: () => go('materials')
    });
  });
  DB.equipment.filter(e => e.downtimeWeek >= 10).forEach(e => {
    out.push({ level:'red', title:'ТЕХНИКА',
      text:`Простой «${e.name}» превысил ${Math.floor(e.downtimeWeek)} ч за неделю.`,
      go: () => go('equipment') });
  });
  return out;
}

/* [INTEGRATION:CLAUDE] These sentences are templated from real computed data.
   Later, the same inputs are sent to Claude for a richer written analysis.   */
function insights(){
  const p  = project('P03'), c = compute(p);
  const rs = reportsOf('P03');
  let belowStreak = 0;
  for(let i = rs.length - 1; i >= 0; i--){ if(rs[i].production < c.plannedRate) belowStreak++; else break; }
  const dtWeek = DB.equipment.reduce((s,e) => s + e.downtimeWeek, 0);
  const lostVolume = Math.round(dtWeek / 8 * c.plannedRate);
  const agg = materialRows().find(m => m.id === 'M1');
  return [
    { t:`${p.code} ${belowStreak} дн. подряд идёт ниже планового объёма.`,
      d:`План — ${n0(c.plannedRate)} м²/день; последние ${belowStreak} отчётов в среднем ${n0(rs.slice(-belowStreak).reduce((s,r)=>s+r.production,0)/Math.max(1,belowStreak))} м²/день.` },
    { t:`Простой техники — главный источник потери выработки.`,
      d:`${n1(dtWeek)} ч простоя за последние 7 дней ≈ ${n0(lostVolume)} м² недовыполненного объёма.` },
    { t:`Запас щебня может стать критическим в ближайшие ${Math.floor(agg.daysLeft)}–${Math.ceil(agg.daysLeft)} дн.`,
      d:`${n0(agg.stock)} т на складе при расходе ${n0(agg.dailyUse)} т/день на ${project(agg.projectId).code}.` },
    { t:`При текущем темпе объект будет завершён на ${c.delayDays} дн. позже плана.`,
      d:`Остаток ${n0(c.remaining)} м² ÷ ${n0(c.rate)} м²/день = ${Math.round(c.forecastDays)} дн. → ${fmtDate(c.forecastDate)}.` }
  ];
}

function howto(key){
  let h = HOWTO[key]; if(h && h.ref) h = HOWTO[h.ref];
  if(!h) return '';
  return `
  <div class="howto">
    <h4>${esc(h.title)}</h4>
    <div class="lead">${h.lead}</div>
    <div class="howto-cols">
      <div class="howto-col"><span class="mono-label">Что на экране</span><ul>${h.what.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="howto-col"><span class="mono-label">Как читать</span><ul>${h.read.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="howto-col"><span class="mono-label">Что сделать сейчас</span><ol>${h.do.map(x=>`<li>${x}</li>`).join('')}</ol></div>
    </div>
    ${h.tip ? `<div class="tip">Подсказка: ${h.tip}</div>` : ''}
  </div>`;
}

function go(page, param){
  state.page = page; state.param = param || null; state.openReport = null;
  document.body.classList.remove('nav-open');

  render();
}

function toast(title, text){
  const t = document.createElement('div');
  t.className = 'toast';

/* Animated number counter (subtle, enterprise-appropriate). */
function countUp(node){
  const to = parseFloat(node.dataset.to), dec = +(node.dataset.dec || 0), suf = node.dataset.suf || '';
  const t0 = performance.now(), dur = 650;
  (function step(now){
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    node.textContent = (to * e).toLocaleString('ru-RU',{minimumFractionDigits:dec, maximumFractionDigits:dec}) + suf;
    if(k < 1) requestAnimationFrame(step);
  })(performance.now());
}
const cnt = (v, dec=0, suf='') =>
  `<span class="num" data-count data-to="${v}" data-dec="${dec}" data-suf="${suf}">0${suf}</span>`;

/* -------------------------- planned vs actual chart ----------------------- */
function chart(p, c){
  const W = 640, H = 230, PL = 44, PB = 26, PT = 12, PR = 10;
  const rs = reportsOf(p.id);
  const days = Math.ceil(Math.max(p.durationDays, c.elapsed + c.forecastDays)) + 2;
  const x = day => PL + (day / days) * (W - PL - PR);
  const y = pct => PT + (1 - pct / 100) * (H - PT - PB);

  // Plan line: flat plannedRate from day 0 to duration.
  const planPts = [[x(0), y(0)], [x(p.durationDays), y(100)], [x(days), y(100)]];

  // Actual line: cumulative volume from the pre-window baseline through reports.
  const pts = [];
  if(rs.length){
    let cum = DB.volumeBeforeWindow[p.id] || 0;
    const firstDay = daysBetween(c.start, d(rs[0].date)) - 1;
    pts.push([x(firstDay), y(cum / p.totalVolume * 100)]);
    rs.forEach(r => { cum += r.production;
      pts.push([x(daysBetween(c.start, d(r.date))), y(cum / p.totalVolume * 100)]); });
  } else {
    pts.push([x(0), y(0)], [x(c.elapsed), y(c.actualPct)]);
  }
  // Forecast continuation (dashed)
  const fc = [[x(c.elapsed), y(c.actualPct)], [x(c.elapsed + c.forecastDays), y(100)]];
  const path = a => a.map((q,i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');

  return `
  <svg class="chart-svg" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="План и факт по прогрессу">
    ${[0,25,50,75,100].map(v => `
      <line x1="${PL}" x2="${W-PR}" y1="${y(v)}" y2="${y(v)}" stroke="#e5e8eb" stroke-width="1"/>
      <text x="${PL-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#767e88">${v}%</text>`).join('')}
    ${[0,0.25,0.5,0.75,1].map(k => `
      <text x="${x(days*k)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#767e88">${Math.round(days*k)} дн</text>`).join('')}
    <line x1="${x(c.elapsed)}" x2="${x(c.elapsed)}" y1="${PT}" y2="${H-PB}" stroke="#0d0f12" stroke-width="1" stroke-dasharray="3 3" opacity=".35"/>
    <text x="${x(c.elapsed)+5}" y="${PT+11}" font-size="10" fill="#0d0f12" opacity=".6">сегодня</text>
    <path class="ln" d="${path(planPts)}" fill="none" stroke="#767e88" stroke-width="2"/>
    <path class="ln" d="${path(fc)}" fill="none" stroke="#c8322b" stroke-width="1.5" stroke-dasharray="5 4" opacity=".55"/>
    <path class="ln" d="${path(pts)}" fill="none" stroke="#c8322b" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>
  <div class="legend">
    <span><i style="background:#767e88"></i>План</span>
    <span><i style="background:#c8322b"></i>Факт</span>
    <span><i style="background:#c8322b;opacity:.5"></i>Прогноз</span>
  </div>`;
}


/** Заголовок задачи: объём заказа подставляется из текущего расчёта по материалу. */
function taskTitle(t){
  if(!t.material) return t.title;
  const m = materialRows().find(x => x.id === t.material);
  return m ? `${t.title} — ${n0(m.orderQty)} ${m.unit}` : t.title;
}

/* ---- Полная расшифровка расчёта: каждое число раскладывается до исходных ---- */
function calcBlock(p, c){
  const rs = reportsOf(p.id), last7 = rs.slice(-7);
  const step = (i, t, f, r) => `
    <div class="calc-step"><span class="i">${i}</span>
      <span class="t">${t}<span class="f">${f}</span></span><span class="r">${r}</span></div>`;
  return `
  <details class="calc">
    <summary>Как посчитан прогноз — 6 шагов с числами</summary>
    <div class="calc-body">
      ${step(1,'Плановый темп по договору','общий объём ÷ срок = ' + n0(p.totalVolume) + ' м² ÷ ' + p.durationDays + ' дн.', n0(c.plannedRate) + ' м²/день')}
      ${step(2,'Сколько должно быть сделано к сегодня','плановый темп × прошло дней = ' + n0(c.plannedRate) + ' × ' + c.elapsed, n0(c.plannedVol) + ' м²')}
      ${step(3,'Сколько сделано фактически','сумма всех ежедневных отчётов', n0(c.actualVol) + ' м²')}
      ${step(4,'Остаток объёма','общий объём − факт = ' + n0(p.totalVolume) + ' − ' + n0(c.actualVol), n0(c.remaining) + ' м²')}
      ${step(5,'Средний темп за последние 7 дней', last7.map(r => n0(r.production)).join(' + ') + ' ÷ ' + last7.length, n0(c.rate) + ' м²/день')}
      ${step(6,'Сколько дней осталось при таком темпе','остаток ÷ средний темп = ' + n0(c.remaining) + ' ÷ ' + n0(c.rate), Math.round(c.forecastDays) + ' дн.')}
      <div class="calc-step" style="border-top:1px solid var(--line);margin-top:6px;padding-top:14px">
        <span class="i">=</span>
        <span class="t"><strong>Прогнозная дата завершения</strong>
          <span class="f">день последнего отчёта (${fmtShort(c.ref)}) + ${Math.round(c.forecastDays)} дн.</span></span>
        <span class="r">${fmtDate(c.forecastDate)}</span></div>
      <div class="calc-step"><span class="i">Δ</span>
        <span class="t"><strong>Отставание от плановой даты</strong>
          <span class="f">${fmtDate(c.forecastDate)} − ${fmtDate(c.planned)}</span></span>
        <span class="r" style="color:${c.delayDays > 2 ? 'var(--red)' : 'var(--green)'}">${c.delayDays > 0 ? '+' : ''}${c.delayDays} дн.</span></div>
      <div class="calc-step"><span class="i">!</span>
        <span class="t"><strong>Уровень риска</strong>
          <span class="f">в графике ≤ 2 дн. &lt; риск ≤ 7 дн. &lt; критично</span></span>
        <span class="r">${RISK_LABEL[c.risk]}</span></div>
      <p class="small" style="margin-top:14px">Требуемый темп считается отдельно: остаток ${n0(c.remaining)} м² ÷ ${c.daysToPlan} дн.
        до плановой даты = <strong>${n0(c.requiredRate)} м²/день</strong>. Разрыв с текущим темпом —
        ${n0(Math.max(0, c.requiredRate - c.rate))} м² в день, это и есть размер проблемы.</p>
    </div>
  </details>`;
}

/* ---------------------- отрисовка и управление гидом ---------------------- */
function renderGuide(){
  const box = el('guide');
  document.body.classList.toggle('guide-on', state.guide);
  const gb = el('guideBtn');
  if(gb){ gb.classList.toggle('on', state.guide); gb.textContent = state.guide ? '✕ Закрыть гид' : '▶ Гид по демо'; }
  if(!state.guide){ box.innerHTML = ''; clearHighlight(); return; }

  const g = GUIDE[state.step], last = state.step === GUIDE.length - 1;
  box.innerHTML = `
    <div class="guide" style="position:fixed">
      <button class="g-close" data-gclose aria-label="Закрыть гид">✕</button>
      <span class="g-num">ШАГ ${state.step + 1} / ${GUIDE.length}</span>
      <div class="g-main">
        <div class="g-title">${esc(g.title)}</div>
        <div class="g-text">${esc(g.text)}</div>
        <div class="g-do"><b>Что сделать:</b><span>${esc(g.action)}</span></div>
        ${g.watch ? `<div class="g-watch">На что смотреть: ${esc(g.watch)}</div>` : ''}
        <div class="g-bar"><i style="width:${(state.step + 1) / GUIDE.length * 100}%"></i></div>
      </div>
      <div class="g-nav">
        <button class="btn sm primary" data-gnext>${last ? 'Пройти заново' : 'Далее →'}</button>
        <button class="btn sm" data-gprev ${state.step === 0 ? 'disabled' : ''}>← Назад</button>
        <button class="btn sm" data-gclose2>Закрыть</button>
      </div>
    </div>`;
  box.querySelector('[data-gnext]').onclick = () => gotoStep(last ? 0 : state.step + 1);
  box.querySelector('[data-gprev]').onclick = () => gotoStep(Math.max(0, state.step - 1));
  box.querySelector('[data-gclose]').onclick  = stopGuide;
  box.querySelector('[data-gclose2]').onclick = stopGuide;
  highlight(g.sel);
}
function clearHighlight(){ document.querySelectorAll('.hl-target').forEach(n => n.classList.remove('hl-target')); }
function highlight(sel){
  clearHighlight();
  if(!sel) return;
  const n = el('view').querySelector(sel) || document.querySelector(sel);
  if(n){ n.classList.add('hl-target'); n.scrollIntoView({ behavior:'smooth', block:'center' }); }
}
function gotoStep(i){
  state.step = i;
  const g = GUIDE[i];
  if(state.page !== g.page || (g.param && state.param !== g.param)){
    state.page = g.page; state.param = g.param || null; state.openReport = null;
    render();
  } else { renderGuide(); }
}
function startGuide(){ state.guide = true; state.role = 'director'; gotoStep(0); }
function stopGuide(){ state.guide = false; state.step = 0; renderGuide(); }

/* ================================ 4. RENDER =============================== */
function render(){
  renderChrome();
  const fn = PAGES[state.page] || pageOverview;
  el('view').innerHTML = fn(state.param);
  el('topTitle').textContent = state.page === 'project'
    ? project(state.param || 'P03').code
    : (NAV[state.page] ? NAV[state.page].label : 'Обзор');
  el('view').querySelectorAll('[data-count]').forEach(countUp);
  bind();
  renderGuide();
}

function bind(){
  const v = el('view');
  v.querySelectorAll('[data-open]').forEach(n => n.onclick = () => go('project', n.dataset.open));
  v.querySelectorAll('[data-back]').forEach(n => n.onclick = () => go('overview'));
  v.querySelectorAll('[data-goinbox]').forEach(n => n.onclick = () => go('reports'));
  v.querySelectorAll('[data-sim]').forEach(n => n.onclick = simulateNewReport);
  v.querySelectorAll('[data-reset]').forEach(n => n.onclick = () => location.reload());

  v.querySelectorAll('[data-alert]').forEach(n => {
    const a = alerts()[+n.dataset.alert];
    if(a) n.onclick = a.go;
  });
  v.querySelectorAll('[data-task]').forEach(n => n.onclick = () => {
    const t = DB.tasks.find(x => x.id === n.dataset.task);
    t.done = true;                       // [INTEGRATION:DB] persist task state
    toast('Действие выполнено', `${taskTitle(t)} — отмечено как выполненное.`);
    render();
  });
  v.querySelectorAll('[data-report]').forEach(n => n.onclick = () => {
    state.openReport = state.openReport === n.dataset.report ? null : n.dataset.report;
    render();
  });
  v.querySelectorAll('[data-process]').forEach(n => n.onclick = () => processReport(n.dataset.process, n));
  v.querySelectorAll('[data-req]').forEach(n => n.onclick = createRequest);
}

/* ============================ 5. DEMO INTERACTIONS ======================== */

/**
 * PROCESS REPORT — visualises the future pipeline:
 *   [INTEGRATION:TELEGRAM] message → [INTEGRATION:STT] transcript →
 *   [INTEGRATION:CLAUDE] structured JSON → [INTEGRATION:DB] insert → forecast recompute.
 * Here every step is local and instantaneous; the delays exist only to make
 * the chain legible during a live demo.
 */
function processReport(inboxId, btn){
  const msg = DB.inbox.find(m => m.id === inboxId);
  if(!msg || msg.processed) return;
  const box = el('proc-' + inboxId);
  LAST_DELAY[msg.projectId] = compute(project(msg.projectId)).delayDays;  // remember pre-update forecast
  const steps = ['Анализируем отчёт…','Извлекаем данные…','Обновляем объект…','Считаем прогноз…'];
  btn.disabled = true; box.innerHTML = '';
  steps.forEach((s,i) => setTimeout(() => {
    box.insertAdjacentHTML('beforeend',
      `<div class="proc-line" id="ps${i}"><span class="spin"></span><span>${s}</span></div>`);
    setTimeout(() => {
      const line = document.getElementById('ps' + i);
      if(line){ line.classList.add('done'); line.querySelector('.spin').outerHTML = '<span class="tick">✓</span>'; }
    }, 620);
  }, i * 700));

  setTimeout(() => {
    box.insertAdjacentHTML('beforeend', `<div class="proc-line done"><span class="tick">✓</span><strong>ГОТОВО</strong></div>`);
    msg.processed = true;
    applyReport(msg.structured, msg.projectId);
    setTimeout(() => { render(); toast('Объект обновлён', 'Отчёт учтён. Прогноз и уровень риска пересчитаны.'); }, 700);
  }, steps.length * 700 + 500);
}

/** Insert a structured report into the data model (idempotent per date). */
function applyReport(s, projectId){
  const [dd,mm,yyyy] = s.date.split('.');
  const iso = `${yyyy}-${mm}-${dd}`;
  if(DB.dailyReports.some(r => r.projectId === projectId && r.date === iso)) return; // already stored
  DB.dailyReports.push({ id:'R' + (DB.dailyReports.length + 1), projectId, date:iso,
    production:s.production, workers:s.workers, trucks:s.trucks, rollers:s.rollers,
    downtime:s.downtime, aggregate:s.aggregate, issue:s.issue });
  const m = DB.materials.find(x => x.projectId === projectId && x.name === 'Щебень');
  if(m) m.stock = s.aggregate;                    // [INTEGRATION:DB] UPDATE materials
}

/**
 * SIMULATE NEW REPORT — the headline demo effect.
 * Adds tomorrow's report with deteriorating numbers, then everything downstream
 * (progress, average rate, forecast, delay, risk, alerts, insights) recomputes.
 */
function simulateNewReport(){
  const p = project('P03');
  const rs = reportsOf('P03');
  const last = rs[rs.length - 1];
  const next = addDays(d(last.date), 1);
  const iso = `${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}-${String(next.getDate()).padStart(2,'0')}`;

  const before = compute(p);
  LAST_DELAY.P03 = before.delayDays;

  const production = Math.max(480, last.production - 180);
  const downtime   = Math.min(9, last.downtime + 2);
  const aggregate  = Math.max(0, last.aggregate - 30);

  DB.dailyReports.push({ id:'R' + (DB.dailyReports.length + 1), projectId:'P03', date:iso,
    production, workers:Math.max(14, last.workers - 1), trucks:Math.max(3, last.trucks - 1),
    rollers:last.rollers, downtime, aggregate,
    issue:'Прораб сообщил о длительном простое техники' });

  // Downstream state that a real backend would update in the same transaction.
  const agg = DB.materials.find(m => m.id === 'M1'); if(agg) agg.stock = aggregate;
  const roller = DB.equipment.find(e => e.id === 'E2');
  roller.downtimeWeek += downtime; roller.downtimeToday = downtime;

  DB.inbox.push({
    id:'IN' + (DB.inbox.length + 1), from:'Иван Петров', role:'Прораб', projectId:'P03',
    time:`${fmtShort(next)} 08:2${DB.inbox.length}`, channel:'Telegram · голосовое сообщение (имитация)',
    text:`Сегодня уложили ${production} квадратов. Каток №2 снова стоял, около ${downtime} часов. Щебня осталось примерно ${aggregate} тонн, нужен срочный завоз.`,
    structured:{ date:iso.split('-').reverse().join('.'), production, workers:Math.max(14,last.workers-1),
      trucks:Math.max(3,last.trucks-1), rollers:last.rollers, downtime, aggregate,
      issue:'Длительный простой техники' },
    processed:true
  });

  const after = compute(p);
  render();
  toast('Новый отчёт обработан',
    `${p.code}: ${n0(production)} м² · темп ${n0(after.rate)} м²/день · прогноз ${fmtShort(after.forecastDate)} (${after.delayDays>0?'+':''}${after.delayDays} дн., было ${before.delayDays>0?'+':''}${before.delayDays} дн.).`);
}

/** CREATE PROCUREMENT REQUEST — [INTEGRATION:DB] would INSERT + notify via n8n. */
function createRequest(){
  const critical = materialRows().sort((a,b) => a.daysLeft - b.daysLeft)[0];
  DB.procurementRequests.unshift({
    material:critical.name, projectId:critical.projectId,
    qty: critical.orderQty,                       // до целевого запаса в buffer дней
    priority: critical.status === 'critical' ? 'Высокий' : 'Обычный',
    created: fmtShort(TODAY), status:'Отправлена',
    need: `Хватает на ${n1(critical.daysLeft)} дн., срок поставки ${critical.leadTime} дн.`,
    supplier: critical.supplier
  });
  const t = DB.tasks.find(x => x.id === 'T2'); if(t && critical.name === 'Щебень') t.done = true;
  render();
  toast('Заявка создана',
    `${critical.name} · ${project(critical.projectId).code} · ${n0(critical.orderQty)} ${critical.unit} · до ${fmtShort(critical.orderBy)}.`);
}
